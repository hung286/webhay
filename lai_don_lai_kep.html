    <script>
        let mathJaxRenderTimeout;
        function renderMathJax() {
            clearTimeout(mathJaxRenderTimeout);
            mathJaxRenderTimeout = setTimeout(() => {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err));
                }
            }, 50);
        }

        function formatCurrency(number) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(number);
        }

        function fmtMoney(num) {
            let str = new Intl.NumberFormat('vi-VN').format(Math.round(num));
            return str.replace(/\./g, '{.}'); // Ngăn MathJax hiểu sai
        }

        function fmtDec(num) {
            let str = Number(num.toPrecision(10)).toString();
            return str.replace('.', '{,}');
        }

        function formatForMathJax(num, isRate) {
            if (isRate) {
                let percent = Number((num * 100).toFixed(6)); 
                return fmtDec(percent) + '\\%'; 
            }
            if (num > 1000 || num < -1000) return fmtMoney(num);
            let dec = Number(num.toFixed(4)); // Đối với số kỳ n
            return fmtDec(dec);
        }

        /* Tự động phẩy hàng nghìn lúc gõ */
        window.formatNumberInput = function(input) {
            if (input.dataset.israte === 'true' || input.dataset.id === 'n') return;
            
            let cursorPosition = input.selectionStart;
            let originalLength = input.value.length;
            
            // Chấp nhận số và dấu trừ (nếu cần)
            let rawValue = input.value.replace(/[^0-9]/g, ''); 
            if (rawValue !== '') {
                input.value = new Intl.NumberFormat('en-US').format(rawValue);
                let newLength = input.value.length;
                cursorPosition = cursorPosition + (newLength - originalLength);
                input.setSelectionRange(cursorPosition, cursorPosition);
            } else {
                input.value = '';
            }
            // Gỡ bỏ hiệu ứng phát sáng nếu đang chỉnh sửa
            input.classList.remove('calculated-glow');
        };

        // Phân tích đầu vào linh hoạt: Nhận cả "." và "," làm thập phân, hỗ trợ phân số
        function parseInput(inputStr, isRate = false) {
            if (inputStr === null || inputStr === undefined || inputStr.trim() === '') return null; // Ký hiệu trống
            
            inputStr = inputStr.trim().replace(/\s/g, '');
            let value = NaN;
            
            if (inputStr.includes('/')) {
                const parts = inputStr.split('/');
                if (parts.length === 2) {
                    const num = parseFloat(parts[0].replace(/,/g, '.'));
                    const den = parseFloat(parts[1].replace(/,/g, '.'));
                    if (!isNaN(num) && !isNaN(den) && den !== 0) value = num / den;
                }
            } else {
                if (isRate || inputStr.includes('.') || inputStr.includes(',')) {
                    // Nếu là rate hoặc có dấu thập phân: xóa dấu phẩy định dạng hàng nghìn (US format)
                    let cleanStr = inputStr;
                    // Lỗi phổ biến: người Việt gõ 0,6 => cần biến thành 0.6 để parse.
                    // Nhưng nếu chuỗi là 20,000,000 thì nó là định dạng phẩy hàng nghìn.
                    // Do ô Lãi suất (isRate) và số kỳ (n) KHÔNG format hàng nghìn, nên dấu ',' chắc chắn là thập phân.
                    if (isRate || !inputStr.match(/\d,\d{3}/)) {
                        cleanStr = cleanStr.replace(/,/g, '.'); 
                    } else {
                        // Nếu là tiền tệ đã format, bỏ dấu phẩy
                        cleanStr = cleanStr.replace(/,/g, '');
                    }
                    value = parseFloat(cleanStr);
                } else {
                    value = parseFloat(inputStr.replace(/,/g, ''));
                }
            }

            if (isRate && !isNaN(value)) return value / 100;
            return value;
        }

        // Phương trình: eqFunc(vars) = 0. Hàm sẽ tìm giá trị missingVar sao cho biểu thức tiến về 0.
        function solveNumeric(eqFunc, missingVar, knownVars) {
            let low = 0;
            let high = 1e12; // Khoảng tìm kiếm mặc định: 1000 tỷ
            
            if (missingVar === 'r') high = 2; // Lãi suất max 200%/kỳ
            if (missingVar === 'n' || missingVar === 'k') high = 2000; // Số kỳ max 2000

            let f = (val) => {
                let v = {...knownVars};
                v[missingVar] = val;
                // Bảo vệ chống chia cho 0 trong các công thức có mẫu số r
                if (v.r === 0) v.r = 1e-10; 
                return eqFunc(v);
            };

            let fLow = f(low);
            let fHigh = f(high);

            // Tự động nhận diện hàm đồng biến hay nghịch biến
            let isIncreasing = fHigh > fLow;

            let mid;
            for (let i = 0; i < 100; i++) {
                mid = (low + high) / 2;
                let fMid = f(mid);
                
                // Độ chính xác mong muốn (càng nhỏ càng chính xác)
                if (Math.abs(fMid) < 1e-4) return mid;

                if (isIncreasing) {
                    if (fMid > 0) high = mid;
                    else low = mid;
                } else {
                    if (fMid > 0) low = mid;
                    else high = mid;
                }
            }
            return mid;
        }

                formula: '$$S = A(1 + r)^n$$',
                template: '$\\displaystyle _S_ = _A_(1 + _r_)^{_n_} $',
                variables: [
                    { id: 'S', label: 'Số tiền cuối kỳ (S)', unit: 'VNĐ' },
                    { id: 'A', label: 'Gốc ban đầu (A)', unit: 'VNĐ' },
                    { id: 'r', label: 'Lãi suất (r)', unit: '%', isRate: true },
                    { id: 'n', label: 'Số chu kỳ (n)', unit: 'chu kỳ' }
                ],
                examples: { S: '', A: 20000000, r: 0.6, n: 12 },

                labels: { S: 'Số tiền thu được (S)', A: 'Tiền gốc ban đầu (A)', r: 'Lãi suất yêu cầu (r)', n: 'Số chu kỳ gửi (n)' }
            },
            {
                id: 'gui-them',
                title: '3. Gửi thêm hàng tháng',
                icon: 'fa-hand-holding-dollar',
                description: 'Mỗi chu kỳ gửi thêm một số tiền đặn đặn vào cuối kỳ, tính theo lãi kép.',
                formula: '$$S = \\frac{A[(1 + r)^n - 1]}{r}(1 + r)$$',
                template: '$\\displaystyle _S_ = \\frac{_A_[(1 + _r_)^{_n_} - 1]}{_r_}(1 + _r_) $',
                variables: [
                    { id: 'S', label: 'Tổng thu được (S)', unit: 'VNĐ' },
                    { id: 'A', label: 'Tiền gửi mỗi chu kỳ (A)', unit: 'VNĐ' },

                ],
                examples: { S: '', A: 2000000, r: 0.6, n: 12 },
                eq: (v) => v.S - (v.A * (Math.pow(1 + v.r, v.n) - 1) / v.r) * (1 + v.r),
                labels: { S: 'Tổng số tiền sau n chu kỳ (S)', A: 'Cần gửi mỗi chu kỳ (A)', r: 'Lãi suất yêu cầu (r)', n: 'Số chu kỳ cần gửi (n)' }

                variables: [
                    { id: 'S', label: 'Tiền còn lại (S)', unit: 'VNĐ' },

                    { id: 'X', label: 'Tiền rút mỗi chu kỳ (X)', unit: 'VNĐ' },
                    { id: 'r', label: 'Lãi suất (r)', unit: '%', isRate: true },
                    { id: 'n', label: 'Số chu kỳ (n)', unit: 'chu kỳ' }
                ],
                examples: { S: '', A: 20000000, X: 1500000, r: 0.6, n: 12 },
                eq: (v) => v.S - (v.A * Math.pow(1 + v.r, v.n) - v.X * ((Math.pow(1 + v.r, v.n) - 1) / v.r)),
                labels: { S: 'Số tiền còn lại (S)', A: 'Gốc ban đầu cần có (A)', X: 'Số tiền rút tối đa (X)', r: 'Lãi suất yêu cầu (r)', n: 'Số chu kỳ rút được (n)' }
            },
            {
                id: 'tra-gop',
                title: '5. Trả góp (gửi góp)',
                icon: 'fa-calendar-check',
                description: 'Đã có vay vốn ban đầu, mỗi chu kỳ lại góp thêm X tiền vào tài khoản.',
                formula: '$$S = A(1 + r)^n + X\\frac{[(1 + r)^n - 1]}{r}$$',
                template: '$\\displaystyle _S_ = _A_(1 + _r_)^{_n_} + _X_\\frac{[(1 + _r_)^{_n_} - 1]}{_r_} $',
                variables: [
                    { id: 'S', label: 'Tổng tiền (S)', unit: 'VNĐ' },
                    { id: 'A', label: 'Vốn vay ban đầu (A)', unit: 'VNĐ' },
                    { id: 'X', label: 'Góp thêm mỗi chu kỳ (X)', unit: 'VNĐ' },
                    { id: 'r', label: 'Lãi suất (r)', unit: '%', isRate: true },
                    { id: 'n', label: 'Số chu kỳ (n)', unit: 'chu kỳ' }
                ],
                examples: { S: '', A: 20000000, X: 2000000, r: 0.6, n: 12 },
                eq: (v) => v.S - (v.A * Math.pow(1 + v.r, v.n) + v.X * ((Math.pow(1 + v.r, v.n) - 1) / v.r)),
                labels: { S: 'Tổng số tiền sau n chu kỳ (S)', A: 'Vốn ban đầu cần có (A)', X: 'Tiền góp mỗi chu kỳ (X)', r: 'Lãi suất yêu cầu (r)', n: 'Số chu kỳ cần góp (n)' }
            },
            {
                id: 'tra-het-no',
                title: '6. Trả hết nợ vay',
                icon: 'fa-file-invoice-dollar',
                description: 'Vay một số tiền A, cần trả đều đặn số tiền X mỗi chu kỳ để sau n chu kỳ thì vừa vặn hết nợ (S=0).',
                formula: '$$X = \\frac{A \\cdot r(1 + r)^n}{(1 + r)^n - 1}$$',
                template: '$\\displaystyle _X_ = \\frac{_A_ \\cdot _r_(1 + _r_)^{_n_}}{(1 + _r_)^{_n_} - 1} $',
                variables: [
                    { id: 'X', label: 'Tiền trả mỗi chu kỳ (X)', unit: 'VNĐ' },
                    { id: 'A', label: 'Tổng nợ ban đầu (A)', unit: 'VNĐ' },
                    { id: 'r', label: 'Lãi suất (r)', unit: '%', isRate: true },
                    { id: 'n', label: 'Số chu kỳ (n)', unit: 'chu kỳ' }
                ],
                examples: { X: '', A: 50000000, r: 0.6, n: 12 },
                eq: (v) => v.X - (v.A * v.r * Math.pow(1 + v.r, v.n)) / (Math.pow(1 + v.r, v.n) - 1),
                labels: { X: 'Số tiền cần trả mỗi chu kỳ (X)', A: 'Số tiền có thể vay tối đa (A)', r: 'Lãi suất vay (r)', n: 'Thời gian cần để trả hết (n)' }
            },
            {
                id: 'tang-luong',
                title: '7. Tăng lương',
                icon: 'fa-arrow-trend-up',
                description: 'Bài toán lãi kép đặc biệt áp dụng cho việc tăng lương hoặc tăng giá trị đều đặn theo tỷ lệ r.',
                formula: '$$S = A(1 + r)^n$$',
                template: '$\\displaystyle _S_ = _A_(1 + _r_)^{_n_} $',
                variables: [
                    { id: 'S', label: 'Lương sau n chu kỳ (S)', unit: 'VNĐ' },
                    { id: 'A', label: 'Lương ban đầu (A)', unit: 'VNĐ' },
                    { id: 'r', label: 'Tỷ lệ tăng (r)', unit: '%', isRate: true },
                    { id: 'n', label: 'Số lần tăng (n)', unit: 'lần' }
                ],
                examples: { S: '', A: 10000000, r: 5, n: 5 },
                eq: (v) => v.S - v.A * Math.pow(1 + v.r, v.n),
                labels: { S: 'Mức lương đạt được (S)', A: 'Mức lương khởi điểm cần (A)', r: 'Tỷ lệ tăng lương cần thiết (r)', n: 'Số lần tăng (n)' }
            }
        ];

        let currentFeatureId = features[0].id;

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-circle-exclamation mr-3 text-lg"></i> <span class="text-sm font-medium leading-snug">${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.add('show'); }, 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function renderFeatureButtons() {
            const container = document.getElementById('feature-buttons');
            container.innerHTML = '';
            
            features.forEach(feature => {
                const btn = document.createElement('button');
                btn.className = `btn-feature px-3 py-2.5 rounded-lg text-[13px] font-bold flex items-center gap-3 ${feature.id === currentFeatureId ? 'active' : ''}`;
                btn.onclick = () => selectFeature(feature.id);
                btn.innerHTML = `<i class="fas ${feature.icon} text-base w-5 text-center"></i> <span>${feature.title}</span>`;
                container.appendChild(btn);
            });
        }

        function selectFeature(id) {
            currentFeatureId = id;
            renderFeatureButtons();
            
            const feature = features.find(f => f.id === id);
            
            document.getElementById('theory-title').innerText = feature.title;
            document.getElementById('theory-desc').innerText = feature.description;
            document.getElementById('theory-formula').innerHTML = feature.formula;

            const inputContainer = document.getElementById('input-fields');
            inputContainer.innerHTML = '';
            
            feature.variables.forEach(v => {
                const group = document.createElement('div');
                group.className = 'input-group relative';
                group.innerHTML = `
                    <label for="${v.id}">${v.label}</label>
                    <div class="relative">
                        <input type="text" id="${v.id}" data-id="${v.id}" class="input-royal pr-12" placeholder="Để trống tính ${v.id}..." data-israte="${v.isRate ? 'true' : 'false'}" oninput="formatNumberInput(this)">
                        <span class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 font-bold text-xs bg-[#f8fafc] px-1">${v.unit}</span>
                    </div>
                `;
                inputContainer.appendChild(group);
            });

            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('result-placeholder').classList.remove('hidden');

            renderMathJax();
        }

        window.fillAllExamples = function() {
            const feature = features.find(f => f.id === currentFeatureId);
            feature.variables.forEach(v => {
                const inputEl = document.getElementById(v.id);
                // Xóa highlight nếu có
                inputEl.classList.remove('calculated-glow');
                inputEl.value = feature.examples[v.id];
                if (window.formatNumberInput && feature.examples[v.id] !== '') {
                    window.formatNumberInput(inputEl);
                }
            });
            showToast('Đã điền số liệu ví dụ. Vui lòng bấm Trích xuất kết quả!');
        };

        window.calculate = function(event) {
            event.preventDefault();
            const feature = features.find(f => f.id === currentFeatureId);
            
            let vars = {};
            let missingVars = [];
            let invalidInputs = false;

            feature.variables.forEach(v => {
                const inputEl = document.getElementById(v.id);
                inputEl.classList.remove('border-red-500', 'bg-red-50', 'calculated-glow');
                inputEl.classList.add('border-gray-300', 'bg-[#f8fafc]');

                const val = parseInput(inputEl.value, v.isRate);
                
                if (val === null) {
                    missingVars.push(v.id);
                } else if (isNaN(val)) {
                    invalidInputs = true;
                    inputEl.classList.add('border-red-500', 'bg-red-50');
                    inputEl.classList.remove('border-gray-300', 'bg-[#f8fafc]');
                } else {
                    vars[v.id] = val;
                }
            });

            if (invalidInputs) {
                showToast('Có ô dữ liệu không hợp lệ. Vui lòng nhập số hoặc phân số!');
                return;
            }

            if (missingVars.length === 0) {
                showToast('Bạn đã nhập kín tất cả các ô! Vui lòng xóa trắng ĐÚNG 1 Ô của đại lượng cần tính để hệ thống hoạt động.');
                return;
            }

            if (missingVars.length > 1) {
                showToast(`Bạn đang để trống tới ${missingVars.length} ô. Hệ thống chỉ có thể giải 1 ẩn số, vui lòng nhập đủ các ô còn lại!`);
                return;
            }

            // Gọi thuật toán bisection giải đại lượng duy nhất còn thiếu
            const targetVar = missingVars[0];
            try {
                let ans = solveNumeric(feature.eq, targetVar, vars);
                
                if (isNaN(ans) || !isFinite(ans)) throw new Error();
                
                // Cập nhật kết quả ngược vào ô Input với hiệu ứng phát sáng xanh
                const targetInput = document.getElementById(targetVar);
                const targetConfig = feature.variables.find(v => v.id === targetVar);
                
                if (targetConfig.isRate) {
                    targetInput.value = Number((ans * 100).toFixed(6)).toString().replace('.', ',');
                } else if (targetVar === 'n') {
                    targetInput.value = Number(ans.toFixed(2)).toString().replace('.', ',');
                } else {
                    targetInput.value = Math.round(ans).toString();
                    window.formatNumberInput(targetInput);
                }
                targetInput.classList.add('calculated-glow');

                // Nạp nghiệm vào bộ biến để in ra bảng phân tích
                vars[targetVar] = ans;
                renderAnalysis(feature, vars, targetVar, targetConfig);

            } catch (error) {
                showToast('Hệ phương trình vô nghiệm hoặc số liệu vượt quá giới hạn tính toán logic!');
            }
        };

        function renderAnalysis(feature, vars, targetVar, targetConfig) {
            // Bước 1: Render tóm tắt
            const summaryParts = feature.variables.map(v => {
                let val = vars[v.id];
                if (v.isRate) {
                    let percentVal = Number((val * 100).toFixed(6)); 
                    return `${v.id} = ${fmtDec(percentVal)}\\% = ${fmtDec(val)}`;
                } else if (v.id === 'n' || v.id === 'k') {
                    return `${v.id} = ${fmtDec(Number(val.toFixed(4)))}`;
                } else {
                    return `${v.id} = ${fmtMoney(val)}`;
                }
            });
            const summaryMath = summaryParts.map(part => `$ ${part} $`).join('<br>');

            // Bước 2: Thay số thông minh (Giữ nguyên ký tự ẩn số)
            let substitutedTex = feature.template;
            feature.variables.forEach(v => {
                let replaceWith = v.id === targetVar ? v.id : formatForMathJax(vars[v.id], v.isRate);
                substitutedTex = substitutedTex.replace(new RegExp(`_${v.id}_`, 'g'), replaceWith);
            });

            // Bước 3: Định dạng kết quả to
            let finalResultDisplay = '';
            let val = vars[targetVar];
            if (targetConfig.isRate) {
                finalResultDisplay = `${Number((val * 100).toFixed(4)).toString().replace('.', ',')} %`;
            } else if (targetVar === 'n') {
                finalResultDisplay = `${Number(val.toFixed(2)).toString().replace('.', ',')} kỳ`;
            } else {
                finalResultDisplay = formatCurrency(Math.round(val));
            }

            const resultHTML = `
                <div class="mb-1">
                    <p class="text-[11px] text-[#d4af37] mb-2 uppercase tracking-wider font-bold">
                        <i class="fas fa-list mr-1"></i> Bước 1: Tóm tắt hệ đại lượng
                    </p>
                    <div class="bg-black/30 border border-white/10 rounded-lg py-2.5 px-3 shadow-inner text-gray-200 mathjax-inline-break text-left text-sm leading-loose overflow-hidden break-words whitespace-normal">
                        ${summaryMath}
                    </div>
                </div>

                <div class="mb-1">
                    <p class="text-[11px] text-[#d4af37] mb-2 uppercase tracking-wider font-bold">
                        <i class="fas fa-pen-nib mr-1"></i> Bước 2: Thay số vào công thức
                    </p>
                    <div class="bg-black/30 border border-white/10 rounded-lg py-3 px-2 shadow-inner text-center math-responsive">
                        ${substitutedTex}
                    </div>
                </div>

                <div class="mt-2">
                    <p class="text-[11px] text-[#d4af37] mb-2 uppercase tracking-wider font-bold">
                        <i class="fas fa-check-double mr-1"></i> Bước 3: Kết quả cuối cùng
                    </p>
                    <div class="text-[13px] font-medium text-gray-300 mb-1">Đại lượng được tính: <span class="text-white">${feature.labels[targetVar]}</span></div>
                    <div class="break-all text-[#e5c158] text-3xl font-playfair font-bold text-center py-4 bg-gradient-to-r from-transparent via-white/5 to-transparent rounded border-t border-b border-white/10">
                        ${finalResultDisplay}
                    </div>
                </div>
            `;
            
            document.getElementById('result-placeholder').classList.add('hidden');
            const resultContainer = document.getElementById('result-container');
            resultContainer.innerHTML = resultHTML;
            resultContainer.classList.remove('hidden');
            
            renderMathJax();
        }

        document.addEventListener('DOMContentLoaded', () => {
            selectFeature(features[0].id);
        });

    </script>
</body>
</html>
