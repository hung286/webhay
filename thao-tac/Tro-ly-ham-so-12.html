<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toán 12: Khảo Sát & Vẽ Đồ Thị Hàm Số - Chuẩn KNTT ProMAX Siêu Cấp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .math-font { font-family: 'Times New Roman', Times, serif; font-size: 1.15rem; }
        .math-font-italic { font-family: 'Times New Roman', Times, serif; font-style: italic; }
        
        .bbt-container { width: 100%; overflow-x: auto; background: white; border-radius: 8px; }
        .bbt-table { width: 100%; border-collapse: collapse; text-align: center; font-family: 'Times New Roman', Times, serif; font-size: 1.2rem; }
        .bbt-table th, .bbt-table td { padding: 8px 5px; }
        .bbt-table tr { border-bottom: 1px solid black; }
        .bbt-table tr:first-child { border-top: 1px solid black; }
        .bbt-table td:first-child { border-right: 1px solid black; font-weight: bold; width: 40px;}
        .bbt-table td { border-right: none; border-left: none; }
        
        #bbt-cell-y { height: 110px; position: relative; padding: 0 !important; vertical-align: top;}
        
        .arrow { position: absolute; stroke: black; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
        .val-text { position: absolute; background: transparent; padding: 0; z-index: 10; transform: translate(-50%, -50%); text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff; }
        .double-line { position: absolute; width: 4px; border-left: 1px solid black; border-right: 1px solid black; height: 100%; top: 0; transform: translateX(-50%); }

        .step-content { display: none; opacity: 0; transition: opacity 0.3s ease-in-out; }
        .step-content.active { display: block; opacity: 1; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        #func-display { transition: opacity 0.3s ease; opacity: 0; }

        canvas { cursor: crosshair; touch-action: none; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden text-gray-800">

    <!-- CỘT TRÁI -->
    <div class="w-full md:w-[45%] lg:w-[40%] bg-white border-r flex flex-col h-full shadow-lg z-10">
        
        <div class="bg-slate-50 p-2 border-b border-gray-200 shrink-0">
            <div class="flex items-center justify-between mb-2">
                <div class="font-bold text-blue-800 text-sm">KHẢO SÁT HÀM SỐ (KNTT)</div>
                <label class="flex items-center text-xs font-semibold cursor-pointer bg-blue-100 text-blue-800 px-2 py-1 rounded hover:bg-blue-200 transition">
                    <input type="checkbox" id="toggle-tangent" class="mr-1" onchange="toggleTangent()">
                    Tiếp tuyến
                </label>
            </div>
            
            <div class="flex flex-col gap-2">
                <select id="funcType" class="w-full p-1.5 border rounded bg-white text-sm outline-none focus:border-blue-500 shadow-sm font-semibold" onchange="changeFuncType()">
                    <optgroup label="Hàm Đa Thức">
                        <option value="linear">Hàm bậc 1: y = ax + b</option>
                        <option value="quadratic">Hàm bậc 2: y = ax² + bx + c</option>
                        <option value="cubic" selected>Hàm bậc 3: y = ax³ + bx² + cx + d</option>
                        <option value="quartic">Hàm bậc 4 TP: y = ax⁴ + bx² + c</option>
                    </optgroup>
                    <optgroup label="Hàm Phân Thức">
                        <option value="rational11">Phân thức 1/1: y = (ax + b)/(cx + d)</option>
                        <option value="rational21">Phân thức 2/1: y = (ax² + bx + c)/(dx + e)</option>
                    </optgroup>
                    <optgroup label="Hàm Lũy Thừa, Mũ, Logarit">
                        <option value="power">Hàm lũy thừa: y = x^α</option>
                        <option value="exponential">Hàm số mũ: y = a^x</option>
                        <option value="logarithmic">Hàm logarit: y = log_a(x)</option>
                    </optgroup>
                </select>
                
                <div class="flex gap-1 justify-center w-full" id="input-container">
                    <div class="flex flex-col flex-1 max-w-[80px]" id="wrap-a"><label id="lbl-a" class="text-[10px] text-center text-gray-500 font-bold mb-0.5">a</label><input type="text" id="coeff-a" value="1/3" class="border p-1 rounded text-center text-sm shadow-inner w-full" onchange="initAnalysis()"></div>
                    <div class="flex flex-col flex-1 max-w-[80px]" id="wrap-b"><label id="lbl-b" class="text-[10px] text-center text-gray-500 font-bold mb-0.5">b</label><input type="text" id="coeff-b" value="-1" class="border p-1 rounded text-center text-sm shadow-inner w-full" onchange="initAnalysis()"></div>
                    <div class="flex flex-col flex-1 max-w-[80px]" id="wrap-c"><label id="lbl-c" class="text-[10px] text-center text-gray-500 font-bold mb-0.5">c</label><input type="text" id="coeff-c" value="0" class="border p-1 rounded text-center text-sm shadow-inner w-full" onchange="initAnalysis()"></div>
                    <div class="flex flex-col flex-1 max-w-[80px]" id="wrap-d"><label id="lbl-d" class="text-[10px] text-center text-gray-500 font-bold mb-0.5">d</label><input type="text" id="coeff-d" value="2" class="border p-1 rounded text-center text-sm shadow-inner w-full" onchange="initAnalysis()"></div>
                    <div class="flex flex-col flex-1 max-w-[80px]" id="wrap-e" style="display:none;"><label id="lbl-e" class="text-[10px] text-center text-gray-500 font-bold mb-0.5">e</label><input type="text" id="coeff-e" value="0" class="border p-1 rounded text-center text-sm shadow-inner w-full" onchange="initAnalysis()"></div>
                </div>
            </div>

            <div class="flex gap-1 mt-2">
                <button onclick="showPrevStep()" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-1.5 px-1 rounded shadow text-xs transition-all">⏮ Trước</button>
                <button onclick="showNextStep()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-1 rounded shadow text-xs transition-all">Sau ⏭</button>
                <button onclick="showAllSteps()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-1.5 px-1 rounded shadow text-xs transition-all">Hiện tất cả</button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 custom-scroll pb-12">
            <div id="func-display" class="text-center font-bold text-xl text-blue-900 mb-3 pb-2 border-b border-blue-100"></div>

            <div id="step-1" class="step-content math-font leading-relaxed mb-2"></div>
            <div id="step-2" class="step-content math-font leading-relaxed mb-3"></div>

            <div id="step-3" class="step-content mb-3">
                <div class="bbt-container relative shadow-sm border border-gray-300">
                    <table class="bbt-table" id="bbt-table">
                        <tr id="bbt-row-x"><td>\(x\)</td></tr>
                        <tr id="bbt-row-yp"><td>\(y'\)</td></tr>
                        <tr class="bbt-row-y">
                            <td>\(y\)</td>
                            <td id="bbt-cell-y" colspan="100%">
                                <svg id="bbt-svg" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;">
                                    <defs>
                                        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                            <polygon points="0 0, 6 3, 0 6" fill="black" />
                                        </marker>
                                    </defs>
                                    <g id="svg-paths"></g>
                                </svg>
                                <div id="bbt-text-layer"></div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>

            <div id="step-4" class="step-content math-font leading-relaxed border-t border-dashed border-gray-300 pt-2 text-sm"></div>
            <div id="step-5" class="step-content math-font leading-relaxed mt-2 text-sm"></div>
            <div id="step-6" class="step-content math-font leading-relaxed mt-1 text-sm"></div>
            <div id="step-7" class="step-content math-font leading-relaxed mt-1 text-sm"></div>
        </div>
    </div>

    <!-- CỘT PHẢI -->
    <div class="w-full md:flex-1 bg-white relative flex flex-col shadow-inner">
        <div class="absolute inset-0 flex items-center justify-center bg-[#fdfdfd] overflow-hidden">
            <canvas id="graphCanvas" class="w-full h-full"></canvas>
            
            <div id="tangent-info" class="hidden absolute top-4 right-4 bg-white/95 p-3 rounded shadow-lg border border-red-200 text-sm z-10 pointer-events-none">
                <p class="font-bold text-red-600 mb-1 border-b pb-1">Tiếp tuyến</p>
                <div class="math-font-italic text-gray-800">
                    <p>M(<span id="pt-x" style="font-style: normal;"></span>; <span id="pt-y" style="font-style: normal;"></span>)</p>
                    <p>k = <span id="pt-k" style="font-style: normal;"></span></p>
                    <p class="font-bold text-blue-800 mt-1" style="font-size: 1.1rem;">y = <span id="pt-eq" style="font-style: normal;"></span></p>
                </div>
            </div>
            
            <div class="absolute bottom-4 right-4 flex flex-col gap-2 z-20">
                <div class="flex shadow rounded border bg-white overflow-hidden text-gray-700">
                    <button onclick="zoomIn()" class="w-10 h-10 hover:bg-gray-100 text-xl font-bold flex items-center justify-center border-r" title="Phóng to">+</button>
                    <button onclick="zoomOut()" class="w-10 h-10 hover:bg-gray-100 text-xl font-bold flex items-center justify-center border-r" title="Thu nhỏ">-</button>
                    <button onclick="resetZoom()" class="w-10 h-10 hover:bg-gray-100 font-bold flex items-center justify-center" title="Reset Góc Nhìn">↺</button>
                </div>
                <button onclick="downloadGraph()" class="bg-blue-600 text-white p-2 rounded shadow hover:bg-blue-700 text-sm font-bold w-full transition flex items-center justify-center" title="Tải ảnh">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Tải ảnh
                </button>
            </div>
        </div>
    </div>

<script>
    let currentStep = 0;
    let funcData = { type: 'cubic', a:0, b:0, c:0, d:0, e:0, totalSteps: 7, f: null, fPrime: null, asymX: null, asymY: null, asymSlant: null, drawPoints: {}, symmetryAxisOy: false };
    let isTangentMode = false;
    let canvas, ctx, w, h;
    let baseScale = 50, scale = 50; 
    let ox, oy; 
    let mouseMathX = null; 
    
    // Animation & Pan variables
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let offsetOx = 0, offsetOy = 0;
    let animationProgress = 0;
    let isAnimating = false;

    function parseFraction(str) {
        if(!str) return 0;
        str = str.replace(/\s/g, '');
        if (str.includes('/')) {
            let parts = str.split('/');
            return parseFloat(parts[0]) / parseFloat(parts[1]);
        }
        return parseFloat(str) || 0;
    }

    function toMathFraction(num) {
        if (num === 0) return "0";
        if (Number.isInteger(num)) return num.toString();
        let sign = num < 0 ? "-" : "";
        num = Math.abs(num);
        for(let i=1; i<=20; i++){
            if(Math.abs(Math.round(num * i) - (num * i)) < 0.001){
                let tu = Math.round(num * i);
                if(i === 1) return sign + tu;
                return sign + "\\frac{" + tu + "}{" + i + "}";
            }
        }
        return sign + (Math.round(num*100)/100).toString(); 
    }

    function formatTerm(coeff, powerStr, isFirst) {
        if (coeff === 0) return "";
        let cStr = toMathFraction(Math.abs(coeff));
        if (coeff === 1 && powerStr !== "") cStr = "";
        if (coeff === -1 && powerStr !== "") cStr = "";
        let signStr = isFirst ? (coeff < 0 ? "-" : "") : (coeff < 0 ? " - " : " + ");
        return signStr + cStr + powerStr;
    }

    function queueMathJax(elements, onComplete) {
        if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise(elements).then(onComplete).catch(e => {
                if(onComplete) onComplete();
            });
        } else {
            if(onComplete) onComplete();
        }
    }

    function toggleDisplay(ids, display) {
        ids.forEach(id => {
            let el = document.getElementById(id);
            if(el) el.style.display = display;
        });
    }

    function changeFuncType() {
        let type = document.getElementById('funcType').value;
        let wA = 'wrap-a', wB = 'wrap-b', wC = 'wrap-c', wD = 'wrap-d', wE = 'wrap-e';
        
        toggleDisplay([wA, wB, wC, wD, wE], 'none');
        
        if (type === 'linear') {
            document.getElementById('lbl-a').innerText = 'a'; document.getElementById('lbl-b').innerText = 'b';
            toggleDisplay([wA, wB], 'flex');
            document.getElementById('coeff-a').value = '2'; document.getElementById('coeff-b').value = '-1';
        } else if (type === 'quadratic') {
            document.getElementById('lbl-a').innerText = 'a'; document.getElementById('lbl-b').innerText = 'b'; document.getElementById('lbl-c').innerText = 'c';
            toggleDisplay([wA, wB, wC], 'flex');
            document.getElementById('coeff-a').value = '1'; document.getElementById('coeff-b').value = '-2'; document.getElementById('coeff-c').value = '-3';
        } else if (type === 'cubic') {
            document.getElementById('lbl-a').innerText = 'a'; document.getElementById('lbl-b').innerText = 'b'; document.getElementById('lbl-c').innerText = 'c'; document.getElementById('lbl-d').innerText = 'd';
            toggleDisplay([wA, wB, wC, wD], 'flex');
            document.getElementById('coeff-a').value = '1/3'; document.getElementById('coeff-b').value = '-1'; document.getElementById('coeff-c').value = '0'; document.getElementById('coeff-d').value = '2';
        } else if (type === 'quartic') {
            document.getElementById('lbl-a').innerText = 'a'; document.getElementById('lbl-b').innerText = 'b'; document.getElementById('lbl-c').innerText = 'c';
            toggleDisplay([wA, wB, wC], 'flex');
            document.getElementById('coeff-a').value = '1'; document.getElementById('coeff-b').value = '-2'; document.getElementById('coeff-c').value = '-3';
        } else if (type === 'rational11') {
            document.getElementById('lbl-a').innerText = 'a'; document.getElementById('lbl-b').innerText = 'b'; document.getElementById('lbl-c').innerText = 'c'; document.getElementById('lbl-d').innerText = 'd';
            toggleDisplay([wA, wB, wC, wD], 'flex');
            document.getElementById('coeff-a').value = '2'; document.getElementById('coeff-b').value = '-1'; document.getElementById('coeff-c').value = '1'; document.getElementById('coeff-d').value = '1';
        } else if (type === 'rational21') {
            document.getElementById('lbl-a').innerText = 'a'; document.getElementById('lbl-b').innerText = 'b'; document.getElementById('lbl-c').innerText = 'c'; document.getElementById('lbl-d').innerText = 'd'; document.getElementById('lbl-e').innerText = 'e';
            toggleDisplay([wA, wB, wC, wD, wE], 'flex');
            document.getElementById('coeff-a').value = '1'; document.getElementById('coeff-b').value = '-2'; document.getElementById('coeff-c').value = '2'; document.getElementById('coeff-d').value = '1'; document.getElementById('coeff-e').value = '-1';
        } else if (type === 'power') {
            document.getElementById('lbl-a').innerText = 'Số mũ α';
            toggleDisplay([wA], 'flex');
            document.getElementById('coeff-a').value = '1/2';
        } else if (type === 'exponential' || type === 'logarithmic') {
            document.getElementById('lbl-a').innerText = 'Cơ số a';
            toggleDisplay([wA], 'flex');
            document.getElementById('coeff-a').value = '2';
        }

        scale = baseScale; offsetOx = 0; offsetOy = 0;
        initAnalysis();
    }

    function hideAllSteps() {
        for(let i=1; i<=7; i++) {
            let el = document.getElementById(`step-${i}`);
            if(el) { 
                el.classList.remove('active'); 
                if (i >= 5) el.innerHTML = ''; 
            }
        }
        currentStep = 0;
    }

    function showPrevStep() {
        if (currentStep > 0) {
            let stepEl = document.getElementById(`step-${currentStep}`);
            if(stepEl) stepEl.classList.remove('active');
            currentStep--;
            
            if (currentStep < funcData.totalSteps) {
                isAnimating = false;
                animationProgress = 0;
                if(isTangentMode) document.getElementById('tangent-info').classList.add('hidden');
            }
            drawGraphCanvas();
        }
    }

    function showNextStep() {
        if (currentStep < funcData.totalSteps) {
            currentStep++;
            let stepEl = document.getElementById(`step-${currentStep}`);
            if (stepEl && stepEl.innerHTML.trim() !== '') {
                queueMathJax([stepEl], () => {
                    stepEl.classList.add('active');
                    checkGraphAnimation();
                });
            } else {
                checkGraphAnimation();
            }
        }
    }

    function checkGraphAnimation() {
        if (currentStep === funcData.totalSteps) {
            if(isTangentMode) document.getElementById('tangent-info').classList.remove('hidden');
            if (animationProgress === 0 && !isAnimating) {
                isAnimating = true;
                animateGraph();
            }
        } else {
            drawGraphCanvas();
        }
    }

    function animateGraph() {
        if (!isAnimating || currentStep < funcData.totalSteps) return;
        animationProgress += 0.025;
        if (animationProgress > 1) {
            animationProgress = 1;
            isAnimating = false;
        }
        drawGraphCanvas();
        if (isAnimating) {
            requestAnimationFrame(animateGraph);
        }
    }

    function showAllSteps() {
        let elsToRender = [];
        for(let i=1; i<=funcData.totalSteps; i++) {
            let stepEl = document.getElementById(`step-${i}`);
            if(stepEl && stepEl.innerHTML.trim() !== '') elsToRender.push(stepEl);
        }
        queueMathJax(elsToRender, () => {
            elsToRender.forEach(el => el.classList.add('active'));
            currentStep = funcData.totalSteps;
            animationProgress = 1;
            isAnimating = false;
            drawGraphCanvas();
            if(isTangentMode) document.getElementById('tangent-info').classList.remove('hidden');
        });
    }

    function initAnalysis() {
        hideAllSteps();
        
        document.getElementById('bbt-table').style.tableLayout = 'auto';
        isAnimating = false;
        animationProgress = 0;
        
        funcData.f = null; funcData.fPrime = null; funcData.asymX = null; funcData.asymY = null; funcData.asymSlant = null;
        funcData.drawPoints = {}; funcData.symmetryAxisOy = false;

        let type = document.getElementById('funcType').value;
        funcData.type = type;
        let a = parseFraction(document.getElementById('coeff-a').value);
        let b = parseFraction(document.getElementById('coeff-b').value);
        let c = parseFraction(document.getElementById('coeff-c').value);
        let d = parseFraction(document.getElementById('coeff-d').value || "0");
        let e = parseFraction(document.getElementById('coeff-e').value || "0");
        
        funcData.a = a; funcData.b = b; funcData.c = c; funcData.d = d; funcData.e = e;

        if (type === 'linear') analyzeLinear(a, b);
        else if (type === 'quadratic') analyzeQuadratic(a, b, c);
        else if (type === 'cubic') analyzeCubic(a, b, c, d);
        else if (type === 'quartic') analyzeQuartic(a, b, c);
        else if (type === 'rational11') analyzeRational11(a, b, c, d);
        else if (type === 'rational21') analyzeRational21(a, b, c, d, e);
        else if (type === 'power') analyzePower(a);
        else if (type === 'exponential') analyzeExponential(a);
        else if (type === 'logarithmic') analyzeLogarithmic(a);

        let fd = document.getElementById('func-display');
        fd.style.opacity = '0';
        queueMathJax([fd], () => { fd.style.opacity = '1'; });

        drawGraphCanvas();
    }

    // --- CÁC HÀM KHẢO SÁT CHI TIẾT ---
    function analyzeLinear(a, b) {
        funcData.totalSteps = 6;
        if (a === 0) { alert("Hệ số a phải khác 0"); return; }
        let eq = formatTerm(a, "x", true) + formatTerm(b, "", false);
        document.getElementById('func-display').innerHTML = `\\( y = ${eq ? eq : "0"} \\)`;
        funcData.f = (x) => a*x + b; funcData.fPrime = (x) => a;

        document.getElementById('step-1').innerHTML = `<p><b>1. Tập xác định:</b> \\( D = \\mathbb{R} \\)</p><p class="mt-1"><b>2. Sự biến thiên:</b></p>`;
        document.getElementById('step-2').innerHTML = `<ul class="list-none ml-4 text-[0.95rem]">
            <li>• Giới hạn: \\( \\lim\\limits_{x \\to \\pm\\infty} y = \\pm\\infty \\)</li>
            <li class="mt-1">• Đạo hàm: \\( y' = ${toMathFraction(a)} ${a > 0 ? ">0" : "<0"} \\), với mọi \\(x\\)</li></ul>`;

        document.getElementById('bbt-table').style.tableLayout = 'fixed';
        let trX = document.getElementById('bbt-row-x'), trYp = document.getElementById('bbt-row-yp'), textLayer = document.getElementById('bbt-text-layer');
        trX.innerHTML = `<td style="width: 40px;">\\(x\\)</td><td style="width: 10%;"></td><td style="width: 10%;">\\(-\\infty\\)</td><td style="width: 60%;"></td><td style="width: 10%;">\\(+\\infty\\)</td><td style="width: 10%;"></td>`;
        let sgn = a > 0 ? "+" : "-";
        trYp.innerHTML = `<td>\\(y'\\)</td><td></td><td></td><td>${sgn}</td><td></td><td></td>`;
        
        textLayer.innerHTML = ``;
        if (a > 0) {
            textLayer.innerHTML += `<div class="val-text" style="left: 15%; top: 80%;">\\(-\\infty\\)</div><div class="val-text" style="left: 85%; top: 20%;">\\(+\\infty\\)</div>`;
            document.getElementById('svg-paths').innerHTML = `<line x1="20%" y1="75%" x2="80%" y2="25%" class="arrow" />`;
        } else {
            textLayer.innerHTML += `<div class="val-text" style="left: 15%; top: 20%;">\\(+\\infty\\)</div><div class="val-text" style="left: 85%; top: 80%;">\\(-\\infty\\)</div>`;
            document.getElementById('svg-paths').innerHTML = `<line x1="20%" y1="25%" x2="80%" y2="75%" class="arrow" />`;
        }

        document.getElementById('step-4').innerHTML = `<p>• Hàm số <b>${a>0?"đồng biến":"nghịch biến"}</b> trên \\( \\mathbb{R} \\).</p><p>• Hàm số <b>không có cực trị</b>.</p>`;

        funcData.drawPoints[5] = [{x: 0, y: b, label: 'Oy', color: 'purple'}, {x: -b/a, y: 0, label: 'Ox', color: 'purple'}];

    function buildBbtData(roots, signs, yVals, yPosPercent) {
        let trX = document.getElementById('bbt-row-x'), trYp = document.getElementById('bbt-row-yp'), textLayer = document.getElementById('bbt-text-layer');
        trX.innerHTML = `<td>\\(x\\)</td>`; trYp.innerHTML = `<td>\\(y'\\)</td>`; textLayer.innerHTML = ``;
        let xVals = ["-\\infty"]; roots.forEach(r => { xVals.push(typeof r === 'number' ? toMathFraction(r) : r); }); xVals.push("+\\infty");

        xVals.forEach((val, i) => { if(i>0) trX.innerHTML += `<td></td>`; trX.innerHTML += `<td>\\(${val}\\)</td>`; });
        trYp.innerHTML += `<td></td>`;
        signs.forEach((s, i) => { trYp.innerHTML += `<td>${s}</td>`; if (i < roots.length) trYp.innerHTML += `<td>0</td>`; });
        trYp.innerHTML += `<td></td>`;

        let numCols = roots.length + 2;
        let xPos = Array.from({length: numCols}, (_, i) => 12 + (76 / (numCols - 1)) * i);

        yVals.forEach((val, i) => {
            let valStr = typeof val === 'number' ? toMathFraction(val) : val;
            textLayer.innerHTML += `<div class="val-text" style="left: ${xPos[i]}%; top: ${yPosPercent[i]}%;">\\(${valStr}\\)</div>`;
        });

        let svgPaths = "";
        for(let i=0; i < yVals.length - 1; i++) {
            let yStart = yPosPercent[i] === 80 ? 75 : 25;
            let yEnd = yPosPercent[i+1] === 80 ? 75 : 25;
            if(yStart !== yEnd) {
                svgPaths += `<line x1="${xPos[i]+3}%" y1="${yStart}%" x2="${xPos[i+1]-3}%" y2="${yEnd}%" class="arrow" />`;
            }
        }
        document.getElementById('svg-paths').innerHTML = svgPaths;
    }

    function toggleTangent() {
        isTangentMode = document.getElementById('toggle-tangent').checked;
        let infoBox = document.getElementById('tangent-info');
        if(isTangentMode && currentStep === funcData.totalSteps) infoBox.classList.remove('hidden');
        else { infoBox.classList.add('hidden'); mouseMathX = null; drawGraphCanvas(); }
    }

    function zoomIn() { scale *= 1.2; drawGraphCanvas(); }
    function zoomOut() { scale /= 1.2; drawGraphCanvas(); }
    function resetZoom() { scale = baseScale; offsetOx = 0; offsetOy = 0; drawGraphCanvas(); }
    function downloadGraph() { drawGraphCanvas(true); let link = document.createElement('a'); link.download = 'do-thi-kntt.png'; link.href = canvas.toDataURL("image/png"); link.click(); drawGraphCanvas(); }

    function setupCanvas() {
        canvas = document.getElementById('graphCanvas'); ctx = canvas.getContext('2d');
        w = canvas.parentElement.clientWidth; h = canvas.parentElement.clientHeight;
        canvas.width = w; canvas.height = h;

        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            if(isDragging) {
                offsetOx += e.clientX - dragStartX; offsetOy += e.clientY - dragStartY;
                dragStartX = e.clientX; dragStartY = e.clientY;
                drawGraphCanvas();
            } else if(isTangentMode && currentStep === funcData.totalSteps) {
                mouseMathX = Math.round((((e.clientX - rect.left) - (w/2 + offsetOx)) / scale) * 10) / 10;
                drawGraphCanvas();
            }
        });

        canvas.addEventListener('mousedown', (e) => { if(isTangentMode) return; isDragging = true; dragStartX = e.clientX; dragStartY = e.clientY; canvas.style.cursor = 'grabbing'; });
        canvas.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'crosshair'; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; canvas.style.cursor = 'crosshair'; if(isTangentMode) { mouseMathX = null; drawGraphCanvas(); } });
        canvas.addEventListener('wheel', (e) => { e.preventDefault(); if (e.deltaY < 0) zoomIn(); else zoomOut(); });
    }

    function drawGraphCanvas(isExport = false) {
        if(!ctx) return;
        ox = w/2 + offsetOx; oy = h/2 + offsetOy;
        ctx.clearRect(0,0,w,h);
        
        if(isExport) { ctx.fillStyle = "white"; ctx.fillRect(0,0,w,h); }

        ctx.strokeStyle = "#e5e7eb"; ctx.lineWidth = 1;
        for(let i=ox; i<w; i+=scale) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
        for(let i=ox; i>0; i-=scale) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
        for(let j=oy; j<h; j+=scale) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(w,j); ctx.stroke(); }
        for(let j=oy; j>0; j-=scale) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(w,j); ctx.stroke(); }

        ctx.strokeStyle = "black"; ctx.lineWidth = 1.5; ctx.fillStyle = "black";
        ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(w - 10, oy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(w - 15, oy - 4); ctx.lineTo(w - 2, oy); ctx.lineTo(w - 15, oy + 4); ctx.fill();
        ctx.font = "italic 16px 'Times New Roman'"; ctx.fillText("x", w - 20, oy - 10);
        
        ctx.beginPath(); ctx.moveTo(ox, h); ctx.lineTo(ox, 10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox - 4, 15); ctx.lineTo(ox, 2); ctx.lineTo(ox + 4, 15); ctx.fill();
        ctx.fillText("y", ox + 12, 18); ctx.fillText("O", ox - 15, oy + 18);

        ctx.font = "12px Arial"; ctx.fillStyle = "black"; ctx.textAlign = "center"; ctx.textBaseline = "top";
        let stepVal = scale < 25 ? 2 : (scale < 12 ? 5 : 1);
        for(let i=stepVal; i*scale < Math.max(w-ox, ox); i+=stepVal) {
            let px = ox + i*scale, nx = ox - i*scale;
            if (px < w - 15 && px > 15) { ctx.beginPath(); ctx.moveTo(px, oy-3); ctx.lineTo(px, oy+3); ctx.stroke(); ctx.fillText(i, px, oy + 5); }
            if (nx > 15 && nx < w - 15) { ctx.beginPath(); ctx.moveTo(nx, oy-3); ctx.lineTo(nx, oy+3); ctx.stroke(); ctx.fillText(-i, nx, oy + 5); }
        }
        ctx.textAlign = "right"; ctx.textBaseline = "middle";
        for(let i=stepVal; i*scale < Math.max(h-oy, oy); i+=stepVal) {
            let py = oy - i*scale, ny = oy + i*scale;
            if (py > 15 && py < h - 15) { ctx.beginPath(); ctx.moveTo(ox-3, py); ctx.lineTo(ox+3, py); ctx.stroke(); ctx.fillText(i, ox - 5, py); }
            if (ny < h - 15 && ny > 15) { ctx.beginPath(); ctx.moveTo(ox-3, ny); ctx.lineTo(ox+3, ny); ctx.stroke(); ctx.fillText(-i, ox - 5, ny); }
        }

        for (let s = 1; s <= currentStep; s++) {
            if (funcData.symmetryAxisOy && s >= 5) {
                ctx.strokeStyle = "rgba(234, 179, 8, 0.4)"; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, h); ctx.stroke();
            }
            if (funcData.drawPoints[s]) {
                funcData.drawPoints[s].forEach(pt => {
                    let px = ox + pt.x * scale, py = oy - pt.y * scale;
                    ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(px, py, 4, 0, 2*Math.PI); ctx.fill();
                    ctx.lineWidth = 1.5; ctx.strokeStyle = "white"; ctx.stroke();
                    ctx.font = "italic 13px 'Times New Roman'"; ctx.fillText(`${pt.label}`, px + 12, py - 8);
                });
            }
        }

        if (currentStep < funcData.totalSteps) {
            ctx.fillStyle = "#94a3b8"; ctx.font = "italic 15px 'Segoe UI', Arial"; ctx.textAlign = "center";
            ctx.fillText("Bấm Sau ⏭ để tiếp tục khảo sát đồ thị...", w/2, 30);
            return;
        }

        let f = funcData.f;
        if (typeof f === 'function') {
            ctx.strokeStyle = "green"; ctx.setLineDash([5,5]); ctx.lineWidth = 1.5;
            if (funcData.asymX !== null) { ctx.beginPath(); ctx.moveTo(ox + funcData.asymX*scale, 0); ctx.lineTo(ox + funcData.asymX*scale, h); ctx.stroke(); }
            if (funcData.asymY !== null) { ctx.beginPath(); ctx.moveTo(0, oy - funcData.asymY*scale); ctx.lineTo(w, oy - funcData.asymY*scale); ctx.stroke(); }
            if (funcData.asymSlant) {
                ctx.beginPath(); ctx.moveTo(0, oy - (funcData.asymSlant.m * (-ox/scale) + funcData.asymSlant.n) * scale);
                ctx.lineTo(w, oy - (funcData.asymSlant.m * ((w-ox)/scale) + funcData.asymSlant.n) * scale); ctx.stroke();
            }
            ctx.setLineDash([]);

            ctx.strokeStyle = "#2563eb"; ctx.lineWidth = 2.5; ctx.beginPath();
            let prevY = null;
            let maxPx = Math.floor(w * animationProgress);
            
            for(let px = 0; px <= maxPx; px++) {
                let x = (px - ox) / scale;
                if ((funcData.type === 'rational11' || funcData.type === 'rational21') && Math.abs(x - funcData.asymX) < 0.05) { prevY = null; continue; }
                
                let y = f(x);
                if(isNaN(y) || !isFinite(y)) { prevY = null; continue; } 

                let py = oy - y * scale;
                if (prevY === null || Math.abs(py - prevY) > h) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
                prevY = py;
            }
            ctx.stroke();

            if(isTangentMode && mouseMathX !== null && typeof funcData.fPrime === 'function' && !((funcData.type === 'rational11' || funcData.type === 'rational21') && mouseMathX === funcData.asymX)) {
                let x0 = mouseMathX, y0 = f(x0), k = funcData.fPrime(x0);
                if (!isNaN(y0) && !isNaN(k) && isFinite(y0) && isFinite(k)) {
                    let px0 = ox + x0 * scale, py0 = oy - y0 * scale;
                    if(px0 <= maxPx) {
                        ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(px0, py0, 4, 0, 2*Math.PI); ctx.fill();
                        ctx.strokeStyle = "red"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); ctx.beginPath();
                        let xLeft = -ox/scale, yLeft = k * (xLeft - x0) + y0;
                        let xRight = (w - ox)/scale, yRight = k * (xRight - x0) + y0;
                        ctx.moveTo(ox + xLeft * scale, oy - yLeft * scale); ctx.lineTo(ox + xRight * scale, oy - yRight * scale); ctx.stroke();
                        ctx.strokeStyle = "gray"; ctx.lineWidth = 1; ctx.setLineDash([2,2]);
                        ctx.beginPath(); ctx.moveTo(px0, oy); ctx.lineTo(px0, py0); ctx.lineTo(ox, py0); ctx.stroke(); ctx.setLineDash([]);
                        
                        let dString = y0 - k*x0; let sign = dString >= 0 ? "+" : "-";
                        document.getElementById('pt-x').innerText = x0.toFixed(2);
                        document.getElementById('pt-y').innerText = y0.toFixed(2);
                        document.getElementById('pt-k').innerText = k.toFixed(2);
                        document.getElementById('pt-eq').innerHTML = `${k.toFixed(2)}<i>x</i> ${sign} ${Math.abs(dString).toFixed(2)}`;
                    }
                }
            }
        }
    }

    window.onload = () => { setupCanvas(); window.addEventListener('resize', () => { setupCanvas(); drawGraphCanvas(); }); changeFuncType(); };
</script>
