<script>
const state = {
selectedType: null, inputs: {}, focusedInput: null,
showSolution: false, // True: đã bấm Thực hiện
showDetails: false, // True: đã bấm Xem lời giải chi tiết
katexReady: false
};
let lastRenderState = "";
const problemTypes = [
{ id: 1, title: "Dạng 1: Tâm và bán kính", desc: "Viết PT mặt cầu tâm I(a,b,c), bán kính R.", inputs: ['a', 'b', 'c', 'R'] },
{ id: 2, title: "Dạng 2: Có đường kính AB", desc: "Viết PT mặt cầu đường kính AB.", inputs: ['xA', 'yA', 'zA', 'xB', 'yB', 'zB'] },
{ id: 3, title: "Dạng 3: Xác định từ PT tổng quát", desc: "Tìm tâm, bán kính từ PT tổng quát mặt cầu.", inputs: ['a_coef', 'b_coef', 'c_coef', 'd_coef'] },
{ id: 4, title: "Dạng 4: Có tâm và đi qua điểm", desc: "Viết PT mặt cầu tâm I đi qua điểm A.", inputs: ['a', 'b', 'c', 'xA', 'yA', 'zA'] },
{ id: 5, title: "Dạng 5: Tâm I tiếp xúc mặt phẳng (P)", desc: "Mặt cầu tâm I tiếp xúc (P): Ax+By+Cz+D=0", inputs: ['a', 'b', 'c', 'pA', 'pB', 'pC', 'pD'] },
{ id: 6, title: "Dạng 6: Đi qua 4 điểm", desc: "Viết PT mặt cầu ngoại tiếp tứ diện ABCD.", inputs: ['xA', 'yA', 'zA', 'xB', 'yB', 'zB', 'xC', 'yC', 'zC', 'xD', 'yD', 'zD'] }
];
const virtualKeys = [
'm', '7', '8', '9', '/',
'a', '4', '5', '6', '-',
'+', '1', '2', '3', 'C',
'(', ')', '0', '√', 'Del'
];
window.addEventListener('load', () => {
loadSavedLogo();
const checkLibs = setInterval(() => {
if (window.katex && window.nerdamer) {
clearInterval(checkLibs);
state.katexReady = true;
renderApp();
}
}, 100);
});
// ----------------------------------------------------
// BỘ CÔNG CỤ TÍNH TOÁN ĐẠI SỐ CHÍNH XÁC (SYMBOLIC MATH)
// ----------------------------------------------------
const n_eval = (str) => {
if (!str) return nerdamer('0');
let s = str.replace(/√(\d+(\.\d+)?)/g, 'sqrt($1)');
s = s.replace(/√\(([^)]+)\)/g, 'sqrt($1)');
try { return nerdamer(s); } catch(e) { return nerdamer('0'); }
};
const kInline = (math) => state.katexReady ? window.katex.renderToString(math, { throwOnError: false }) : math;
const kBlock = (math) => state.katexReady ? `<div class="my-3 text-center text-xl overflow-x-auto pb-1">${window.katex.renderToString(math, { throwOnError: false, displayMode: true })}</div>` : math;
// Định dạng dạng chính tắc (x-a)^2
const formatSq = (v, valObj) => {
if (valObj.text() === '0') return `${v}^2`;
let valTex = valObj.toTeX().replace(/\\cdot/g, '').replace(/\s+/g, '');
if (valTex.startsWith('-') && !valTex.substring(1).includes('+') && !valTex.substring(1).includes('-')) {
return `(${v} + ${valTex.substring(1)})^2`;
}
if (!valTex.includes('+') && (!valTex.includes('-') || valTex.startsWith('\\frac'))) {
return `(${v} - ${valTex})^2`;
}
return `(${v} - (${valTex}))^2`;
};
// Ép biến đứng trước căn (vd: y\sqrt{2} thay vì \sqrt{2}y)
const formatCustomTerm = (coefObj, v) => {
if (coefObj.eq(0)) return '';
let tex = coefObj.toTeX().replace(/\\cdot/g, '').replace(/\s+/g, '');
let isNeg = tex.startsWith('-');
let sign = isNeg ? '-' : '+';
let absTex = isNeg ? tex.substring(1) : tex;
if (absTex === '1') return `${sign} ${v}`;
if (/[\+\-]/.test(absTex) && !absTex.startsWith('\\frac') && !absTex.startsWith('(')) {
return `${sign} (${absTex})${v}`;
}
let termStr = "";
if (absTex.includes('\\sqrt')) {
termStr = absTex.replace('\\sqrt', v + '\\sqrt');
} else {
termStr = absTex + v;
}
return `${sign} ${termStr}`;
};
// Dựng phương trình tổng quát chuẩn SGK: x^2 + y^2 + z^2 + Ax + By + Cz + D = 0
const getGeneralSphereEq = (a, b, c, dTermObj) => {
const coefX = nerdamer(`simplify(-2 * (${a.text()}))`);
const coefY = nerdamer(`simplify(-2 * (${b.text()}))`);
const coefZ = nerdamer(`simplify(-2 * (${c.text()}))`);
let eq = 'x^2 + y^2 + z^2';
let texX = formatCustomTerm(coefX, 'x'); if (texX) eq += ` ${texX}`;
let texY = formatCustomTerm(coefY, 'y'); if (texY) eq += ` ${texY}`;
let texZ = formatCustomTerm(coefZ, 'z'); if (texZ) eq += ` ${texZ}`;
if (!dTermObj.eq(0)) {
let texD = dTermObj.toTeX().replace(/\\cdot/g, '').replace(/\s+/g, '');
if (texD.startsWith('-')) {
eq += ` - ${texD.substring(1)}`;
} else {
eq += ` + ${texD}`;
}
}
eq += ' = 0';
return eq;
};
// Cramer 3x3
const n_sub = (a, b) => nerdamer(`${a.text()} - (${b.text()})`);
const n_mul = (a, b) => nerdamer(`(${a.text()}) * (${b.text()})`);
const n_det3x3 = (m) => {
const p1 = n_mul(m[0][0], n_sub(n_mul(m[1][1], m[2][2]), n_mul(m[1][2], m[2][1])));
const p2 = n_mul(m[0][1], n_sub(n_mul(m[1][0], m[2][2]), n_mul(m[1][2], m[2][0])));
const p3 = n_mul(m[0][2], n_sub(n_mul(m[1][0], m[2][1]), n_mul(m[1][1], m[2][0])));
return nerdamer(`simplify(${p1.text()} - (${p2.text()}) + ${p3.text()})`);
};
// Cramer 4x4 (Giải hệ 4 ẩn phương trình mặt cầu)
const n_det4x4 = (m) => {
const getSubMatrix = (matrix, excludeRow, excludeCol) => {
let subMatrix = [];
for (let i = 0; i < matrix.length; i++) {
if (i === excludeRow) continue;
let newRow = [];
for (let j = 0; j < matrix[i].length; j++) {
if (j === excludeCol) continue;
newRow.push(matrix[i][j]);
}
subMatrix.push(newRow);
}
return subMatrix;
};
const p1 = n_mul(m[0][0], n_det3x3(getSubMatrix(m, 0, 0)));
const p2 = n_mul(m[0][1], n_det3x3(getSubMatrix(m, 0, 1)));
const p3 = n_mul(m[0][2], n_det3x3(getSubMatrix(m, 0, 2)));
const p4 = n_mul(m[0][3], n_det3x3(getSubMatrix(m, 0, 3)));
return nerdamer(`simplify(${p1.text()} - (${p2.text()}) + (${p3.text()}) - (${p4.text()}))`);
};
// Thay cột j bằng vector cột V trong ma trận M
const replaceCol = (m, colIndex, v) => {
let res = [];
for (let i=0; i<4; i++) {
res.push([...m[i]]);
res[i][colIndex] = v[i];
}
return res;
};
// ----------------------------------------------------
// CÁC HÀM XỬ LÝ GIAO DIỆN / ĐIỀU KHIỂN
// ----------------------------------------------------
function selectType(id) {
state.selectedType = id; state.inputs = {};
state.focusedInput = null; state.showSolution = false; state.showDetails = false;
renderApp();
}
function backToList() {
state.selectedType = null; state.showSolution = false; state.showDetails = false;
renderApp();
}
function toggleSolution(isShowing) {
state.showSolution = isShowing;
if (isShowing) { state.showDetails = false; }
else { state.focusedInput = problemTypes.find(t=>t.id===state.selectedType).inputs[0]; }
renderApp();
}
function revealDetails() {
state.showDetails = true; renderRightPanel();
}
function setFocus(inputName) { state.focusedInput = inputName; renderLeftPanel(); }
function handleKey(key) {
if (!state.focusedInput) return;
let currentVal = state.inputs[state.focusedInput] || '';
if (key === 'C') currentVal = '';
else if (key === 'Del') currentVal = currentVal.slice(0, -1);
else currentVal += key;
state.inputs[state.focusedInput] = currentVal;
const inputEl = document.getElementById('input_' + state.focusedInput);
if (inputEl) inputEl.value = currentVal;
}
function handleLogoUpload(event) {
const file = event.target.files[0];
if (file) {
const reader = new FileReader();
reader.onload = function(e) {
const dataUrl = e.target.result;
applyLogo(dataUrl); localStorage.setItem('savedTcLogo', dataUrl);
};
reader.readAsDataURL(file);
}
}
function applyLogo(dataUrl) {
const logoEl = document.getElementById('tc-logo-display');
if (logoEl) { logoEl.style.backgroundImage = `url(${dataUrl})`; logoEl.innerHTML = ''; }
}
function loadSavedLogo() { const savedLogo = localStorage.getItem('savedTcLogo'); if (savedLogo) applyLogo(savedLogo); }
function renderApp() { renderLeftPanel(); renderRightPanel(); }
// ==========================================
// RENDER GIAO DIỆN BÊN TRÁI (BẢNG ĐIỀU KHIỂN)
// ==========================================
function renderLeftPanel() {
const leftEl = document.getElementById('left-panel-content');
const currentStateStr = `${state.selectedType}_${state.showSolution}`;
if (!state.selectedType) {
if (lastRenderState !== "MENU") {
leftEl.innerHTML = `
<div class="fade-in flex flex-col h-full">
<h2 class="text-lg font-bold text-green-300 mb-2 flex items-center border-b border-white/10 pb-2">
<span class="mr-2">📝</span> Danh mục bài tập
</h2>
<div class="space-y-3 mt-2">
${problemTypes.map(type => `
<div onclick="selectType(${type.id})" class="p-3 rounded-lg chalk-border hover:bg-white/10 cursor-pointer transition-all duration-300 group">
<h3 class="font-bold text-yellow-300 text-base mb-1 group-hover:text-yellow-200">${type.title}</h3>
<p class="text-xs text-gray-300 opacity-80">${type.desc}</p>
</div>
`).join('')}
</div>
</div>
`;
lastRenderState = "MENU";
}
} else {
const activeType = problemTypes.find(t => t.id === state.selectedType);
if (lastRenderState !== currentStateStr) {
let generalStepsHTML = '';
if (activeType.id === 1) {
generalStepsHTML = `<p>1. Dạng chính tắc: ${kBlock('(x - a)^2 + (y - b)^2 + (z-c)^2 = R^2')}</p><p>2. Thay toạ độ tâm ${kInline('I(a;b;c)')} và bán kính ${kInline('R')}.</p><p>3. Khai triển nếu cần dạng tổng quát.</p>`;
} else if (activeType.id === 2) {
generalStepsHTML = `<p>1. Tìm tâm ${kInline('I')} là trung điểm ${kInline('AB')}.</p><p>2. Tính ${kInline('AB^2')}, suy ra bán kính ${kInline('R^2 = \\frac{AB^2}{4}')}.</p><p>3. Viết phương trình mặt cầu.</p>`;
} else if (activeType.id === 3) {
generalStepsHTML = `<p>1. PT: ${kInline('x^2 + y^2 + z^2 - 2ax - 2by - 2cz + d = 0')}</p><p>2. Tâm ${kInline('I(a; b; c)')}</p><p>3. Điều kiện: ${kInline('R^2 = a^2 + b^2 + c^2 - d > 0')}</p><p>4. Bán kính ${kInline('R = \\sqrt{R^2}')}</p>`;
} else if (activeType.id === 4) {
generalStepsHTML = `<p>1. Tính khoảng cách ${kInline('IA^2')}.</p><p>2. Do mặt cầu qua A nên bán kính ${kInline('R^2 = IA^2')}.</p><p>3. Lập phương trình mặt cầu.</p>`;
} else if (activeType.id === 5) {
generalStepsHTML = `<p>1. Bán kính bằng khoảng cách từ ${kInline('I')} đến mặt phẳng ${kInline('(P)')}.</p><p>2. ${kBlock('R = d(I, P) = \\frac{|Ax_I + By_I + Cz_I + D|}{\\sqrt{A^2 + B^2 + C^2}}')}</p><p>3. Viết PT mặt cầu.</p>`;
} else if (activeType.id === 6) {
generalStepsHTML = `<p>1. Gọi PT: ${kBlock('x^2 + y^2 + z^2 - 2ax - 2by - 2cz + d = 0')}</p><p>2. Thay toạ độ 4 điểm tạo hệ 4 phương trình.</p><p>3. Giải hệ tìm ${kInline('a, b, c, d')}.</p><p>4. Tính $R$ và kết luận.</p>`;
}
if (state.showSolution) {
leftEl.innerHTML = `
<div class="fade-in flex flex-col h-full">
<button onclick="backToList()" class="mb-3 text-gray-300 hover:text-white flex items-center font-bold text-sm w-fit transition-colors">
<span class="mr-1">←</span> Chọn bài khác
</button>
<h2 class="text-xl font-bold title-glow mb-4 leading-tight">${activeType.title}</h2>
<div class="text-sm text-white chalk-border-solid bg-black/30 p-4 rounded-lg mb-4 shadow-inner flex-1">
<h3 class="font-bold text-yellow-300 mb-3 border-b border-yellow-300/30 pb-1 flex items-center"><span class="mr-2">📌</span> Các bước giải tổng quát:</h3>
<div class="space-y-3 text-gray-200">${generalStepsHTML}</div>
</div>
<button onclick="toggleSolution(false)" class="w-full bg-blue-600/80 border border-blue-400 hover:bg-blue-500 text-white font-bold text-base py-2.5 rounded-lg shadow-md transition-all">
✏️ SỬA SỐ LIỆU
</button>
</div>
`;
} else {
// Tính số cột phù hợp (ưu tiên 3 cột cho không gian 3 chiều x, y, z)
const gridCols = activeType.inputs.length % 3 === 0 ? 3 : 2;
leftEl.innerHTML = `
<div class="fade-in flex flex-col h-full">
<button onclick="backToList()" class="mb-3 text-gray-300 hover:text-white flex items-center font-bold text-sm w-fit transition-colors">
<span class="mr-1">←</span> Quay lại
</button>
<h2 class="text-xl font-bold title-glow mb-3 leading-tight">${activeType.title}</h2>
<div class="flex-1 flex flex-col">
<h3 class="text-sm font-bold text-green-300 mb-2 flex items-center"><span class="mr-1">✏️</span> Nhập số liệu:</h3>
<div class="grid grid-cols-${gridCols} gap-2 mb-3">
${activeType.inputs.map(inputName => {
let labelHTML = inputName;
if (['a','b','c','R','xA','yA','zA','xB','yB','zB','xC','yC','zC','xD','yD','zD'].includes(inputName)) {
const mapping = {xA:'x_A', yA:'y_A', zA:'z_A', xB:'x_B', yB:'y_B', zB:'z_B', xC:'x_C', yC:'y_C', zC:'z_C', xD:'x_D', yD:'y_D', zD:'z_D'};
labelHTML = kInline(mapping[inputName] || inputName);
} else if (inputName.includes('p')) {
labelHTML = kInline(inputName.charAt(1)); // pA -> A, pB -> B
} else if (inputName.includes('_coef')) {
labelHTML = 'HS ' + kInline(inputName[0]);
}
const val = state.inputs[inputName] || '';
return `
<div class="flex flex-col bg-black/20 p-1.5 rounded chalk-border">
<label class="text-xs font-bold text-gray-300 mb-0.5 text-center" onclick="setFocus('${inputName}')">${labelHTML}</label>
<input id="input_${inputName}" class="chalk-input text-sm" value="${val}" onclick="setFocus('${inputName}')" readonly placeholder="..."/>
</div>`;
}).join('')}
</div>
<div id="virtual-keyboard" class="opacity-0 transition-opacity duration-200 mb-3">
<div class="bg-black/30 p-2 rounded-lg grid grid-cols-5 gap-1.5">
${virtualKeys.map(k => {
let btnClass = "bg-white/10 hover:bg-white/20 border border-white/20";
if (k === 'C') btnClass = "bg-red-500/20 hover:bg-red-500/40 text-red-200 border-red-500/30";
else if (k === 'Del') btnClass = "bg-yellow-500/20 hover:bg-yellow-500/40 text-yellow-200 border-yellow-500/30";
