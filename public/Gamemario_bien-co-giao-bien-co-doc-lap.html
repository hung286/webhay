<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toán 11. Game Mario_Xác suất của biến cố giao, biến cố hợp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #5C94FC; font-family: 'Nunito', sans-serif; touch-action: none; user-select: none;}
        #gameCanvas { display: block; width: 100vw; height: 100vh; }
        
        .pixel-font { font-family: 'Press Start 2P', cursive; line-height: 1.5; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Modal Style */
        #quizModal, #leaderboardModal, #startModal { backdrop-filter: blur(8px); }
        .option-btn { transition: all 0.2s; }
        .option-btn:hover { transform: scale(1.02); }
        .option-btn:active { transform: scale(0.95); }

        /* Mobile Controls */
        #mobileControls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: none; justify-content: center; gap: 20px;
            pointer-events: none; z-index: 10;
        }
        #mobileControls.show { display: flex; }
        .control-btn {
            width: 65px; height: 65px; background: rgba(255, 255, 255, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.9); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; pointer-events: auto; user-select: none; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); backdrop-filter: blur(2px);
            transition: transform 0.1s, filter 0.1s;
        }
        .control-btn:active, .control-btn.pressed { transform: scale(0.9); filter: brightness(1.3); }

        /* Neon Glow Effects */
        .neon-text {
            text-shadow: 0 0 10px rgba(34,211,238,0.6), 0 0 20px rgba(59,130,246,0.6);
        }
        .neon-box {
            box-shadow: 0 0 20px rgba(59,130,246,0.4), inset 0 0 15px rgba(34,211,238,0.2);
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH BẮT ĐẦU GAME -->
    <div id="startModal" class="fixed inset-0 z-[100] bg-[#5C94FC] flex flex-col items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-white rounded-[2rem] p-8 shadow-2xl w-full max-w-md border-4 border-blue-500 relative flex flex-col items-center">
            <h1 class="text-2xl md:text-3xl font-black text-center text-blue-600 mb-6 uppercase tracking-wide">Mario Xác Suất 11</h1>
            
            <!-- Khu vực Logo (Có thể bấm để đổi) -->
            <div class="relative cursor-pointer mb-6 group" onclick="document.getElementById('logoUploadStart').click()" title="Đổi Logo">
                <input type="file" id="logoUploadStart" accept="image/*" class="hidden">
                <img id="startLogo" src="https://ui-avatars.com/api/?name=MH&background=0f172a&color=fde047&rounded=true&bold=true" class="w-24 h-24 rounded-full border-4 border-yellow-400 object-cover shadow-lg group-hover:scale-105 transition-transform">
                <div class="absolute inset-0 rounded-full bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <span class="text-white text-xs font-bold">ĐỔI ẢNH</span>
                </div>
            </div>

            <!-- Nhập Tên -->
            <div class="w-full bg-blue-50 p-4 rounded-2xl border border-blue-200 mb-6 shadow-sm">
                <label class="block text-sm font-extrabold text-blue-800 mb-2 uppercase tracking-wide text-center">Tên người chơi:</label>
                <input type="text" id="startPlayerName" class="w-full px-4 py-3 rounded-xl border-2 border-blue-300 font-bold outline-none focus:border-blue-500 text-slate-700 text-center text-xl" placeholder="Nhập tên của bạn...">
            </div>

            <!-- Nút Bắt Đầu -->
            <button onclick="startGame()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-4 rounded-xl font-black text-xl transition-colors shadow-md border-b-4 border-emerald-700 active:translate-y-1 active:border-b-0 uppercase tracking-widest flex justify-center items-center gap-2">
                ▶ BẮT ĐẦU
            </button>
        </div>
    </div>

    <!-- HUD TỐI ƯU -->
    <div id="top-bar" class="absolute top-4 left-4 right-4 flex justify-between items-start z-20 pointer-events-none">
        
        <!-- Trái: Thương hiệu TOÁN PRO - THẦY HÙNG & Nút Bật Tắt Điều Khiển -->
        <div class="flex items-center pointer-events-auto bg-black/40 p-1.5 md:p-2 rounded-full border border-white/20 backdrop-blur-sm shadow-lg transition">
            <input type="file" id="logoUpload" accept="image/*" class="hidden">
            <img id="brandLogo" src="https://ui-avatars.com/api/?name=MH&background=0f172a&color=fde047&rounded=true&bold=true" class="w-10 h-10 md:w-12 md:h-12 rounded-full border-2 border-yellow-400 object-cover shadow-inner hover:scale-105 transition-transform cursor-pointer" onclick="document.getElementById('logoUpload').click()" title="Đổi Logo">
            
            <div class="flex flex-col px-2 md:px-3 cursor-pointer hover:opacity-80 transition-opacity" onclick="openLeaderboard()" title="Xem Bảng Xếp Hạng">
                <span class="text-yellow-400 font-black font-sans text-xs md:text-sm leading-tight tracking-wide uppercase">TOÁN PRO - THẦY HÙNG</span>
                <span class="text-white text-[9px] md:text-[10px] font-bold mt-0.5">XẾP HẠNG 🏆</span>
            </div>
            
            <button id="toggleControlsBtn" onclick="toggleControls()" class="flex flex-col items-center justify-center border-l border-white/20 pl-2 md:pl-3 pr-1 md:pr-2 h-full transition-colors opacity-70 hover:opacity-100 text-white" title="Bật/Tắt Nút Điều Khiển">
                <span class="text-lg md:text-xl leading-none">🎮</span>
                <span id="toggleControlsText" class="text-[8px] font-bold mt-1 whitespace-nowrap">HIỆN NÚT</span>
            </button>
        </div>

        <!-- Giữa: Điểm số -->
        <div class="flex flex-col items-center pointer-events-auto bg-black/40 px-4 py-2 md:px-6 md:py-3 rounded-2xl border border-white/20 backdrop-blur-sm pixel-font text-white text-xs md:text-lg text-shadow-md shadow-lg mt-1">
            <div>ĐIỂM: <span id="scoreDisplay" class="text-yellow-400">0</span></div>
            <div class="text-[8px] md:text-[10px] mt-2 opacity-80">CÂU: <span id="qCountDisplay">0/10</span></div>
        </div>

        <!-- Phải: Tên người chơi & Thời gian & Âm thanh -->
        <div class="flex flex-col items-end gap-1.5 pointer-events-auto mt-1">
            <div class="flex gap-2 items-center">
                <button id="soundToggleBtn" onclick="toggleSound()" class="bg-rose-500/80 hover:bg-rose-500 px-3 py-2 md:py-2.5 rounded-full border-2 border-rose-300 backdrop-blur-sm shadow-lg text-white font-bold text-xs md:text-sm transition-all flex items-center gap-1">
                    🔇 Bật Âm Thanh
                </button>

                <div class="bg-blue-600/80 px-3 py-2 md:px-5 md:py-2.5 rounded-full border-2 border-blue-300 backdrop-blur-sm cursor-pointer hover:bg-blue-500 transition shadow-lg" onclick="openLeaderboard()">
                    <span class="text-white font-black font-sans text-xs md:text-base flex items-center gap-2">
                        <span class="text-lg md:text-xl">👤</span> <span id="playerNameDisplay" class="truncate max-w-[80px] md:max-w-[150px]">Người chơi</span>
                    </span>
                </div>
            </div>
            
            <div class="bg-black/60 px-4 py-1.5 rounded-full border border-white/20 text-white font-bold pixel-font text-[10px] md:text-sm shadow-md mt-1">
                ⏱ <span id="timeDisplay">00:00</span>
            </div>
        </div>
    </div>

    <!-- Nền Game -->
    <canvas id="gameCanvas"></canvas>

    <!-- Mobile Controls -->
    <div id="mobileControls">
        <div class="control-btn" id="btnLeft">◀</div>
        <div class="control-btn" id="btnJump" style="background: rgba(239, 68, 68, 0.6); border-color: #fca5a5;">▲</div>
        <div class="control-btn" id="btnRight">▶</div>
    </div>

    <!-- BẢNG XẾP HẠNG MODAL -->
    <div id="leaderboardModal" class="hidden fixed inset-0 z-[80] bg-black/70 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-2xl w-full max-w-lg border-4 border-blue-500 relative flex flex-col max-h-[95vh] transform scale-95 transition-transform duration-300" id="lbContent">
            <button id="lbCloseBtn" onclick="closeLeaderboard()" class="absolute top-4 right-4 bg-slate-200 hover:bg-slate-300 w-8 h-8 rounded-full font-bold text-slate-600 flex items-center justify-center transition-colors">X</button>
            <h2 class="text-2xl md:text-3xl font-black text-center text-blue-600 mb-6 uppercase tracking-wide">Hồ Sơ & Xếp Hạng</h2>
            
            <!-- Section Đổi Tên -->
            <div id="lbRenameSection" class="bg-blue-50 p-4 rounded-2xl border border-blue-200 mb-5 shrink-0 shadow-sm">
                <label class="block text-xs md:text-sm font-extrabold text-blue-800 mb-2 uppercase tracking-wide">Đổi tên người chơi hiện tại:</label>
                <div class="flex gap-2">
                    <input type="text" id="playerNameInput" class="flex-1 px-4 py-3 rounded-xl border-2 border-blue-300 font-bold outline-none focus:border-blue-500 text-slate-700 text-lg" placeholder="Nhập tên của bạn...">
                    <button onclick="savePlayerName()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition-colors shadow-md text-lg">Lưu</button>
                </div>
            </div>

            <!-- Danh sách Xếp hạng -->
            <h3 class="font-black text-slate-700 mb-3 shrink-0 flex items-center gap-2 border-b-2 border-slate-100 pb-2">
                <span class="text-2xl">🏆</span> BẢNG VÀNG (Lưu tới 1000)
            </h3>
            <div id="leaderboardList" class="flex-1 overflow-y-auto custom-scroll pr-2 space-y-2.5">
            </div>

            <!-- Section ĐIỀU HƯỚNG MỚI -->
            <div id="lbNextPlayerSection" class="hidden flex-col gap-4 mt-4 pt-5 border-t-2 border-slate-200">
                <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl">
                    <h4 class="font-black text-emerald-700 text-center uppercase tracking-wide text-lg mb-1">Lượt Chơi Tiếp Theo</h4>
                    <p class="text-xs text-center text-emerald-600/80 font-bold mb-3">Hệ thống sẽ chọn ngẫu nhiên bộ câu hỏi mới!</p>
                    <input type="text" id="nextPlayerNameInput" class="w-full px-4 py-3 rounded-xl border-2 border-emerald-300 font-bold outline-none focus:border-emerald-500 text-slate-700 placeholder-slate-400 text-center text-lg" placeholder="Nhập tên người tiếp theo...">
                </div>
                
                <div class="flex gap-3">
                    <button onclick="goHome()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-3.5 rounded-xl font-black transition-colors shadow-md border-b-4 border-slate-400 active:translate-y-1 active:border-b-0 uppercase flex justify-center items-center gap-2">
                        🏠 Về Trang Chủ
                    </button>
                    <button onclick="startNextPlayer()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-xl font-black transition-colors shadow-md border-b-4 border-emerald-700 active:translate-y-1 active:border-b-0 uppercase flex justify-center items-center gap-2">
                        ▶ Bắt Đầu
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- QUIZ MODAL (GIAO DIỆN NEON LỚN HƠN) -->
    <div id="quizModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-slate-900 rounded-[2rem] p-6 md:p-10 neon-box w-full max-w-4xl transform scale-95 transition-transform duration-300 border border-cyan-500/50 relative flex flex-col items-center" id="modalContent">
            <!-- Icon Dấu Hỏi / Nấm -->
            <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-slate-800 w-24 h-24 rounded-full border-4 border-cyan-400 flex items-center justify-center shadow-[0_0_20px_rgba(34,211,238,0.8)]">
                <span class="text-5xl font-black text-yellow-400 pixel-font mt-2">?</span>
            </div>
            
            <h2 class="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 mb-3 mt-6 text-center uppercase tracking-widest neon-text">
                THỬ THÁCH TOÁN HỌC 11
            </h2>
            <div class="w-24 h-1.5 bg-cyan-500 mx-auto mb-8 rounded-full shadow-[0_0_10px_rgba(6,182,212,0.8)]"></div>
            
            <div id="questionText" class="text-xl md:text-3xl font-bold text-white mb-10 text-center leading-relaxed w-full max-w-3xl drop-shadow-md">
                Nội dung câu hỏi sẽ hiện ở đây...
            </div>
            
            <div id="optionsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 w-full max-w-3xl">
                <!-- Các nút đáp án sẽ được chèn bằng JS -->
            </div>
        </div>
    </div>

    <!-- THÔNG BÁO ĐÚNG/SAI/HOÀN THÀNH -->
    <div id="feedbackToast" class="hidden fixed top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[60] text-5xl md:text-7xl font-black pixel-font text-center drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)]">
        +100
    </div>

    <script>
        // Polyfill cho hàm vẽ khung bo góc 
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
                this.beginPath(); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
                this.closePath(); return this;
            };
        }

        // ==========================================
        // 🎵 HỆ THỐNG ÂM THANH 8-BIT 
        // ==========================================
        const SoundEngine = {
            ctx: null, isMuted: true, bgmInterval: null,
            init: function() {
                if (!this.ctx) { window.AudioContext = window.AudioContext || window.webkitAudioContext; this.ctx = new AudioContext(); }
                if (this.ctx.state === 'suspended') this.ctx.resume();
                this.isMuted = false; this.playBGM();
            },
            mute: function() { this.isMuted = true; if (this.bgmInterval) clearInterval(this.bgmInterval); },
            playTone: function(freq, type, duration, vol=0.05) {
                if(this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            },
            jump: function() {
                if(this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            },
            coin: function() {
                this.playTone(987.77, 'square', 0.1, 0.05); setTimeout(() => this.playTone(1318.51, 'square', 0.3, 0.05), 100); 
            },
            bump: function() { this.playTone(150, 'square', 0.1, 0.1); },
            wrong: function() {
                this.playTone(200, 'sawtooth', 0.2, 0.08); setTimeout(() => this.playTone(150, 'sawtooth', 0.4, 0.08), 150);
            },
            win: function() {
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
                notes.forEach((freq, i) => { setTimeout(() => this.playTone(freq, 'square', 0.15, 0.05), i * 150); });
            },
            playBGM: function() {
                if (this.bgmInterval) clearInterval(this.bgmInterval);
                if (this.isMuted) return;
                const notes = [659, 0, 659, 0, 0, 659, 0, 523, 659, 0, 784, 0, 0, 0, 392, 0, 0, 0];
                let i = 0;
                this.bgmInterval = setInterval(() => {
                    if (this.isMuted || gameState !== 'playing' && gameState !== 'autofinish') return;
                    if (notes[i] > 0) this.playTone(notes[i], 'square', 0.1, 0.02);
                    i = (i + 1) % notes.length;
                }, 150);
            }
        };

        window.toggleSound = function() {
            const btn = document.getElementById('soundToggleBtn');
            if (SoundEngine.isMuted) {
                SoundEngine.init(); btn.innerHTML = "🔊 Tắt Âm Thanh";
                btn.className = "bg-emerald-500/80 hover:bg-emerald-500 px-3 py-2 md:py-2.5 rounded-full border-2 border-emerald-300 backdrop-blur-sm shadow-lg text-white font-bold text-xs md:text-sm transition-all flex items-center gap-1";
            } else {
                SoundEngine.mute(); btn.innerHTML = "🔇 Bật Âm Thanh";
                btn.className = "bg-rose-500/80 hover:bg-rose-500 px-3 py-2 md:py-2.5 rounded-full border-2 border-rose-300 backdrop-blur-sm shadow-lg text-white font-bold text-xs md:text-sm transition-all flex items-center gap-1";
            }
        }

        // ==========================================
        // QUẢN LÝ DỮ LIỆU & BẢNG XẾP HẠNG 
        // ==========================================
        let currentPlayerName = localStorage.getItem('mario_playerName') || '';
        let leaderboardData = JSON.parse(localStorage.getItem('mario_leaderboard_toan11')) || [];
        
        // Cập nhật giá trị ban đầu vào Modal Start
        document.getElementById('startPlayerName').value = currentPlayerName;

        let gameTime = 0; 
        function formatTime(seconds) {
            let m = Math.floor(seconds / 60); let s = Math.floor(seconds % 60);
            return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
        }

        // Quản lý Đổi Logo (Tối ưu để ảnh dung lượng lớn không làm sập LocalStorage)
        function updateLogos(b64) {
            document.getElementById('brandLogo').src = b64;
            document.getElementById('startLogo').src = b64;
        }
        
        function handleLogoChange(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // Nén ảnh: Resize tối đa 150x150 để đảm bảo LocalStorage luôn lưu được
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 150;
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } }
                        else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        
                        // Đổ nền trắng (phòng trường hợp ảnh trong suốt chuyển sang JPEG bị đen)
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, w, h);
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        // SỬA LỖI: Dùng image/jpeg và chất lượng 0.8 để giảm triệt để dung lượng
                        const compressedB64 = canvas.toDataURL('image/jpeg', 0.8); 
                        updateLogos(compressedB64);
                        try { 
                            localStorage.setItem('mario_logo_v2', compressedB64); 
                        } catch(err) { 
                            console.warn("Không thể lưu logo vào bộ nhớ tạm do ảnh quá lớn."); 
                        }
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        }
        
        document.getElementById('logoUpload').addEventListener('change', handleLogoChange);
        document.getElementById('logoUploadStart').addEventListener('change', handleLogoChange);
        
        // SỬA LỖI: Đọc logo từ key mới (mario_logo_v2) hoặc fallback về key cũ
        const savedLogo = localStorage.getItem('mario_logo_v2') || localStorage.getItem('mario_logo');
        if(savedLogo) updateLogos(savedLogo);

        // Nút BẮT ĐẦU từ màn hình chờ
        window.startGame = function() {
            const nameInput = document.getElementById('startPlayerName').value.trim();
            if (!nameInput) {
                alert("Vui lòng nhập tên của bạn để bắt đầu đua top!");
                document.getElementById('startPlayerName').focus();
                return;
            }
            
            currentPlayerName = nameInput;
            localStorage.setItem('mario_playerName', currentPlayerName);
            document.getElementById('playerNameDisplay').textContent = currentPlayerName;
            document.getElementById('playerNameInput').value = currentPlayerName;

            // Tự động bật âm thanh khi bấm BẮT ĐẦU (Vì đây là user gesture hợp lệ)
            if (SoundEngine.isMuted) {
                toggleSound();
            }

            // Đóng Modal và chuyển state
            document.getElementById('startModal').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('startModal').style.display = 'none';
                gameState = 'playing';
                gameTime = 0;
            }, 300);
        };

        function savePlayerName() {
            const inputVal = document.getElementById('playerNameInput').value.trim();
            if (inputVal) {
                currentPlayerName = inputVal;
                localStorage.setItem('mario_playerName', currentPlayerName);
                document.getElementById('playerNameDisplay').textContent = currentPlayerName;
                
                const btn = event.target; const originalText = btn.textContent;
                btn.textContent = "Đã Lưu!"; btn.classList.replace('bg-blue-600', 'bg-emerald-500');
                setTimeout(() => { btn.textContent = originalText; btn.classList.replace('bg-emerald-500', 'bg-blue-600'); }, 1500);
            }

                    leaderboardData[existingIndex].date = dateStr;

            // Sắp xếp lại bảng vàng

                return a.time - b.time;
            });

            set.push({ q: "Nếu $A$ và $B$ là hai biến cố độc lập, công thức tính xác suất của biến cố giao $AB$ là:", options: ["$P(AB) = P(A) \\cdot P(B)$", "$P(AB) = P(A) + P(B)$", "$P(AB) = 0$", "$P(AB) = P(A) - P(B)$"], correct: 0 });
            set.push({ q: `Cho $A, B$ là hai biến cố xung khắc. Biết $P(A) = ${pA}$ và $P(B) = ${pB}$. Tính $P(A \\cup B)$.`, options: [`$${pAUB_mutExc}$`, `$${pAB_indep}$`, `$0$`, `$1$`], correct: 0 });
            set.push({ q: `Cho $A, B$ là hai biến cố độc lập. Biết $P(A) = ${pA}$ và $P(B) = ${pB}$. Tính $P(AB)$.`, options: [`$${pAB_indep}$`, `$${pAUB_mutExc}$`, `$${Math.abs(pA - pB).toFixed(2)}$`, `$0$`], correct: 0 });
            set.push({ q: `Cho hai biến cố $A, B$ có $P(A) = ${pA}$, $P(B) = ${pB}$ và $P(AB) = ${pAB_given}$. Tính xác suất $P(A \\cup B)$.`, options: [`$${pAUB_given}$`, `$${pAUB_mutExc}$`, `$${pA}$`, `$${pB}$`], correct: 0 });

            set.push({ q: `Hai xạ thủ bắn độc lập vào bia. Xác suất bắn trúng của người 1 là $${pA}$, của người 2 là $${pB}$. Tính xác suất cả hai người đều bắn trúng.`, options: [`$${pAB_indep}$`, `$${pAUB_mutExc}$`, `$${Math.max(pA, pB)}$`, `$0$`], correct: 0 });
            set.push({ q: `Biến cố đối của biến cố giao $(AB)$ là biến cố nào sau đây?`, options: ["$\\overline{A} \\cup \\overline{B}$", "$\\overline{A} \\cdot \\overline{B}$", "$\\overline{A} \\cap B$", "$A \\cup \\overline{B}$"], correct: 0 });
            set.push({ q: `Hai người bắn súng độc lập với xác suất trúng đích lần lượt là $${pA}$ và $${pB}$. Tính xác suất có ít nhất một người bắn trúng.`, options: [`$${pAUB_indep}$`, `$${pAUB_mutExc}$`, `$${pAB_indep}$`, `$${pNone}$`], correct: 0 });

            set.push({ q: `Hai công nhân cùng làm chung một sản phẩm một cách độc lập. Xác suất làm ra phế phẩm của người 1 là $${pA}$, người 2 là $${pB}$. Tính xác suất để cả hai đều làm ra sản phẩm đạt chuẩn (không phải phế phẩm).`, options: [`$${pNone}$`, `$${pAB_indep}$`, `$${pAUB_indep}$`, `$${+(1 - pNone).toFixed(4)}$`], correct: 0 });

            set.forEach(q => {
                const correctStr = q.options[q.correct];
                for (let j = q.options.length - 1; j > 0; j--) {
                    const k = Math.floor(Math.random() * (j + 1));
                    [q.options[j], q.options[k]] = [q.options[k], q.options[j]];

            });

            questionBanks.push(set);

        let lastBankIndex = parseInt(localStorage.getItem('mario_lastBankIndex_t11'));

        const canvas = document.getElementById('gameCanvas');

        let width, height;

        function drawMario(p) {
            ctx.save();
            ctx.translate(p.x + p.w/2, p.y + p.h/2); 
            if (!p.facingRight) ctx.scale(-1, 1); 

            if (Math.abs(p.vx) > 0.5 && p.onGround) p.walkAnim = (p.walkAnim || 0) + 0.3; 
            else p.walkAnim = 0;

            const isJumping = !p.onGround;
            const swing = isJumping ? 0 : Math.sin(p.walkAnim); 

            const red = '#E52521', blue = '#0058F8', skin = '#FBD000', brown = '#8B4513', black = '#000000', white = '#FFFFFF';
            const sx = p.w / 50; const sy = p.h / 70; ctx.scale(sx, sy);

            ctx.fillStyle = blue; ctx.save(); ctx.translate(0, 15); ctx.rotate(isJumping ? -Math.PI/4 : swing * 0.6);
            ctx.fillRect(-8, 0, 12, 16); ctx.fillStyle = brown; ctx.beginPath(); ctx.ellipse(-2, 16, 10, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();

            ctx.fillStyle = red; ctx.save(); ctx.translate(-8, -5); ctx.rotate(isJumping ? Math.PI/3 : -swing * 0.6);
            ctx.fillRect(-6, 0, 10, 18); ctx.fillStyle = white; ctx.beginPath(); ctx.arc(-1, 18, 7, 0, Math.PI*2); ctx.fill(); ctx.restore();

            ctx.fillStyle = red; ctx.beginPath(); ctx.roundRect(-16, -12, 32, 28, 10); ctx.fill(); 
            ctx.fillStyle = blue; ctx.beginPath(); ctx.roundRect(-18, 4, 36, 18, 8); ctx.fill(); 
            ctx.fillStyle = '#F8B800'; ctx.beginPath(); ctx.arc(-10, 8, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(10, 8, 4, 0, Math.PI*2); ctx.fill();

            ctx.save(); ctx.translate(0, -24);
            ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(16, 2, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = black; ctx.beginPath(); ctx.ellipse(14, 8, 10, 4, -Math.PI/12, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(8, -5, 3, 5, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = red; ctx.beginPath(); ctx.arc(-2, -6, 16, Math.PI, Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.roundRect(-18, -6, 38, 6, 3); ctx.fill(); 
            ctx.restore();

            ctx.fillStyle = blue; ctx.save(); ctx.translate(0, 15); ctx.rotate(isJumping ? Math.PI/5 : -swing * 0.6);
            ctx.fillRect(-2, 0, 12, 16); ctx.fillStyle = brown; ctx.beginPath(); ctx.ellipse(4, 16, 10, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();

            ctx.fillStyle = red; ctx.save(); ctx.translate(8, -5);
            if (isJumping) { ctx.translate(0, -8); ctx.rotate(Math.PI - 0.2); } else { ctx.rotate(swing * 0.6); }
            ctx.fillRect(-5, 0, 10, 18); ctx.fillStyle = white; ctx.beginPath(); ctx.arc(0, 18, 7, 0, Math.PI*2); ctx.fill(); ctx.restore();

            ctx.restore();
        }

        function drawQuestionBlock(x, y, w, h, hit) {

            ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2; const tileSize = 40; const shift = offsetX % tileSize;
            for (let i = -tileSize; i < width + tileSize; i += tileSize) {
                for (let j = 0; j < 100; j += 20) ctx.strokeRect(i - shift + (j%40==0?0:20), groundY + j, tileSize, 20);

        const player = { x: 100, y: 0, w: 56, h: 70, vx: 0, vy: 0, speed: 7, jumpForce: 23, gravity: 0.8, onGround: false, facingRight: true, walkAnim: 0 };

        let levelLength = blocks[blocks.length-1].x + 800; 

        let cameraX = 0; let keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, Space: false };

        // --- ĐIỀU KHIỂN & NÚT BẤM ẢO ---

            if(e.code === 'ArrowLeft') keys.ArrowLeft = false; if(e.code === 'ArrowRight') keys.ArrowRight = false; if(e.code === 'ArrowUp' || e.code === 'Space') keys.ArrowUp = false;

        function checkCollision(r1, r2) { return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y; }

        function update() {
            if (gameState !== 'playing' && gameState !== 'autofinish') return;

            if (gameState === 'autofinish') {
                keys.ArrowRight = true; keys.ArrowLeft = false; keys.ArrowUp = false;
            }

            if (keys.ArrowLeft) { player.vx = -player.speed; player.facingRight = false; }
            else if (keys.ArrowRight) { player.vx = player.speed; player.facingRight = true; }
            else { player.vx *= 0.8; } 

            player.x += player.vx;
            if (player.x < cameraX) player.x = cameraX;

            player.vy += player.gravity; player.y += player.vy; player.onGround = false;

            let currentGroundY = height - 100;
            if (player.y + player.h > currentGroundY) { player.y = currentGroundY - player.h; player.vy = 0; player.onGround = true; }

            if (keys.ArrowUp && player.onGround) { player.vy = -player.jumpForce; player.onGround = false; SoundEngine.jump(); }

            for (let b of blocks) {
                if (b.bounceY > 0) b.bounceY -= 1;
                let bRect = {x: b.x, y: b.y - b.bounceY, w: b.w, h: b.h};

                if (checkCollision(player, bRect)) {
                    if (player.vy < 0 && player.y > bRect.y + bRect.h - 25) {
                        player.y = bRect.y + bRect.h; player.vy = 0; SoundEngine.bump();
                        if (!b.hit) triggerQuestion(b);
                    } else if (player.vy > 0 && player.y + player.h < bRect.y + 30) {
                        player.y = bRect.y - player.h; player.vy = 0; player.onGround = true;
                    } else {
                        if (player.vx > 0) player.x = bRect.x - player.w; if (player.vx < 0) player.x = bRect.x + bRect.w; player.vx = 0;
                    }
                }
            }

            let targetCameraX = player.x - width / 3;
            if (targetCameraX > cameraX) { cameraX += (targetCameraX - cameraX) * 0.1; }

            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i]; c.y += c.vy; c.vy += 0.5; c.life--; if (c.life <= 0) coins.splice(i, 1);
            }

            if (player.x > levelLength && gameState !== 'gameover') {
                triggerFinish();
            }
        }

        let currentBlock = null;

            block.questionData.options.forEach((optHTML, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full bg-slate-800 hover:bg-blue-900/60 border-2 border-slate-600 hover:border-cyan-400 text-cyan-50 font-bold py-5 px-6 rounded-2xl text-center text-lg md:text-xl shadow-[0_4px_15px_rgba(0,0,0,0.3)] hover:shadow-[0_0_15px_rgba(34,211,238,0.4)] transition-all flex items-center justify-center min-h-[80px]";
                btn.innerHTML = optHTML; btn.onclick = () => checkAnswer(idx); optContainer.appendChild(btn);
            });

            modal.classList.remove('hidden');
            MathJax.typesetClear();
            MathJax.typesetPromise().then(() => { setTimeout(() => { content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10); });
        }

        function checkAnswer(selectedIndex) {
            const modal = document.getElementById('quizModal'); const content = document.getElementById('modalContent');
            content.classList.remove('scale-100'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);

            const isCorrect = (selectedIndex === currentBlock.questionData.correct);
            const isLastBlock = (currentBlock === blocks[blocks.length - 1]);
            let resolvedLast = false;

            if (isCorrect) {
                score += 100; currentBlock.hit = true; currentQuestionIndex++;
                coins.push({ x: currentBlock.x + BLOCK_SIZE/2, y: currentBlock.y, vy: -12, life: 35 });
                showToast("+100", "#fde047"); SoundEngine.coin(); 
                
                if (isLastBlock) resolvedLast = true;
            } else {
                score = Math.max(0, score - 50); showToast("-50", "#ef4444"); SoundEngine.wrong(); 
                
                if (isLastBlock) {
                    lastQuestionAttempts++;
                    if (lastQuestionAttempts >= 3) {
                        currentBlock.hit = true; 
                        resolvedLast = true;
                    }
                }
            }
            
            document.getElementById('scoreDisplay').textContent = score;
            
            setTimeout(() => { 
                if (resolvedLast) { gameState = 'autofinish'; } 
                else { gameState = 'playing'; }
            }, 200);
        }

        function showToast(text, color) {
            const toast = document.getElementById('feedbackToast'); toast.textContent = text; toast.style.color = color; toast.classList.remove('hidden');
            toast.animate([ { transform: 'translate(-50%, -50%) scale(0)', opacity: 0 }, { transform: 'translate(-50%, -80%) scale(1.2)', opacity: 1, offset: 0.5 }, { transform: 'translate(-50%, -100%) scale(1)', opacity: 0 } ], { duration: 1500, easing: 'ease-out' });
            setTimeout(() => { toast.classList.add('hidden'); }, 1500);
        }

        function draw() {
            ctx.fillStyle = '#5C94FC'; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            for(let i=0; i<5; i++) {
                let cx = ((i*400) - cameraX*0.2) % (width + 200); if(cx < -100) cx += width + 200;
                ctx.beginPath(); ctx.arc(cx, 100 + (i%2)*50, 40, 0, Math.PI*2); ctx.arc(cx+40, 100 + (i%2)*50, 50, 0, Math.PI*2); ctx.arc(cx+80, 100 + (i%2)*50, 40, 0, Math.PI*2); ctx.fill();
            }

            ctx.save(); ctx.translate(-cameraX, 0); 
            for (let b of blocks) drawQuestionBlock(b.x, b.y - b.bounceY, b.w, b.h, b.hit);
            for (let c of coins) {
                ctx.fillStyle = '#F8B800'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 14, 20, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 8, 14, 0, 0, Math.PI*2); ctx.fill();
            }
            drawMario(player);
            
            const flagX = levelLength - 150;
            ctx.fillStyle = '#fde047'; ctx.fillRect(flagX - 5, GROUND_Y - 500, 10, 500); 
            ctx.fillStyle = '#22c55e'; ctx.fillRect(flagX, GROUND_Y - 480, 80, 60); 
            ctx.fillStyle = 'white'; ctx.font = "20px 'Press Start 2P'"; ctx.fillText("ĐÍCH", flagX + 40, GROUND_Y - 445);
            ctx.restore();
            drawGround(cameraX);
        }

        let lastTime = 0;
        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 1000; lastTime = timestamp;
            if (dt > 0.1) dt = 0.1;
            
            if (gameState === 'playing' || gameState === 'autofinish') { 
                gameTime += dt; 
                document.getElementById('timeDisplay').textContent = formatTime(gameTime); 
            }
            update(); draw(); requestAnimationFrame(loop);
        }

        document.fonts.ready.then(() => { requestAnimationFrame(loop); });
    </script>
</body>
</html>
