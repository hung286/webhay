        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            try {
                if(audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) { } // Chống crash DOM nếu trình duyệt chặn Autoplay Audio
        }

        function drawStaticGrid() {
            let html = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    let isBase = (r < 6 && c < 6) || (r < 6 && c > 8) || (r > 8 && c > 8) || (r > 8 && c < 6);
                    if (isBase) {
                        if ((r===0&&c===0) || (r===0&&c===9) || (r===9&&c===9) || (r===9&&c===0)) {
                            let colorObj = (r===0&&c===0)?COLORS[0] : (r===0&&c===9)?COLORS[1] : (r===9&&c===9)?COLORS[2] : COLORS[3];
                            html += `<div style="grid-row: ${r+1} / span 6; grid-column: ${c+1} / span 6;" class="rounded-2xl sm:rounded-[2rem] border-2 ${colorObj.border} bg-black/40 backdrop-blur-xl transition-all" id="base-${colorObj.id}"></div>`;
                        }
                        continue;
                    }

                    let isCenterBlock = r >= 6 && r <= 8 && c >= 6 && c <= 8;
                    if (isCenterBlock) {
                        if (r===7 && c===7) html += `<div style="grid-row: 8; grid-column: 8;" class="relative flex items-center justify-center z-0">
                            <div class="absolute w-[300%] h-[300%] flex items-center justify-center pointer-events-none">
                                <div class="absolute inset-1 sm:inset-2 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white/20 to-transparent rounded-full animate-spin-slow blur-md border border-white/10"></div>
                                <svg class="w-12 h-12 text-yellow-400 z-10 drop-shadow-[0_0_20px_rgba(250,204,21,1)] animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.518l4.276 3.664a1 1 0 0 0 1.516-.294z"></path><path d="M5 21h14"></path></svg>
                            </div>
                        </div>`;
                        continue; // Bỏ qua các ô góc trung tâm
                    }

                    let pathIdx = MAIN_PATH.findIndex(p => p[0] === r && p[1] === c);
                    let isPath = pathIdx !== -1;
                    let isStart = (r===6&&c===1) || (r===1&&c===8) || (r===8&&c===13) || (r===13&&c===6);
                    
                    let isHome = false;
                    let colorObj = null;
                    let num = '';
                    
                    // 5 Ô VỀ ĐÍCH CỦA CÁC ĐỘI
                    if (r===7 && c>=1 && c<=5) { isHome = true; colorObj = COLORS[0]; num = c; }
                    else if (c===7 && r>=1 && r<=5) { isHome = true; colorObj = COLORS[1]; num = r; }
                    else if (r===7 && c>=9 && c<=13) { isHome = true; colorObj = COLORS[2]; num = 14-c; }
                    else if (c===7 && r>=9 && r<=13) { isHome = true; colorObj = COLORS[3]; num = 14-r; }

                    if (isPath || isHome) {
                        if (isStart) {
                            if (r===6&&c===1) colorObj = COLORS[0];
                            if (r===1&&c===8) colorObj = COLORS[1];
                            if (r===8&&c===13) colorObj = COLORS[2];
                            if (r===13&&c===6) colorObj = COLORS[3];
                        }

                        let cellClass = `border border-white/10 rounded-lg flex items-center justify-center relative `;
                        if(isHome) cellClass += `${colorObj.bg}/10 ${colorObj.border} `;
                        else cellClass += `bg-slate-800/40 `;
                        if(isStart) cellClass += `bg-gradient-to-br from-slate-800 to-[${colorObj.hex}] ${colorObj.border} border-2 `;

                        let content = '';
                        if (isHome) {
                            content = `<span class="text-[0.6rem] font-black opacity-40 ${colorObj.text}">${num}</span>`;
                        } else if (isStart) {
                            content = `<div class="w-4 h-4 ${colorObj.text} drop-shadow-md absolute opacity-60"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></div>`;
                        } else if (isPath) {
                            let nextP = MAIN_PATH[(pathIdx + 1) % 52];
                            let arrow = '';
                            if (nextP[1] > c) arrow = '→';
                            else if (nextP[1] < c) arrow = '←';
                            else if (nextP[0] > r) arrow = '↓';
                            else if (nextP[0] < r) arrow = '↑';
                            content = `<span class="text-[0.65rem] text-white/20 font-bold pointer-events-none">${arrow}</span>`;
                        }
                        
                        html += `<div style="grid-row: ${r+1}; grid-column: ${c+1};" class="${cellClass}">${content}</div>`;
                    }
                }
            }
            document.getElementById('grid-bg').innerHTML = html;
        }

        function initTokensDOM() {
            let html = '';
            COLORS.forEach(c => {
                for (let i = 0; i < 4; i++) {
                    html += `<div id="token-${c.id}-${i}" class="token" onclick="handleTokenClick('${c.id}', ${i})">${getHorseSVG(c.hex, `render-${c.id}-${i}`, '100%')}</div>`;
                }
            });
            document.getElementById('tokens-layer').innerHTML = html;
        }

        function updateTokensDOM() {
            let posMap = {};
            
            COLORS.forEach(c => {
                state.tokens[c.id].forEach((pos, idx) => {
                    let r, c_grid;
                    if (pos === -1) {
                        [r, c_grid] = BASE_COORDS[c.id][idx];
                    } else if (pos >= 0 && pos <= 50) { 
                        // NGỰA ĐI VÒNG NGOÀI (51 BƯỚC)
                        const absPos = (pos + c.offset) % 52;
                        [r, c_grid] = MAIN_PATH[absPos];
                    } else if (pos >= 100 && pos <= 104) {
                        // NGỰA ĐÃ VỀ ĐÍCH AN TOÀN (VỊ TRÍ 1, 2, 3, 4, 5)
                        const slot = pos - 100;
                        [r, c_grid] = HOME_PATHS[c.id][slot];
                    } else {
                        r = 7; c_grid = 7; 
                    }
                    
                    let key = `${r}-${c_grid}`;
                    if (!posMap[key]) posMap[key] = [];
                    posMap[key].push({ id: `token-${c.id}-${idx}`, r, c_grid, color: c.id, pos });
                });
            });

            for (let key in posMap) {
                let group = posMap[key];
                let count = group.length;
                group.forEach((t, i) => {
                    let el = document.getElementById(t.id);
                    let ox = 0, oy = 0;
                    if (count > 1 && t.pos !== -1 && t.pos < 100) {
                        let angle = (i / count) * Math.PI * 2;
                        ox = Math.cos(angle) * 1.5;
                        oy = Math.sin(angle) * 1.5;
                    }
                    el.style.left = `calc(${(t.c_grid + 0.5) * (100/15)}% + ${ox}%)`;
                    el.style.top = `calc(${(t.r + 0.5) * (100/15)}% + ${oy}%)`;

                    // Hiệu ứng phát sáng ngựa được phép đi
                    if (state.phase === 'select_token' && state.turn === COLORS.findIndex(c => c.id === t.color) && state.validMoves.includes(parseInt(t.id.split('-')[2]))) {
                        el.classList.add('animate-pulse-glow');
                        el.style.pointerEvents = 'auto';
                        el.style.cursor = 'pointer';
                        el.style.color = COLORS.find(c => c.id === t.color).hex; 
                    } else {
                        el.classList.remove('animate-pulse-glow');
                        el.style.pointerEvents = 'none';
                        el.style.cursor = 'default';
                    }
                });
            }
        }

        function updateUI() {
            if (state.phase === 'setup' || state.phase === 'finished') return; 
            
            const cp = state.players[state.turn];
            const sorted = [...state.players].sort((a,b) => b.score - a.score);

            document.getElementById('leaderboard').innerHTML = sorted.map((p, i) => `

                    <span class="font-black text-xs sm:text-lg ${i===0?'text-yellow-400':'text-slate-500'}">#${i+1}</span>
                    <div class="flex flex-col ml-0.5 sm:ml-1">

            const renderCard = (p) => {

                return `
                    <div class="relative p-4 rounded-3xl bg-slate-900/60 backdrop-blur-md border transition-all duration-500 ${isTurn ? `border-2 scale-105 ${p.border} ${p.shadow} bg-slate-800/80` : 'border-white/10 opacity-70'}">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-12 h-12 rounded-xl bg-black/60 border ${p.border} flex items-center justify-center font-black ${p.text} text-xl">${p.name[0]}</div>

                            <span class="absolute inset-0 flex items-center justify-center text-[10px] font-black drop-shadow-md">${p.score} bước</span>
                        </div>
                    </div>
                `;
            };
            document.getElementById('panel-left').innerHTML = renderCard(state.players[0]) + renderCard(state.players[3]);
            document.getElementById('panel-right').innerHTML = renderCard(state.players[1]) + renderCard(state.players[2]);

            const totalDice = state.dice[0];
            let btnText = 'TUNG XÚC XẮC';
            if (state.phase === 'select_token') btnText = 'ĐANG CHỌN NGỰA...';
            else if (state.phase !== 'playing') btnText = 'ĐANG XỬ LÝ...';

            document.getElementById('dice-control').innerHTML = `
                <div class="absolute inset-0 opacity-10 ${cp.bg} transition-opacity duration-500"></div>
                <div class="current-turn-box dice-wrapper relative z-10 flex flex-col items-center text-center">
                    <h3 class="text-slate-400 text-xs font-bold tracking-widest mb-1 uppercase">Lượt hiện tại</h3>
                    <h2 class="text-2xl font-black mb-4 drop-shadow-md tracking-wider ${cp.text}">${cp.name}</h2>
                    <div id="dice-container" class="dice-view dice-cube-wrapper flex gap-4 mb-4 justify-center cursor-pointer hover:scale-110 active:scale-95 transition-transform" onclick="rollDice()" title="Chạm vào đây để gieo xúc xắc">
                        ${getDiceSVG(state.dice[0], cp.hex)}
                    </div>
                    ${state.phase !== 'playing' ? `
                        <div class="mb-4 bg-black/50 px-4 py-2 rounded-xl border border-white/10 w-full shadow-inner">
                            <p class="text-sm text-slate-300">Điểm tung: <span class="font-black text-xl ${cp.text} ml-1">${totalDice}</span></p>
                        </div>
                    ` : ''}
                    <button onclick="rollDice()" ${(state.phase !== 'playing') ? 'disabled' : ''}
                        class="w-full py-3 sm:py-4 px-2 sm:px-4 rounded-xl font-black text-xs sm:text-base md:text-lg tracking-normal sm:tracking-wider uppercase transition-all duration-300 flex items-center justify-center text-center shadow-lg ${(state.phase !== 'playing') ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : `${cp.bg} text-slate-950 hover:scale-105 active:scale-95 ${cp.shadow} cursor-pointer`}">
                        ${btnText}
                    </button>
                </div>
            `;

            setupDiceClickListeners();
            updateTokensDOM();
            renderModal();
        }

        function getDiceSVG(val, color) {
            let dots = '';
            const d = (cx, cy) => `<circle cx="${cx}" cy="${cy}" r="2" fill="${color}" filter="drop-shadow(0 0 2px ${color})" />`;
            if(val===1) dots = d(12,12);
            if(val===2) dots = d(6,6)+d(18,18);
            if(val===3) dots = d(6,6)+d(12,12)+d(18,18);
            if(val===4) dots = d(6,6)+d(18,6)+d(6,18)+d(18,18);
            if(val===5) dots = d(6,6)+d(18,6)+d(12,12)+d(6,18)+d(18,18);
            if(val===6) dots = d(6,5)+d(18,5)+d(6,12)+d(18,12)+d(6,19)+d(18,19);
            
            return `<svg id="mini-dice" onclick="rollDice()" width="60" height="60" viewBox="0 0 24 24" class="bg-slate-800 rounded-xl border border-white/20 shadow-[inset_0_0_10px_rgba(0,0,0,0.8)] cursor-pointer hover:scale-105 active:scale-95 transition-transform ${state.phase === 'rolling' ? 'animate-[spin_0.2s_linear_infinite] scale-110' : ''}" style="border-color: ${color}60">${dots}</svg>`;
        }

        // 2. CẤU HÌNH SỰ KIỆN CLICK VÀO KHỐI XÚC XẮC ĐỂ GIEO ĐIỂM (TOUCH FOR VIEWPORTS)
        function setupDiceClickListeners() {
            const diceElements = document.querySelectorAll('#dice-container, .dice-view, .dice-wrapper, #dice-element, #mini-dice, .current-turn-box, .dice-cube-wrapper');
            diceElements.forEach(element => {
                if (element && !element.dataset.diceListener) {
                    element.dataset.diceListener = 'true';
                    element.style.cursor = 'pointer';
                    element.addEventListener('click', function(e) {
                        if (e.target.tagName !== 'BUTTON') {
                            e.preventDefault();
                            if (typeof window.rollDice === 'function') { window.rollDice(); }
                            else if (typeof handleRollDice === 'function') { handleRollDice(); }
                        }
                    });
                    element.addEventListener('touchstart', function(e) {
                        if (e.target.tagName !== 'BUTTON') {
                            if (typeof window.rollDice === 'function') { window.rollDice(); }
                            else if (typeof handleRollDice === 'function') { handleRollDice(); }
                        }
                    }, { passive: true });
                }
            });
        }
        window.setupDiceClickListeners = setupDiceClickListeners;

        // Phát hiện câu hỏi Đúng/Sai
        // Phát hiện câu hỏi Đúng/Sai
        function isTrueFalseQuestion(q) {
            if (!q) return false;
            if (q.type === 'truefalse') return true;
            if (typeof q.q === 'string' && q.q.startsWith('ĐÚNG HAY SAI:')) return true;
            if (Array.isArray(q.options) && q.options.length === 2) {
                const o0 = String(q.options[0] || '').toLowerCase();
                const o1 = String(q.options[1] || '').toLowerCase();
                if ((o0.includes('đúng') || o0.includes('sai')) && (o1.includes('đúng') || o1.includes('sai'))) {
                    return true;
                }
            }
            return false;
        }

        // ==========================================
        // 3. BỘ ĐỊNH DẠNG VÀ PHỤC HỒI CHUỖI TOÁN HỌC CHUẨN MIKTEX / TEX LIVE
        // ==========================================
        function formatLudoMathStringToTeX(inputString) {
            if (!inputString || typeof inputString !== 'string') return inputString || '';
            let str = inputString.replace(/[\u000c\x0c]/g, '').trim();
    // Tiêu diệt triệt để mã rác \d\d (formatLudo)
    // Tiêu diệt triệt để mã rác \d\d, \d\frac, \ddfrac đứng trước phân số, khôi phục vĩnh viễn \frac chuẩn
  str = str.replace(/\\+d+\\+d*frac/gi, '\\frac')
           .replace(/\\+d+\\+d*\\+frac/gi, '\\frac')
           .replace(/\\+d+\s*\\+frac/gi, '\\frac')
           .replace(/\\+d+\\+d+(?=\s*\\?frac)/gi, '')
           .replace(/\\d\\d(?=\s*\\?frac)/gi, '')
           .replace(/\\ddfrac/gi, '\\frac')
           .replace(/\\dfrac/gi, '\\frac')
           .replace(/\\d\\frac/gi, '\\frac');

            // 1. Quét sạch và tiêu diệt triệt để ký tự rác \f, \f\f bám trên chuỗi
            str = str.replace(/\\f\\f/g, '').replace(/f\\f/g, '');
            str = str.replace(/(\\+f|f)+(?=\\?frac)/g, '');
            str = str.replace(/(\\+f|f)+(?=\\?\()/g, '');
            str = str.replace(/\\f(?![a-zA-Z])/g, '');
            str = str.replace(/\\f\b/g, '');
            str = str.replace(/[\u0000-\u0008\u000b\u000e-\u001f]/g, '');

            // 2. Phục hồi vĩnh viễn \frac từ rac
            str = str.replace(/(?<![a-zA-Z\\])rac/g, '\\frac')
                     .replace(/\\+rac/g, '\\frac')
                     .replace(/\brac\b/g, '\\frac');
            str = str.replace(/(?<![a-zA-Z\\])frac/g, '\\frac');

            // 3. Tự động sửa lỗi thiếu dấu gạch chéo ngược \ cho các mã lệnh LaTeX chuẩn sư phạm
            str = str.replace(/(?<!\\)cdot/g, '\\cdot');
            str = str.replace(/(?<!\\)sin\b/g, '\\sin');
            str = str.replace(/(?<!\\)cos\b/g, '\\cos');
            str = str.replace(/(?<!\\)tan\b/g, '\\tan');
            str = str.replace(/(?<!\\)cot\b/g, '\\cot');
            str = str.replace(/(?<!\\)sqrt/g, '\\sqrt');
            str = str.replace(/(?<!\\)log\b/g, '\\log');
            str = str.replace(/(?<!\\)ln\b/g, '\\ln');
            str = str.replace(/(?<!\\)lim\b/g, '\\lim');
            str = str.replace(/(?<!\\)to\b/g, '\\to');
            str = str.replace(/(?<!\\)infty/g, '\\infty');
            str = str.replace(/(?<!\\)alpha/g, '\\alpha');
            str = str.replace(/(?<!\\)beta/g, '\\beta');
            str = str.replace(/(?<!\\)gamma/g, '\\gamma');
            str = str.replace(/(?<!\\)Delta/g, '\\Delta');
            str = str.replace(/(?<!\\)circ\b/g, '\\circ');
            str = str.replace(/(?<!\\)pm\b/g, '\\pm');
            str = str.replace(/(?<!\\)ne\b/g, '\\ne');
            str = str.replace(/(?<!\\)forall/g, '\\forall');
            str = str.replace(/(?<!\\)exists/g, '\\exists');

            // 4. Khử hoàn toàn lỗi lặp dấu gạch chéo (double escape) hoặc bọc ngoặc vuông sai quy cách \[...\]
            str = str.replace(/\\\[/g, '').replace(/\\\]/g, '');
            str = str.replace(/\\\\([a-zA-Z])/g, '\\$1');

            // Chuyển đổi $$...$$ và $...$ thành \(...\) chuẩn MathJax
            str = str.replace(/\$\$([\s\S]*?)\$\$/g, (_, m) => '\\(' + m.trim() + '\\)');
            str = str.replace(/\$([^\$]+?)\$/g, (_, m) => '\\(' + m.trim() + '\\)');

            // 5. Xử lý các lệnh TeX độc lập nằm ngoài \(...\)
            const segments = str.split(/(\\\([\s\S]*?\\\))/g);
            for (let i = 0; i < segments.length; i += 2) {
                let seg = segments[i];
                if (!seg) continue;
                
                // Bọc các lệnh phân số \frac{...}{...}
                seg = seg.replace(/\\frac\{[^{}]*\}\{[^{}]*\}/g, (m) => '\\(' + m + '\\)');
                // Bọc các lệnh căn bậc hai
                seg = seg.replace(/\\sqrt(?:\{[^{}]*\}|[0-9a-zA-Z]+)/g, (m) => '\\(' + m + '\\)');
                // Bọc các hàm lượng giác / logarit
                seg = seg.replace(/\\(sin|cos|tan|cot|ln|log|lim|cdot|infty|alpha|beta|gamma|Delta|circ|pm|ne|forall|exists)\b[^{}\(\)\s]*/g, (m) => '\\(' + m + '\\)');

                segments[i] = seg;
            }
            str = segments.join('');

            // Khử lồng ngoặc \( \( ... \) \)
            str = str.replace(/\\\(\s*\\\(([\s\S]*?)\\\)\s*\\\)/g, '\\($1\\)');
            str = str.replace(/\\\(\s*\\\(([\s\S]*?)\\\)\s*\)/g, '\\($1\\)');

            // 6. Nếu toàn bộ là biểu thức thuần toán học (không chứa tiếng Việt) mà chưa có \(...\)
            const hasVietnamese = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđĐ]/i.test(str);
            if (!hasVietnamese && !str.includes('\\(') && /[=+\-*/^_{}]/.test(str)) {
                str = '\\(' + str + '\\)';
            }

            return str;
        }

        // Hàm Typeset MathJax & KaTeX đồng bộ toàn diện
        function typesetMath(elements) {
            try {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    const targets = (elements && elements.length > 0) ? elements : [document.body];
                    if (window.MathJax.typesetClear) {
                        try { window.MathJax.typesetClear(targets); } catch(e) {}
                    }
                    window.MathJax.typesetPromise(targets).catch(() => {});
                }
            } catch(e) {}
            try {
                if (window.renderMathInElement) {
                    const targets = (elements && elements.length > 0) ? elements : [document.body];
                    targets.forEach(el => {
                        if (el) {
                            window.renderMathInElement(el, {
                                delimiters: [
                                    { left: "$$", right: "$$", display: true },
                                    { left: "$", right: "$", display: false },
                                    { left: "\\(", right: "\\)", display: false },
                                    { left: "\\[", right: "\\]", display: true }
                                ],
                                throwOnError: false
                            });
                        }
                    });
                }
            } catch(e) {}
        }

        function showToast(title, desc, colorClass) {

        async function rollDice() {
            if (state.phase !== 'playing') return;
            state.phase = 'rolling';
            updateUI();
            SFX.dice();

            let rolls = 0;
            const int = setInterval(() => {
                state.dice = [Math.floor(Math.random()*6)+1];
                updateUI();
                if (++rolls > 10) {
                    clearInterval(int);
                    setTimeout(() => {
                        state.activeQuestion = QUESTION_BANK[Math.floor(Math.random() * QUESTION_BANK.length)];
                        state.phase = 'question';
                        updateUI();
                    }, 500);
                }
            }, 60);
        }

        async function answerQuestion(idx) {
            state.selectedOpt = idx;
            state.phase = 'show_answer';
            const isCorrect = idx === state.activeQuestion.correct;
            
            if (isCorrect) SFX.correct(); else SFX.wrong();
            updateUI();

            await delay(3000); 
            
            if (isCorrect) {
                calculateValidMoves();
                if (state.validMoves.length > 0) {
                    const currentPlayerId = state.players[state.turn].id;
                    const uniquePositions = new Set(state.validMoves.map(idx => state.tokens[currentPlayerId][idx]));
                    
                    if (state.validMoves.length === 1 || uniquePositions.size === 1) {
                        state.phase = 'select_token';
                        updateUI();
                        setTimeout(() => handleTokenClick(currentPlayerId, state.validMoves[0]), 500);
                    } else {
                        state.phase = 'select_token';
                        showToast("CHỌN NGỰA", "Bạn có nhiều lựa chọn. Hãy bấm chọn một con ngựa để đi!", "text-green-400");
                        updateUI();
                    }
                } else {
                    showToast("KHÔNG THỂ ĐI", "Tất cả ngựa đã yên vị trong chuồng an toàn!", "text-yellow-400");
                    state.phase = 'playing';
                    nextTurn();
                    updateUI();
                }
            } else {
                state.phase = 'playing';
                nextTurn();
                updateUI();
            }
        }

        function calculateValidMoves() {
            state.validMoves = [];
            const color = state.players[state.turn].id;
            
            state.tokens[color].forEach((pos, idx) => {
                if (pos === -1) {
                    // LUẬT: XUẤT CHUỒNG TUỲ Ý VỚI MỌI SỐ XÚC XẮC
                    state.validMoves.push(idx);
                } else if (pos >= 0 && pos < 51) { 
                    // NGỰA ĐANG ĐI VÒNG NGOÀI (51 bước) -> CHẮC CHẮN CÓ THỂ ĐI
                    state.validMoves.push(idx);
                }
                // Nếu ngựa đã vào Đích (pos >= 100), sẽ KHÔNG CÒN ĐƯỢC CHỌN NỮA.
            });
        }

        window.handleTokenClick = async (colorId, tokenIdx) => {
            if (state.phase !== 'select_token' || state.players[state.turn].id !== colorId) return;
            if (!state.validMoves.includes(tokenIdx)) return;

            state.phase = 'moving';
            updateUI(); 
            
            const color = colorId;
            const sum = state.dice[0];
            let currentPos = state.tokens[color][tokenIdx];
            let steps = sum;

            // XỬ LÝ XUẤT CHUỒNG
            if (currentPos === -1) {
                state.tokens[color][tokenIdx] = 0;
                state.players[state.turn].score++; 
                SFX.move();
                updateTokensDOM();
                updateUI();
                await delay(300);
                steps--; // Trừ 1 bước cho hành động nhấc ngựa ra cửa chuồng
            }

            // DI CHUYỂN TỪNG BƯỚC
            for (let i = 0; i < steps; i++) {
                let p = state.tokens[color][tokenIdx];
                
                if (p >= 0 && p < 51) {
                    // Ngựa đi trên đường chính 52 ô
                    state.tokens[color][tokenIdx]++;
                    state.players[state.turn].score++; 
                    SFX.move();
                    updateTokensDOM();
                    updateUI(); 
                    await delay(250);

                    // ==========================================
                    // LUẬT "BULLDOZER" - QUÉT SẠCH KẺ THÙ TRÊN ĐƯỜNG
                    // ==========================================
                    let currentStepPos = state.tokens[color][tokenIdx];
                    const absPos = (currentStepPos + state.players[state.turn].offset) % 52;
                    let kickedSomeone = false;
                    
                    COLORS.forEach(c => {
                        if (c.id === color) return; // Không đá chính mình
                        state.tokens[c.id].forEach((oppPos, oppIdx) => {
                            if (oppPos >= 0 && oppPos <= 50) { 
                                if ((oppPos + c.offset) % 52 === absPos) {
                                    state.tokens[c.id][oppIdx] = -1; // Đá văng
                                    const targetPlayer = state.players.find(pl => pl.id === c.id);
                                    targetPlayer.score = Math.max(0, targetPlayer.score - (oppPos + 1));
                                    SFX.capture();
                                    showToast("BỊ ĐÁ VĂNG!!", `Ngựa của <b class="uppercase">${c.name}</b> đã bị đá văng về chuồng!`, 'text-red-500');
                                    updateTokensDOM();
                                    updateUI();
                                    kickedSomeone = true;
                                }
                            }
                        });
                    });
                    
                    if (kickedSomeone) await delay(600);

                } 
                
                // KIỂM TRA LUẬT VỀ ĐÍCH
                // Khi ngựa hoàn tất vòng chạy (Đạt đủ 51 bước ở vòng ngoài)
                if (state.tokens[color][tokenIdx] === 51) {
                    // Đếm xem đã có bao nhiêu ngựa của đội này yên vị trong chuồng an toàn
                    let finishedCount = state.tokens[color].filter(pos => pos >= 100).length;
                    
                    // Ngựa tự động trượt vào slot trống kế tiếp (100 -> Slot số 1, 101 -> Slot số 2...)
                    state.tokens[color][tokenIdx] = 100 + finishedCount; 
                    
                    state.players[state.turn].score += 50; 
                    SFX.correct();
                    updateTokensDOM();
                    updateUI();
                    showToast("VỀ ĐÍCH!", `Ngựa đã đỗ an toàn ở Ô SỐ ${finishedCount + 1}!`, "text-yellow-400");
                    await delay(500);
                    break; // Ngựa đã yên vị, huỷ bỏ toàn bộ số bước xúc xắc còn thừa!
                }
            }

            await delay(500);
            
            // Kiểm tra chiến thắng (4 ngựa vô chuồng)
            const isWin = state.tokens[color].every(p => p >= 100);
            if (isWin) {
                state.players[state.turn].score += 100;
                showToast("CHIẾN THẮNG!", `${state.players[state.turn].name} ĐÃ ĐƯA ĐỦ 4 NGỰA VỀ ĐÍCH!`, "text-yellow-400");
                setTimeout(() => endGame(), 3000);
                return;
            }

            state.phase = 'playing';
            nextTurn();
            updateUI();
        }

        function nextTurn() {
            state.turn = (state.turn + 1) % 4;
        }

                    <div class="z-10 w-full max-w-2xl bg-slate-900/80 backdrop-blur-2xl border border-white/10 rounded-[3rem] p-8 shadow-2xl text-center">
                        <div class="flex justify-center mb-4">
                            <svg class="w-24 h-24 text-yellow-400 drop-shadow-[0_0_30px_rgba(250,204,21,0.8)] animate-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
                        </div>
                        <h1 class="text-4xl font-black mb-2 uppercase text-white">Vinh Danh Kỳ Thủ</h1>
                        <p class="text-slate-400 mb-8">Cuộc đua Đạo Hàm đã chính thức khép lại!</p>
                        <div class="space-y-4 mb-10">${rankHTML}</div>
                        <button onclick="window.location.reload()" class="w-full py-4 bg-slate-800 hover:bg-slate-700 rounded-2xl font-black text-lg flex items-center justify-center gap-2 transition-transform hover:scale-105 active:scale-95 border border-white/10">
                            CHƠI LẠI TỪ ĐẦU
                        </button>
                    </div>
                </div>
            `;
            SFX.win();
        }

        window.startGame = () => { 
            document.body.classList.remove('in-setup'); 
            if (appEl) appEl.classList.remove('in-setup'); 
            state.phase = 'playing'; 
            initDOM(); 
        };
        window.endGame = () => { 
            document.body.classList.remove('in-setup'); 
            if (appEl) appEl.classList.remove('in-setup'); 
            state.phase = 'finished'; 
            initDOM(); 
        };
        window.openTopicMenu = () => { 
            state.phase = 'setup'; 
            initDOM(); 
        };

        // Mồi sẵn SafeMode Init
        try { initDOM(); } catch(err) { console.error(err); }
    </script>
<script src="/game-engine.js"></script>

<script>
    // ==========================================
    // LOGIC HỘP CÔNG CỤ QUẢN TRỊ IN-GAME (IN-GAME EDITOR)
    // ==========================================
    let editorFilterMode = 'all'; // 'all' | 'abcd' | 'truefalse'

    // 1. ĐIỀU KHIỂN MODAL XÁC THỰC MÃ PIN 2806
    function openAdminPinPrompt() {
        const modal = document.getElementById('pin-prompt-modal');
        const input = document.getElementById('admin-pin-input');
        const err = document.getElementById('pin-error-msg');
        if (modal) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
        if (err) err.classList.add('hidden');
        if (input) {
            input.value = '';
            setTimeout(() => input.focus(), 100);
        }
    }
    window.openAdminPinPrompt = openAdminPinPrompt;

    function closeAdminPinPrompt() {
        const modal = document.getElementById('pin-prompt-modal');
        if (modal) {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    }
    window.closeAdminPinPrompt = closeAdminPinPrompt;

    function handlePinFormSubmit(e) {
        if (e) e.preventDefault();
        const input = document.getElementById('admin-pin-input');
        const err = document.getElementById('pin-error-msg');
        if (!input) return;
        const val = input.value.trim();
        if (val === '2806') {
            if (err) err.classList.add('hidden');
            closeAdminPinPrompt();
            openAdminEditorModal();
        } else {
            if (err) err.classList.remove('hidden');
            input.value = '';
            input.focus();
        }
    }

    // 2. ĐIỀU KHIỂN HỘP SỬA ĐỀ IN-GAME
    function openAdminEditorModal() {
        const modal = document.getElementById('admin-editor-modal');
        if (modal) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            renderAdminEditor();
        }
    }
    window.openAdminEditorModal = openAdminEditorModal;

    function closeAdminEditorModal() {
        const modal = document.getElementById('admin-editor-modal');
        if (modal) {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    }
    window.closeAdminEditorModal = closeAdminEditorModal;
    window.toggleAdminModal = function() {
        const modal = document.getElementById('admin-editor-modal');
        if (modal && !modal.classList.contains('hidden')) {
            closeAdminEditorModal();
        } else {
            openAdminPinPrompt();
        }
    };

    function setEditorFilter(mode) {
        editorFilterMode = mode;
        const btnAll = document.getElementById('tab-btn-all');
        const btnAbcd = document.getElementById('tab-btn-abcd');
        const btnTf = document.getElementById('tab-btn-tf');

        const activeCls = 'bg-blue-600 text-white shadow';
        const inactiveCls = 'text-slate-400 hover:text-white';

        [btnAll, btnAbcd, btnTf].forEach(btn => {
            if (btn) btn.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all ' + inactiveCls;
        });

        if (mode === 'all' && btnAll) btnAll.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all ' + activeCls;
        if (mode === 'abcd' && btnAbcd) btnAbcd.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all ' + activeCls;
        if (mode === 'truefalse' && btnTf) btnTf.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all ' + activeCls;

        renderAdminEditor();
    }

    function isTF(q) {
        if (!q) return false;
        if (q.type === 'truefalse') return true;
        if (typeof q.q === 'string' && q.q.startsWith('ĐÚNG HAY SAI:')) return true;
        if (Array.isArray(q.options) && q.options.length === 2) {
            const o0 = String(q.options[0] || '').toLowerCase();
            const o1 = String(q.options[1] || '').toLowerCase();
            if ((o0.includes('đúng') || o0.includes('sai')) && (o1.includes('đúng') || o1.includes('sai'))) return true;
        }
        return false;
    }

    // 3. RENDER DANH SÁCH CÂU HỎI TRONG EDITOR
    function renderAdminEditor() {
        const container = document.getElementById('editor-questions-list');
        if (!container) return;
        container.innerHTML = '';

        if (!window.quizData) window.quizData = [];

        // Đếm số lượng
        let countAbcd = 0;
        let countTf = 0;
        window.quizData.forEach(q => {
            if (isTF(q)) countTf++;
            else countAbcd++;
        });

        const cntAll = document.getElementById('count-all');
        const cntAbcd = document.getElementById('count-abcd');
        const cntTf = document.getElementById('count-tf');
        if (cntAll) cntAll.textContent = window.quizData.length;
        if (cntAbcd) cntAbcd.textContent = countAbcd;
        if (cntTf) cntTf.textContent = countTf;

        if (window.quizData.length === 0) {
            container.innerHTML = `
                <div class="text-center py-16 text-slate-500">
                    <p class="text-4xl mb-3">📭</p>
                    <p class="text-base font-bold">Chưa có câu hỏi nào trong ngân hàng đề!</p>
                    <p class="text-xs">Bấm "+ Thêm ABCD" hoặc "+ Thêm Đúng/Sai" để bắt đầu soạn đề.</p>
                </div>
            `;
            return;
        }

        window.quizData.forEach((q, index) => {
            const questionIsTF = isTF(q);
            if (editorFilterMode === 'abcd' && questionIsTF) return;
            if (editorFilterMode === 'truefalse' && !questionIsTF) return;

            const card = document.createElement('div');
            card.className = 'p-4 sm:p-5 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-4 transition-all hover:border-slate-600 shadow-md';

            // Tiêu đề card & Độ khó & Xóa
            const diffVal = q.difficulty || 1;
            const typeBadge = questionIsTF 
                ? '<span class="px-2.5 py-1 rounded-md text-[11px] font-black bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 uppercase">Đúng / Sai (4 ý)</span>'
                : '<span class="px-2.5 py-1 rounded-md text-[11px] font-black bg-amber-500/20 text-amber-400 border border-amber-500/30 uppercase">Trắc Nghiệm ABCD</span>';

            let optionsHtml = '';
            if (questionIsTF) {
                // Nhánh Đúng / Sai
                const isDung = q.correct === 0;
                const isSai = q.correct === 1;
                optionsHtml = `
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Đáp án chính xác:</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all ${isDung ? 'bg-green-500/20 border-green-500 text-green-400' : 'bg-slate-900/60 border-slate-700 text-slate-400 hover:border-slate-500'}">
                                <input type="radio" name="tf_ans_${index}" value="0" ${isDung ? 'checked' : ''} onchange="updateQuestionField(${index}, 'correct', 0)" class="w-4 h-4 text-green-500 focus:ring-0">
                                <span class="font-bold text-sm">✅ ĐÚNG</span>
                            </label>
                            <label class="flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all ${isSai ? 'bg-red-500/20 border-red-500 text-red-400' : 'bg-slate-900/60 border-slate-700 text-slate-400 hover:border-slate-500'}">
                                <input type="radio" name="tf_ans_${index}" value="1" ${isSai ? 'checked' : ''} onchange="updateQuestionField(${index}, 'correct', 1)" class="w-4 h-4 text-red-500 focus:ring-0">
                                <span class="font-bold text-sm">❌ SAI</span>
                            </label>
                        </div>
                    </div>
                `;
            } else {
                // Nhánh ABCD
                const opts = Array.isArray(q.options) && q.options.length > 0 ? q.options : ['A', 'B', 'C', 'D'];
                const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
                const optsList = opts.map((opt, optIdx) => {
                    const isCorrect = q.correct === optIdx;
                    return `
                        <div class="flex items-center gap-2">
                            <label title="Đánh dấu đáp án đúng" class="cursor-pointer">
                                <input type="radio" name="mcq_ans_${index}" value="${optIdx}" ${isCorrect ? 'checked' : ''} onchange="updateQuestionField(${index}, 'correct', ${optIdx})" class="w-4 h-4 text-blue-500 focus:ring-0">
                            </label>
                            <span class="w-6 text-center font-black text-sm text-slate-400">${letters[optIdx] || optIdx + 1}.</span>
                            <input type="text" value="${String(opt).replace(/"/g, '&quot;')}" oninput="updateQuestionOption(${index}, ${optIdx}, this.value)" class="flex-1 px-3 py-2 bg-slate-900/70 border ${isCorrect ? 'border-green-500 text-green-300' : 'border-slate-700 text-white'} rounded-xl text-sm outline-none focus:border-blue-500 transition-all" />
                        </div>
                    `;
                }).join('');

                optionsHtml = `
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Các lựa chọn đáp án (Chọn chấm tròn để xác định đáp án đúng):</label>
                        <div class="space-y-2">${optsList}</div>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-700/60 pb-3">
                    <div class="flex items-center gap-2">
                        <span class="font-black text-base text-white">Câu ${index + 1}</span>
                        ${typeBadge}
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-1.5">
                            <span class="text-xs text-slate-400">Độ khó:</span>
                            <select onchange="updateQuestionField(${index}, 'difficulty', parseInt(this.value))" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs font-bold text-slate-200 outline-none focus:border-blue-500">
                                <option value="1" ${diffVal === 1 ? 'selected' : ''}>Dễ</option>
                                <option value="2" ${diffVal === 2 ? 'selected' : ''}>Vừa</option>
                                <option value="3" ${diffVal === 3 ? 'selected' : ''}>Khó</option>
                            </select>
                        </div>
                        <button type="button" onclick="deleteQuestion(${index})" class="px-2.5 py-1 bg-red-500/20 hover:bg-red-500/40 text-red-400 rounded-lg text-xs font-bold transition-all cursor-pointer">
                            🗑️ Xóa
                        </button>
                    </div>
                </div>

                <!-- NỘI DUNG ĐỀ BÀI -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Nội dung câu hỏi (Hỗ trợ TeX &lt;img&gt;):</label>
                    <textarea oninput="updateQuestionField(${index}, 'q', this.value)" rows="3" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 focus:border-blue-500 rounded-xl text-sm text-white outline-none transition-all">${q.q || ''}</textarea>
                </div>

                <!-- LINK HÌNH ẢNH MINH HỌA -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Link ảnh minh họa (&lt;img src="..."&gt;):</label>
                        <input type="text" value="${(q.imageUrl || '').replace(/"/g, '&quot;')}" oninput="updateQuestionField(${index}, 'imageUrl', this.value)" class="w-full px-3 py-2 bg-slate-900/70 border border-slate-700 focus:border-blue-500 rounded-xl text-xs text-white outline-none transition-all" />
                    </div>
                    ${q.imageUrl ? `<div class="text-center"><img src="${q.imageUrl}" class="h-16 rounded-lg border border-slate-700 object-contain mx-auto" alt="Preview" /></div>` : ''}
                </div>

                <!-- PHẦN ĐÁP ÁN -->
                ${optionsHtml}

                <!-- GIẢI THÍCH CHI TIẾT -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Lời giải / Giải thích chi tiết:</label>
                    <input type="text" value="${(q.explanation || '').replace(/"/g, '&quot;')}" oninput="updateQuestionField(${index}, 'explanation', this.value)" class="w-full px-3 py-2 bg-slate-900/70 border border-slate-700 focus:border-blue-500 rounded-xl text-xs text-slate-200 outline-none transition-all" />
                </div>
            `;

            container.appendChild(card);
        });

        // GIẢI PHÓNG TOÀN BỘ PHÍM PREVENTDEFAULT CHO CÁC INPUT VÀ TEXTAREA
        isolateEditorInputs();

        // Render MathJax nếu có
        try {
            if (typeof typesetMath === 'function') {
                typesetMath([container]);
            }
        } catch(e) {}
    }

    // 4. GIẢI PHÓNG PREVENTDEFAULT & CHỐNG LIỆT PHÍM TELEX
    function isolateEditorInputs() {
        const modal = document.getElementById('admin-editor-modal');
        if (!modal) return;
        const inputs = modal.querySelectorAll('input, textarea, select');
        inputs.forEach(el => {
            ['keydown', 'keyup', 'keypress'].forEach(evtType => {
                el.addEventListener(evtType, function(e) {
                    e.stopPropagation(); // Giải phóng hoàn toàn event, ngăn chặn game nuốt phím
                }, { passive: false });
            });
        });
    }

    // 5. CẬP NHẬT DỮ LIỆU CÂU HỎI
    function updateQuestionField(qIndex, field, value) {
        if (!window.quizData[qIndex]) return;
        window.quizData[qIndex][field] = value;
    }

    function updateQuestionOption(qIndex, optIndex, value) {
        if (!window.quizData[qIndex]) return;
        if (!Array.isArray(window.quizData[qIndex].options)) {
            window.quizData[qIndex].options = ['A', 'B', 'C', 'D'];
        }
        window.quizData[qIndex].options[optIndex] = value;
    }

    function deleteQuestion(qIndex) {
        if (confirm(`Bạn có chắc chắn muốn xóa Câu ${qIndex + 1}?`)) {
            window.quizData.splice(qIndex, 1);
            renderAdminEditor();
        }
    }

    function addNewQuestion(type) {
        if (!window.quizData) window.quizData = [];
        if (type === 'truefalse') {
            window.quizData.push({
                q: "ĐÚNG HAY SAI: Phát biểu toán học mới...",
                options: ["Đúng", "Sai"],
                correct: 0,
                explanation: "Lời giải chi tiết cho phát biểu.",
                difficulty: 1,
                type: 'truefalse',
                imageUrl: ''
            });
        } else {
            window.quizData.push({
                q: "Nội dung câu hỏi trắc nghiệm mới?",
                options: ["Phương án A", "Phương án B", "Phương án C", "Phương án D"],
                correct: 0,
                explanation: "Giải thích đáp án trắc nghiệm.",
                difficulty: 1,
                type: 'abcd',
                imageUrl: ''
            });
        }
        renderAdminEditor();
        // Cuộn xuống dưới cùng
        setTimeout(() => {
            const list = document.getElementById('editor-questions-list');
            if (list) list.scrollTop = list.scrollHeight;
        }, 100);
    }

    // 6. LƯU THAY ĐỔI VÀO LOCALSTORAGE & ĐỒNG BỘ FILE VẬT LÝ GỐC
    function saveEditorQuestions() {
        try {
            localStorage.setItem('ca-ngua-dao-ham11_quiz', JSON.stringify(window.quizData));
            if (typeof QUESTION_BANK !== 'undefined') {
                QUESTION_BANK = window.quizData;
            }

            // Gọi API backend ghi đè file HTML vật lý trên máy chủ
            try {
                fetch('/api/games/sync-html', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fileUrl: window.location.pathname || '/ca-ngua-dao-ham11.html',
                        quizData: window.quizData
                    })
                }).then(function(res) { return res.json(); }).then(function(data) {
                    console.log('Physical file sync status:', data);
                }).catch(function(e) {
                    console.warn('Physical sync offline fallback:', e);
                });
            } catch(e) {}

            if (typeof showToast === 'function') {
                showToast("LƯU THÀNH CÔNG!", "Dữ liệu câu hỏi đã được lưu và đồng bộ vào file HTML vật lý.", "text-emerald-400");
            } else {
                alert("Đã lưu thành công! Dữ liệu mới đã được cập nhật.");
            }
            closeAdminEditorModal();
        } catch(err) {
            alert("Lỗi khi lưu dữ liệu: " + err.message);
        }
    }

    // 7. XUẤT FILE HTML MỚI VĨNH VIỄN
    function exportNewHtmlFile() {
        try {
            let htmlCopy = document.documentElement.outerHTML;
            const newDataStr = JSON.stringify(window.quizData, null, 2);

            // Thay thế mảng window.quizData trong file HTML nguồn
            const quizRegex = /window\.quizData\s*=\s*(\(\[[\s\S]*?\]\)\.map\([^)]*\)|\[[\s\S]*?\]);?/;
            if (quizRegex.test(htmlCopy)) {
                htmlCopy = htmlCopy.replace(quizRegex, "window.quizData = " + newDataStr + ";");
            } else {
                const legacyRegex = /\/\/ \[GIAI ĐOẠN 2: CHUẨN HÓA DỮ LIỆU\][\s\S]*?window\.quizData = .*?;/s;
                if (legacyRegex.test(htmlCopy)) {
                    htmlCopy = htmlCopy.replace(legacyRegex, "// [GIAI ĐOẠN 2: CHUẨN HÓA DỮ LIỆU]\nwindow.quizData = " + newDataStr + ";");
                }
            }

            const blob = new Blob(["<!DOCTYPE html>\n" + htmlCopy], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ca-ngua-dao-ham11_custom.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            if (typeof showToast === 'function') {
                showToast("XUẤT FILE THÀNH CÔNG!", "File HTML sạch đã được tải về máy của bạn.", "text-emerald-400");
            } else {
                alert("Đã xuất file HTML thành công!");
            }
        } catch(err) {
            alert("Lỗi khi xuất file HTML: " + err.message);
        }
    }

    // 8. ĐỒNG BỘ BẢO MẬT ADMIN & CẶP NÚT TOPBAR (?role=admin)
    function applyAdminSecurity() {
        try {
            const params = new URLSearchParams(window.location.search);
            const isAdmin = params.get('role') === 'admin' || 
                            params.get('preview') === 'true' || 
                            params.get('admin') === '1' ||
                            window.location.hash.includes('admin');
            const adminTopbar = document.getElementById('admin-topbar');
            const adminControls = document.getElementById('admin-controls');
            const adminBtns = document.querySelectorAll('#btn-admin-gear, #btn-chuyen-de, [data-admin-control="true"]');
            if (isAdmin) {
                if (adminTopbar) {
                    adminTopbar.style.setProperty('display', 'flex', 'important');
                    adminTopbar.classList.remove('hidden');
                }
                if (adminControls) adminControls.style.setProperty('display', 'flex', 'important');
                adminBtns.forEach(btn => {
                    btn.classList.remove('hidden');
                    btn.style.setProperty('display', 'inline-flex', 'important');
                });
            } else {
                if (adminTopbar) {
                    adminTopbar.style.setProperty('display', 'none', 'important');
                    adminTopbar.classList.add('hidden');
                }
                if (adminControls) adminControls.style.setProperty('display', 'none', 'important');
                adminBtns.forEach(btn => {
                    btn.classList.add('hidden');
                    btn.style.setProperty('display', 'none', 'important');
                });
            }
        } catch(e) {}
    }
    window.applyAdminSecurity = applyAdminSecurity;

    // 9. GẮN SỰ KIỆN CLICK & TOUCH VÀO NÚT MÀU XANH "⚙️ SỬA DỮ LIỆU"
    function setupAdminGearListeners() {
        const btnGear = document.getElementById('btn-admin-gear');
        if (btnGear && !btnGear.dataset.listenerAttached) {
            btnGear.dataset.listenerAttached = 'true';
            const handleGear = function(e) {
                e.preventDefault();
                e.stopPropagation();
                openAdminPinPrompt();
            };
            btnGear.addEventListener('click', handleGear);
            btnGear.addEventListener('touchend', handleGear);
        }

        // Bắt mọi sự kiện nhấn phím trên PIN prompt modal để giải phóng và hỗ trợ Enter
        const pinModal = document.getElementById('pin-prompt-modal');
        if (pinModal) {
            ['keydown', 'keyup', 'keypress'].forEach(evtType => {
                pinModal.addEventListener(evtType, function(e) {
                    e.stopPropagation();
                }, { passive: false });
            });
        }

        const editorModal = document.getElementById('admin-editor-modal');
        if (editorModal) {
            ['keydown', 'keyup', 'keypress'].forEach(evtType => {
                editorModal.addEventListener(evtType, function(e) {
                    e.stopPropagation();
                }, { passive: false });
            });
        }
    }

    // Giải phóng hoàn toàn cho input/textarea khi gõ tiếng Việt Telex
    ['keydown', 'keyup', 'keypress'].forEach(evtType => {
        window.addEventListener(evtType, function(e) {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) {
                e.stopPropagation();
            }
        }, true);
    });

    // 10. EVENT DELEGATION DỰ PHÒNG & KHỞI TẠO TỰ ĐỘNG
    document.addEventListener('click', function(e) {
        const target = e.target.closest('#btn-admin-gear') || (e.target.textContent && e.target.textContent.includes('SỬA DỮ LIỆU') ? e.target : null);
        if (target && !target.dataset.delegationHandled) {
            e.preventDefault();
            e.stopPropagation();
            openAdminPinPrompt();
        }
    });

    window.addEventListener('DOMContentLoaded', function() {
        applyAdminSecurity();
        setupAdminGearListeners();

        // Nạp dữ liệu đã lưu từ LocalStorage nếu có
        const saved = localStorage.getItem('ca-ngua-dao-ham11_quiz');
        if (saved) {
            try {
                window.quizData = JSON.parse(saved);
                if (typeof QUESTION_BANK !== 'undefined') {
                    QUESTION_BANK = window.quizData;
                }
            } catch(e) {}
        }
    });

    // Chạy ngay lập tức khi script thực thi
    applyAdminSecurity();
    setupAdminGearListeners();
</script>


<script id="__TEACHER_MATHJAX_CLEANER_AND_SCANNER__">
function formatMathStringToTeX(rawContent) {
    if (typeof rawContent !== 'string') return rawContent;

    let cleanContent = rawContent;
    // Tiêu diệt triệt để mã rác \d\d, \d\frac, \ddfrac đứng trước phân số, khôi phục vĩnh viễn \frac chuẩn
    cleanContent = cleanContent.replace(/\\+d+\\+d*frac/gi, '\\frac')
                               .replace(/\\+d+\\+d*\\+frac/gi, '\\frac')
                               .replace(/\\+d+\s*\\+frac/gi, '\\frac')
                               .replace(/\\+d+\\+d+(?=\s*\\?frac)/gi, '')
                               .replace(/\\d\\d(?=\s*\\?frac)/gi, '')
                               .replace(/\\ddfrac/gi, '\\frac')
                               .replace(/\\dfrac/gi, '\\frac')
                               .replace(/\\d\\frac/gi, '\\frac');

    // ÉP BUỘC: Sử dụng chính xác bộ lọc xử lý dữ liệu từ file mẫu của giáo viên để quét sạch lỗi sinh chữ \f thừa đứng trước \frac
    cleanContent = cleanContent.replace(/\\f\\frac/g, '\\frac')
                               .replace(/\\f\s*\\frac/g, '\\frac')
                               .replace(/\\ffrac/g, '\\frac')
                               .replace(/\\f/g, ''); // Khử sạch các ký tự \f cô độc

    // Phục hồi chữ "frac" nếu hệ thống cũ lỡ làm gãy chữ thành "rac"
    cleanContent = cleanContent.replace(/\\+rac\s*\{/g, '\\frac{').replace(/(?<![a-zA-Z\\])rac\s*\{/g, '\\frac{');

    // Tự động chèn khoảng trắng mảnh ngăn dính chữ tiếng Việt (Ví dụ: "0trong", "]là:")
    cleanContent = cleanContent.replace(/(\d+)(trong|đoạn|là|có)/g, '$1 $2');
    var cleanStr = cleanContent;
    cleanStr = cleanStr.replace(/(\))(trong|đoạn|là)/g, '$1 $2');
    cleanContent = cleanStr;
    cleanContent = cleanContent.replace(/\]là\:/g, '\] là:');

    // Khử hoàn toàn lỗi lặp dấu gạch chéo (double escape) bảo vệ các ký hiệu \sqrt, \le, \ge, \ne
    cleanContent = cleanContent.replace(/\\\\/g, '\\');

    return cleanContent;
}
window.formatMathStringToTeX = formatMathStringToTeX;

(function() {
    function applyTex2jaxProcess() {
        var selectors = [
            '.question', '.q-text', '.stem', '#question', '#questionText', '#stem', '#q-text',
            '.option', '.answer-btn', '.btn-abcd', '.opt-btn', '.option-btn', '.answer-option',
            '.card', '.card-func', '.card-prop', '.pair-card', '.tile', '.flip-card',
            '.math-content', '.math-text', '[class*="question"]', '[class*="answer"]', '[class*="option"]', '[class*="card"]'
        ];
        selectors.forEach(function(sel) {
            document.querySelectorAll(sel).forEach(function(el) {
                if (!el.classList.contains('tex2jax_process')) {
                    el.classList.add('tex2jax_process');
                }
            });
        });
        if (document.body && !document.body.classList.contains('tex2jax_process')) {
            document.body.classList.add('tex2jax_process');
        }
    }
    window.applyTex2jaxProcess = applyTex2jaxProcess;

    function triggerMathTypeset() {
        try {
            applyTex2jaxProcess();
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(function() {});
            }
        } catch(e) {}
    }
    window.triggerMathTypeset = triggerMathTypeset;

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            applyTex2jaxProcess();
            triggerMathTypeset();
        });
    } else {
        applyTex2jaxProcess();
        triggerMathTypeset();
    }
    window.addEventListener('load', function() {
        applyTex2jaxProcess();
        triggerMathTypeset();
    });

    try {
        var obs = new MutationObserver(function() {
            applyTex2jaxProcess();
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
    } catch(e) {}
})();
</script>
