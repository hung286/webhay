<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOÁN PRO - LỚP TOÁN THẦY HÙNG</title>
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Teacher MathJax Core Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)'], ['$', '$']],
                displayMath: [['\\[', '\\]'], ['$$', '$$']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://jsdelivr.net"></script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style id="mathjax-no-bounding-box-style">
    /* Triệt tiêu hoàn toàn viền hình chữ nhật gỡ lỗi của MathJax và ép thẳng 1 dòng */
    mjx-container, .mjx-chtml, mjx-math, mjx-mo, .zombie-math-text, .tex2jax_process, .math-content, .math-text, .MathJax, [class*="math-"] {
        outline: none !important;
        border: none !important;
        box-shadow: none !important;
        white-space: nowrap !important;
        display: inline-block !important;
        overflow: visible !important;
    }
    </style>

    <script type="module" crossorigin src="./assets/index-oiUnZkrp.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-cziXsROm.css">
  
<style>
/* TỐI ƯU HÓA HIỂN THỊ VÀ CẢM ỨNG MƯỢT MÀ TRÊN MOBILE (60 FPS & TOUCH OPTIMIZATION) */
button, .btn, input, select, canvas {
    touch-action: manipulation !important;
    -webkit-tap-highlight-color: transparent !important;
}
/* Ép khung chứa game tối ưu diện tích di động & GPU */
.game-container, canvas {
    transform: translate3d(0, 0, 0);
    -webkit-transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
}
</style>

</head>
  <body>
    <div id="root"></div>
  </body>
</html>
