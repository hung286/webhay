<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Toán 11 - Game Pikachu Nối Hình Đạo Hàm | TOÁN PRO - THẦY HÙNG</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- TILE CỔ ĐIỂN - Ô VUÔNG TỐI ĐA DIỆN TÍCH --- */
        .game-tile {
            container-type: inline-size; 
            background: #0f1423; /* Nền xanh đen cực sâu để tôn chữ */
            border: 1px solid rgba(255,255,255,0.15);
            border-bottom: 3px solid rgba(255,255,255,0.25);
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .game-tile:hover {
            background: #1a2035;
            border-color: var(--theme-color);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.6), inset 0 0 15px rgba(255,255,255,0.05);
        }
        
        .game-tile.selected {
            background: #1a2035;
            border-color: #ffffff;
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 0 30px var(--theme-color);
            z-index: 40 !important;
        }

        /* --- CON VẬT KHUNG RỖNG (Dark Mode) --- */
        .animal-glass {
            color: transparent; 
            -webkit-text-stroke: 1.5px var(--theme-color); 
            filter: drop-shadow(0 0 6px var(--theme-color));
            font-size: 85cqmin; /* Kích thước tối ưu không chạm mép */
            opacity: 0.55; 
            transition: all 0.3s ease;
        }

        .game-tile:hover .animal-glass {
            opacity: 0.8;
            filter: drop-shadow(0 0 12px var(--theme-color));
            transform: scale(1.05);
        }

        .game-tile.selected .animal-glass {
            opacity: 1;
            filter: drop-shadow(0 0 20px var(--theme-color));
            transform: scale(1.1);
        }

        /* --- CÔNG THỨC TOÁN (VIỀN ĐEN TUYỆT ĐỐI KHÔNG TRÀN) --- */
        .math-content {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            color: #ffffff;
            font-weight: 800;
            /* Viền đen 4 góc cực dày giúp chữ trắng nổi bật tuyệt đối trên mọi nền */
            filter: 
                drop-shadow(1.5px 1.5px 0px #000) 
                drop-shadow(-1.5px -1.5px 0px #000) 
                drop-shadow(1.5px -1.5px 0px #000) 
                drop-shadow(-1.5px 1.5px 0px #000)
                drop-shadow(0 4px 8px rgba(0,0,0,0.9));
            white-space: nowrap;
        }

        /* --- PATH NEON GLOW --- */
        .neon-glow {
            filter: drop-shadow(0 0 4px #00ffff) drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 15px #00ffff);
        }

        /* --- HIỆU ỨNG RUNG LẮC BÁO LỖI TÍNH TOÁN --- */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
        }
        .shake-error {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ff003c !important;
            box-shadow: 0 0 30px #ff003c, inset 0 0 20px rgba(255,0,60,0.3) !important;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_center,_#1e1e2f,_#000000)] overflow-hidden flex flex-col relative text-white">

    <script>

        const f = (top, bot, pre='') =>

            { id: 1, left: "(C)'", right: "0", icon: "fa-cat", themeColor: THEMES.yellow },
            { id: 2, left: "(xⁿ)'", right: "n.xⁿ⁻¹", icon: "fa-cat", themeColor: THEMES.yellow },
            { id: 3, left: "(√x)'", right: f("1", "2√x"), icon: "fa-cat", themeColor: THEMES.yellow },

            { id: 13, left: "(5)'", right: "0", icon: "fa-cat", themeColor: THEMES.yellow },
            { id: 14, left: "(x³)'", right: "3x²", icon: "fa-cat", themeColor: THEMES.yellow },
            { id: 15, left: "(4√x)'", right: f("2", "√x"), icon: "fa-cat", themeColor: THEMES.yellow },

            { id: 5, left: "(u+v)'", right: "u'+v'", icon: "fa-hippo", themeColor: THEMES.cyan },
            { id: 6, left: "(u-v)'", right: "u'-v'", icon: "fa-hippo", themeColor: THEMES.cyan },
            { id: 7, left: "(u.v)'", right: "u'v+uv'", icon: "fa-hippo", themeColor: THEMES.cyan },

            { id: 22, left: "(3cos x)'", right: "-3sin x", icon: "fa-otter", themeColor: THEMES.pink },

        const LEVEL2_PAIRS = [

            { id: 3, left: "(1/u)'", right: f("u'", "u²", "-"), icon: "fa-dog", themeColor: THEMES.green },

            { id: 16, left: "(e²ˣ)'", right: "2e²ˣ", icon: "fa-dog", themeColor: THEMES.green },

                    { id: 13, left: "((x²+1)/(x))'", right: f("x²-1", "x²"), icon: "fa-dragon", themeColor: THEMES.indigo },
                    { id: 14, left: "((x²-x+1)/(x-1))'", right: f("x²-2x", "(x-1)²"), icon: "fa-dragon", themeColor: THEMES.indigo },
                    { id: 15, left: "(1/(x²+2))'", right: f("2x", "(x²+2)²", "-"), icon: "fa-dragon", themeColor: THEMES.indigo },
                    { id: 16, left: "(x/(x²+1))'", right: f("1-x²", "(x²+1)²"), icon: "fa-dragon", themeColor: THEMES.indigo },
                    
                    { id: 5, left: "(√(2x+3))'", right: f("1", "√(2x+3)"), icon: "fa-spider", themeColor: THEMES.lime },
                    { id: 6, left: "(√(4-x²))'", right: f("x", "√(4-x²)", "-"), icon: "fa-spider", themeColor: THEMES.lime },
                    { id: 7, left: "(x.√x)'", right: f("3√x", "2"), icon: "fa-spider", themeColor: THEMES.lime },
                    { id: 8, left: "(√(x³+1))'", right: f("3x²", "2√(x³+1)"), icon: "fa-spider", themeColor: THEMES.lime },
                    
                    { id: 17, left: "(1/√x)'", right: f("1", "2x√x", "-"), icon: "fa-spider", themeColor: THEMES.lime },
                    { id: 18, left: "(√(x²+4x))'", right: f("x+2", "√(x²+4x)"), icon: "fa-spider", themeColor: THEMES.lime },
                    { id: 19, left: "(x/√(x²+1))'", right: f("1", "(x²+1)√(...)"), icon: "fa-spider", themeColor: THEMES.lime },
                    { id: 20, left: "(√(1-2x))'", right: f("1", "√(1-2x)", "-"), icon: "fa-spider", themeColor: THEMES.lime },
                    
                    { id: 9, left: "(sin²x)'", right: "sin 2x", icon: "fa-crow", themeColor: THEMES.fuchsia },
                    { id: 10, left: "(cos²x)'", right: "-sin 2x", icon: "fa-crow", themeColor: THEMES.fuchsia },
                    { id: 11, left: "(tan²x)'", right: f("2sin x", "cos³x"), icon: "fa-crow", themeColor: THEMES.fuchsia },
                    { id: 12, left: "(sin³x)'", right: "3sin²x.cos x", icon: "fa-crow", themeColor: THEMES.fuchsia },
                    
                    { id: 21, left: "(e^(x²))'", right: "2x.e^(x²)", icon: "fa-crow", themeColor: THEMES.fuchsia },
                    { id: 22, left: "(ln²x)'", right: f("2ln x", "x"), icon: "fa-crow", themeColor: THEMES.fuchsia },
                    { id: 23, left: "(x.e^(-x))'", right: "e^(-x)(1-x)", icon: "fa-crow", themeColor: THEMES.fuchsia },
                    { id: 24, left: "(ln(sin x))'", right: "cot x", icon: "fa-crow", themeColor: THEMES.fuchsia }
                ]
            },
            "Chủ đề 2: Nguyên Hàm & Tích Phân Cơ Bản": {
                1: [
                    { id: 1, left: "∫ 0 dx", right: "C", icon: "fa-cat", themeColor: THEMES.yellow },
                    { id: 2, left: "∫ 1 dx", right: "x + C", icon: "fa-cat", themeColor: THEMES.yellow },
                    { id: 3, left: "∫ x dx", right: f("x²", "2") + "+C", icon: "fa-cat", themeColor: THEMES.yellow },
                    { id: 4, left: "∫ x² dx", right: f("x³", "3") + "+C", icon: "fa-cat", themeColor: THEMES.yellow },

                    { id: 20, left: "∫ (1/2x) dx", right: f("1", "2") + "ln|x|+C", icon: "fa-hippo", themeColor: THEMES.cyan },

        const DEFAULT_LOGO = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

        function findPikachuPath(grid, r1, c1, r2, c2) {
            const checkLine = (rA, cA, rB, cB) => {
                if (rA !== rB && cA !== cB) return false;
                if (rA === rB) {
                    const min = Math.min(cA, cB), max = Math.max(cA, cB);
                    for (let i = min + 1; i < max; i++) if (grid[rA][i] !== null) return false;
                    return true;
                } else {
                    const min = Math.min(rA, rB), max = Math.max(rA, rB);
                    for (let i = min + 1; i < max; i++) if (grid[i][cA] !== null) return false;
                    return true;
                }
            };

            if (checkLine(r1, c1, r2, c2)) return [{ r: r1, c: c1 }, { r: r2, c: c2 }];

            const C1 = { r: r1, c: c2 };
            if (grid[C1.r][C1.c] === null && checkLine(r1, c1, C1.r, C1.c) && checkLine(C1.r, C1.c, r2, c2)) return [{ r: r1, c: c1 }, C1, { r: r2, c: c2 }];
            
            const C2 = { r: r2, c: c1 };
            if (grid[C2.r][C2.c] === null && checkLine(r1, c1, C2.r, C2.c) && checkLine(C2.r, C2.c, r2, c2)) return [{ r: r1, c: c1 }, C2, { r: r2, c: c2 }];

            const getCross = (r, c) => {
                let pts = [];
                for (let i = c - 1; i >= 0; i--) { if (grid[r][i] === null) pts.push({ r, c: i }); else break; }
                for (let i = c + 1; i < COLS; i++) { if (grid[r][i] === null) pts.push({ r, c: i }); else break; }
                for (let i = r - 1; i >= 0; i--) { if (grid[i][c] === null) pts.push({ r: i, c }); else break; }
                for (let i = r + 1; i < ROWS; i++) { if (grid[i][c] === null) pts.push({ r: i, c }); else break; }
                return pts;
            };

            const cross1 = getCross(r1, c1);
            const cross2 = getCross(r2, c2);

            for (let p1 of cross1) {
                for (let p2 of cross2) {
                    if (p1.r === p2.r || p1.c === p2.c) {
                        if (checkLine(p1.r, p1.c, p2.r, p2.c)) return [{ r: r1, c: c1 }, p1, p2, { r: r2, c: c2 }];
                    }
                }
            }
            return null;
        }

        function checkPlayable(currentGrid) {
            let remaining = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (currentGrid[r][c]) remaining.push({ r, c, item: currentGrid[r][c] });
                }
            }
            if (remaining.length === 0) return true;

            for (let i = 0; i < remaining.length; i++) {
                for (let j = i + 1; j < remaining.length; j++) {
                    if (remaining[i].item.matchValue === remaining[j].item.matchValue && remaining[i].item.side !== remaining[j].item.side) {
                        if (findPikachuPath(currentGrid, remaining[i].r, remaining[i].c, remaining[j].r, remaining[j].c)) return true;
                    }
                }
            }
            return false;
        }

        function shuffleBoard(currentGrid) {
            let remaining = [], positions = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (currentGrid[r][c]) {
                        remaining.push(currentGrid[r][c]);
                        positions.push({ r, c });
                    }
                }
            }
            remaining.sort(() => Math.random() - 0.5);
            
            let nextGrid = currentGrid.map(row => [...row]);
            positions.forEach((pos, idx) => {
                nextGrid[pos.r][pos.c] = { ...remaining[idx], r: pos.r, c: pos.c };
            });
            return nextGrid;
        }

        function startGame(level) {
            state.level = level;
            const topicData = window.gameDatabase[window.selectedTopic] || window.gameDatabase[Object.keys(window.gameDatabase)[0]];
            let pairsInfo = topicData[level] || topicData[1] || LEVEL1_PAIRS;
            let items = [], idCounter = 0;

            pairsInfo.forEach(pair => {
                items.push({ uniqueId: idCounter++, pairId: pair.id, side: 'left', display: pair.left, matchValue: pair.right, icon: pair.icon, themeColor: pair.themeColor });
                items.push({ uniqueId: idCounter++, pairId: pair.id, side: 'right', display: pair.right, matchValue: pair.right, icon: pair.icon, themeColor: pair.themeColor });
            });
            items.sort(() => Math.random() - 0.5);

            let newGrid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
            let itemIdx = 0;
            for (let r = 1; r <= PLAY_ROWS; r++) {
                for (let c = 1; c <= PLAY_COLS; c++) {
                    newGrid[r][c] = { ...items[itemIdx++], r, c };
                }
            }

            while (!checkPlayable(newGrid)) newGrid = shuffleBoard(newGrid);

            state.grid = newGrid;
            state.selected = null;
            state.score = 0;
            state.timeLeft = 300;
            state.shufflesLeft = 3;
            state.view = 'playing';
            
            clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                if (state.timeLeft > 0) {
                    state.timeLeft--;
                    renderGameHeader();
                } else {
                    clearInterval(state.timerId);
                    showGameOverModal(false);
                }
            }, 1000);

            renderApp();
        window.openTopicSelectMenu();
        }

        function handleTileClick(r, c) {
            if (state.isAnimating || !state.grid[r][c]) return;

            if (state.selected && state.selected.r === r && state.selected.c === c) {
                state.selected = null;
                renderBoard();
                return;
            }

            if (!state.selected) {
                state.selected = { r, c };
                renderBoard();
                return;
            }

            const r1 = state.selected.r, c1 = state.selected.c;
            const item1 = state.grid[r1][c1];
            const item2 = state.grid[r][c];

            if (item1.matchValue === item2.matchValue && item1.side !== item2.side) {
                const path = findPikachuPath(state.grid, r1, c1, r, c);
                if (path) {
                    state.isAnimating = true;
                    state.selected = { r, c };
                    renderBoard();
                    drawPath(path);

                    setTimeout(() => {
                        state.grid[r1][c1] = null;
                        state.grid[r][c] = null;
                        state.selected = null;
                        state.score += 100;
                        document.getElementById('path-svg').innerHTML = '';
                        
                        let isWin = true;
                        for (let row = 0; row < ROWS; row++) {
                            for (let col = 0; col < COLS; col++) {
                                if (state.grid[row][col] !== null) isWin = false;
                            }
                        }

                        if (isWin) {
                            clearInterval(state.timerId);
                            showGameOverModal(true);
                        } else if (!checkPlayable(state.grid)) {
                            if (state.shufflesLeft > 0) {
                                state.grid = shuffleBoard(state.grid);
                                state.shufflesLeft--;
                                showToast("Hết đường! Đã tự động xáo trộn.");
                            } else {
                                clearInterval(state.timerId);
                                showGameOverModal(false);
                            }
                        }
                        
                        state.isAnimating = false;
                        renderApp();
        window.openTopicSelectMenu();
                    }, 400);
                } else {
                    showToast("Đúng cặp nhưng bị chặn đường mất rồi!");
                    state.selected = null;
                    renderBoard();
                }
            } else {
                if (item1.matchValue === item2.matchValue && item1.side === item2.side) {
                    showToast("Cùng một vế rồi! Chọn 1 Hàm số và 1 Đạo hàm nhé.");
                } else if (item1.icon === item2.icon) {
                    showToast("Sai toán rồi! Đừng để màu sắc đánh lừa nhé 😉");
                }
                
                // Gắn cờ lỗi để render CSS rung lắc đỏ
                state.errorTiles = [{r: r1, c: c1}, {r, c}];
                state.isAnimating = true;
                renderBoard();
                
                // Sau 400ms (thời gian rung xong) thì trả lại trạng thái cũ
                setTimeout(() => {
                    state.errorTiles = null;
                    state.selected = null;
                    state.isAnimating = false;
                    renderBoard();
                }, 400);
            }
        }

        function manualShuffle() {
            if (state.shufflesLeft > 0 && !state.isAnimating) {
                state.grid = shuffleBoard(state.grid);
                state.shufflesLeft--;
                state.selected = null;
                renderApp();
        window.openTopicSelectMenu();
            }
        }

        function renderBoard() {
            const board = document.getElementById('board-container');

            for (let r = 1; r <= PLAY_ROWS; r++) {
                for (let c = 1; c <= PLAY_COLS; c++) {

                    if (item) {
                        const isSelected = state.selected && state.selected.r === r && state.selected.c === c;
                        const isError = state.errorTiles && state.errorTiles.some(t => t.r === r && t.c === c);
                        
                        // Lấp đầy trọn vẹn 100% diện tích hộp đen
                        const leftPos = (c - 1) * 12.5; 
                        const topPos = (r - 1) * 16.666;

                        // AI Lập trình tính độ dài chữ tự động scale không bao giờ tràn
                        const rawText = item.display.replace(/<[^>]*>?/gm, '').trim();
                        // Giới hạn an toàn từ 3 đến vô cực để tỷ lệ chia luôn đẹp
                        const textLen = Math.max(3, rawText.length);
                        // Công thức scale Font-size thần thánh (Vừa khít chiều ngang)
                        const fontSize = `clamp(12px, min(30cqw, ${110 / textLen}cqw), 40px)`;

                        let tileClasses = "w-full h-full cursor-pointer relative flex flex-col items-center justify-center overflow-hidden game-tile";

                        if (isError) tileClasses += " shake-error";

            svg.innerHTML = `

                    <h2 class="text-3xl font-black text-white mb-2">${title}</h2>
                    <p class="text-sm text-slate-400 mb-6 font-medium">${subtitle}</p>
                    
                    <div class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-400 mb-6 drop-shadow-[0_0_15px_rgba(34,211,238,0.4)]">
                        ${state.score} <span class="text-sm text-slate-500 font-bold tracking-widest uppercase">PTS</span>
                    </div>

                    <div class="mb-6 text-left">
                        <label class="block text-xs text-cyan-400 font-bold uppercase mb-2">Lưu tên vào Bảng Xếp Hạng:</label>
                        <input type="text" id="playerName" placeholder="Nhập tên của bạn..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all shadow-inner">
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="handleSaveAndMenu()" class="flex-1 py-3 bg-white/5 border border-white/10 text-white font-bold rounded-xl hover:bg-white/10 transition-colors text-sm">
                            Menu
                        </button>
                        <button onclick="saveScoreData(); closeModal(); window.openTopicSelectMenu();" class="flex-1 py-3 bg-gradient-to-r from-amber-500 to-orange-600 border border-amber-400/50 text-white font-bold rounded-xl hover:scale-105 active:scale-95 transition-all shadow-[0_0_20px_rgba(245,158,11,0.5)] text-sm">
                            Đổi Đề
                        </button>
                        <button onclick="handleSaveAndReplay()" class="flex-1 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 border border-cyan-400/50 text-white font-bold rounded-xl hover:scale-105 active:scale-95 transition-all shadow-[0_0_20px_rgba(8,145,178,0.5)] text-sm">
                            Lại
                        </button>
                    </div>
                </div>
            `;
            modalContainer.classList.remove('hidden');
            
            setTimeout(() => {
                const input = document.getElementById('playerName');
                if(input) input.focus();
            }, 100);
        }

        function saveScoreData() {
            const nameInput = document.getElementById('playerName');
            const name = nameInput && nameInput.value.trim() ? nameInput.value.trim() : "Học sinh ẩn danh";
            if (state.score > 0) {
                state.leaderboard.push({ name, score: state.score, level: state.level });
            }
        }

        function handleSaveAndMenu() { saveScoreData(); closeModal(); goToMenu(); }
        function handleSaveAndReplay() { saveScoreData(); closeModal(); startGame(state.level); }
        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }`;
        document.head.appendChild(style);

        renderApp();
        window.openTopicSelectMenu();
    </script>
<script src="/game-engine.js"></script>
</body>
</html>
