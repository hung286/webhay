<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toán 11. Game Pikachu Đạo Hàm </title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- TILE CỔ ĐIỂN - Ô VUÔNG TỐI ĐA DIỆN TÍCH --- */
        .game-tile {
            container-type: inline-size; 
            background: #0f1423; /* Nền xanh đen cực sâu để tôn chữ */
            border: 1px solid rgba(255,255,255,0.15);
            border-bottom: 3px solid rgba(255,255,255,0.25);
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .game-tile:hover {
            background: #1a2035;
            border-color: var(--theme-color);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.6), inset 0 0 15px rgba(255,255,255,0.05);
        }
        
        .game-tile.selected {
            background: #1a2035;
            border-color: #ffffff;
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 0 30px var(--theme-color);
            z-index: 40 !important;
        }

        /* --- CON VẬT KHUNG RỖNG (Dark Mode) --- */
        .animal-glass {
            color: transparent; 
            -webkit-text-stroke: 1.5px var(--theme-color); 
            filter: drop-shadow(0 0 6px var(--theme-color));
            font-size: 85cqmin; /* Kích thước tối ưu không chạm mép */
            opacity: 0.55; 
            transition: all 0.3s ease;
        }

        .game-tile:hover .animal-glass {
            opacity: 0.8;
            filter: drop-shadow(0 0 12px var(--theme-color));
            transform: scale(1.05);
        }

        .game-tile.selected .animal-glass {
            opacity: 1;
            filter: drop-shadow(0 0 20px var(--theme-color));
            transform: scale(1.1);
        }

        /* --- CÔNG THỨC TOÁN (VIỀN ĐEN TUYỆT ĐỐI KHÔNG TRÀN) --- */
        .math-content {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            color: #ffffff;
            font-weight: 800;
            /* Viền đen 4 góc cực dày giúp chữ trắng nổi bật tuyệt đối trên mọi nền */
            filter: 
                drop-shadow(1.5px 1.5px 0px #000) 
                drop-shadow(-1.5px -1.5px 0px #000) 
                drop-shadow(1.5px -1.5px 0px #000) 
                drop-shadow(-1.5px 1.5px 0px #000)
                drop-shadow(0 4px 8px rgba(0,0,0,0.9));
            white-space: nowrap;
        }

        /* --- PATH NEON GLOW --- */
        .neon-glow {
            filter: drop-shadow(0 0 4px #00ffff) drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 15px #00ffff);
        }

        /* --- HIỆU ỨNG RUNG LẮC BÁO LỖI TÍNH TOÁN --- */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
        }
        .shake-error {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ff003c !important;
            box-shadow: 0 0 30px #ff003c, inset 0 0 20px rgba(255,0,60,0.3) !important;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_center,_#1e1e2f,_#000000)] overflow-hidden flex flex-col relative text-white">

    <!-- Ánh sáng nền -->
    <div class="absolute top-[-20%] left-[-10%] w-[40rem] h-[40rem] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[40rem] h-[40rem] bg-teal-600/20 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <div id="app" class="w-full h-full flex-1 flex flex-col items-center justify-start pt-4 sm:pt-6 relative z-10 p-2 sm:p-4"></div>

    <div id="modal-container" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden"></div>

    <script>
        const THEMES = {
            pink: "#ff2a6d", blue: "#05d9e8", green: "#01ffc3", orange: "#ff7b00",
            purple: "#b300ff", teal: "#00ffcc", red: "#ff003c", yellow: "#ffe600",
            indigo: "#6a00ff", lime: "#bfff00", cyan: "#00b8ff", fuchsia: "#ff00a0"
        };

        const f = (top, bot, pre='') => 
            `<span class="inline-flex items-center align-middle mx-[0.1em] text-[0.9em]">
                ${pre ? `<span class="mr-[0.1em]">${pre}</span>` : ''}
                <span class="flex flex-col items-center justify-center leading-[1.1]">
                    <span class="border-b-[0.12em] border-white pb-[0.05em] px-[0.1em] text-center w-full min-w-[0.5em]">${top}</span>
                    <span class="pt-[0.05em] px-[0.1em] text-center w-full min-w-[0.5em]">${bot}</span>
                </span>
            </span>`;

        const LEVEL1_PAIRS = [
            { id: 1, left: "(C)'", right: "0", icon: "fa-cat", themeColor: THEMES.yellow },
            { id: 2, left: "(xⁿ)'", right: "n.xⁿ⁻¹", icon: "fa-cat", themeColor: THEMES.yellow },
            { id: 3, left: "(√x)'", right: f("1", "2√x"), icon: "fa-cat", themeColor: THEMES.yellow },
            { id: 4, left: "(1/x)'", right: f("1", "x²", "-"), icon: "fa-cat", themeColor: THEMES.yellow },
            
            { id: 13, left: "(5)'", right: "0", icon: "fa-cat", themeColor: THEMES.yellow },
            { id: 14, left: "(x³)'", right: "3x²", icon: "fa-cat", themeColor: THEMES.yellow },
            { id: 15, left: "(4√x)'", right: f("2", "√x"), icon: "fa-cat", themeColor: THEMES.yellow },
            { id: 16, left: "(3/x)'", right: f("3", "x²", "-"), icon: "fa-cat", themeColor: THEMES.yellow },
            
            { id: 5, left: "(u+v)'", right: "u'+v'", icon: "fa-hippo", themeColor: THEMES.cyan },
            { id: 6, left: "(u-v)'", right: "u'-v'", icon: "fa-hippo", themeColor: THEMES.cyan },
            { id: 7, left: "(u.v)'", right: "u'v+uv'", icon: "fa-hippo", themeColor: THEMES.cyan },
            { id: 8, left: "(u/v)'", right: f("u'v-uv'", "v²"), icon: "fa-hippo", themeColor: THEMES.cyan },
            
            { id: 17, left: "(x²+x)'", right: "2x+1", icon: "fa-hippo", themeColor: THEMES.cyan },
            { id: 18, left: "(x³-x)'", right: "3x²-1", icon: "fa-hippo", themeColor: THEMES.cyan },
            { id: 19, left: "(x.sin x)'", right: "sin x+x.cos x", icon: "fa-hippo", themeColor: THEMES.cyan },
            { id: 20, left: "(x/eˣ)'", right: f("1-x", "eˣ"), icon: "fa-hippo", themeColor: THEMES.cyan },
            
            { id: 9, left: "(sin x)'", right: "cos x", icon: "fa-otter", themeColor: THEMES.pink },
            { id: 10, left: "(cos x)'", right: "-sin x", icon: "fa-otter", themeColor: THEMES.pink },
            { id: 11, left: "(tan x)'", right: f("1", "cos²x"), icon: "fa-otter", themeColor: THEMES.pink },
            { id: 12, left: "(eˣ)'", right: "eˣ", icon: "fa-otter", themeColor: THEMES.pink },
            
            { id: 21, left: "(2sin x)'", right: "2cos x", icon: "fa-otter", themeColor: THEMES.pink },
            { id: 22, left: "(3cos x)'", right: "-3sin x", icon: "fa-otter", themeColor: THEMES.pink },
            { id: 23, left: "(2tan x)'", right: f("2", "cos²x"), icon: "fa-otter", themeColor: THEMES.pink },
            { id: 24, left: "(5eˣ)'", right: "5eˣ", icon: "fa-otter", themeColor: THEMES.pink }
        ];

        const LEVEL2_PAIRS = [
            { id: 1, left: "(uⁿ)'", right: "n.uⁿ⁻¹u'", icon: "fa-dog", themeColor: THEMES.green },
            { id: 2, left: "(√u)'", right: f("u'", "2√u"), icon: "fa-dog", themeColor: THEMES.green },
            { id: 3, left: "(1/u)'", right: f("u'", "u²", "-"), icon: "fa-dog", themeColor: THEMES.green },
            { id: 4, left: "(eᵘ)'", right: "u'.eᵘ", icon: "fa-dog", themeColor: THEMES.green },
            
            { id: 13, left: "((2x+1)³)'", right: "6(2x+1)²", icon: "fa-dog", themeColor: THEMES.green },
            { id: 14, left: "(√(x²+1))'", right: f("x", "√(x²+1)"), icon: "fa-dog", themeColor: THEMES.green },
            { id: 15, left: "(1/(2x-1))'", right: f("2", "(2x-1)²", "-"), icon: "fa-dog", themeColor: THEMES.green },
            { id: 16, left: "(e²ˣ)'", right: "2e²ˣ", icon: "fa-dog", themeColor: THEMES.green },
            
            { id: 5, left: "(sin u)'", right: "u'.cos u", icon: "fa-kiwi-bird", themeColor: THEMES.orange },
            { id: 6, left: "(cos u)'", right: "-u'.sin u", icon: "fa-kiwi-bird", themeColor: THEMES.orange },
            { id: 7, left: "(tan u)'", right: f("u'", "cos²u"), icon: "fa-kiwi-bird", themeColor: THEMES.orange },
            { id: 8, left: "(cot u)'", right: f("u'", "sin²u", "-"), icon: "fa-kiwi-bird", themeColor: THEMES.orange },
            
            { id: 17, left: "(sin 3x)'", right: "3cos 3x", icon: "fa-kiwi-bird", themeColor: THEMES.orange },
            { id: 18, left: "(cos x²)'", right: "-2x sin x²", icon: "fa-kiwi-bird", themeColor: THEMES.orange },
            { id: 19, left: "(tan 2x)'", right: f("2", "cos²2x"), icon: "fa-kiwi-bird", themeColor: THEMES.orange },
            { id: 20, left: "(cot 3x)'", right: f("3", "sin²3x", "-"), icon: "fa-kiwi-bird", themeColor: THEMES.orange },
            
            { id: 9, left: "(ln x)'", right: f("1", "x"), icon: "fa-fish", themeColor: THEMES.purple },
            { id: 10, left: "(ln u)'", right: f("u'", "u"), icon: "fa-fish", themeColor: THEMES.purple },
            { id: 11, left: "(aˣ)'", right: "aˣ.ln a", icon: "fa-fish", themeColor: THEMES.purple },
            { id: 12, left: "(logₐx)'", right: f("1", "x ln a"), icon: "fa-fish", themeColor: THEMES.purple },
            
            { id: 21, left: "(3ln x)'", right: f("3", "x"), icon: "fa-fish", themeColor: THEMES.purple },
            { id: 22, left: "(ln(x²+1))'", right: f("2x", "x²+1"), icon: "fa-fish", themeColor: THEMES.purple },
            { id: 23, left: "(2ˣ)'", right: "2ˣ.ln 2", icon: "fa-fish", themeColor: THEMES.purple },
            { id: 24, left: "(log₂x)'", right: f("1", "x ln 2"), icon: "fa-fish", themeColor: THEMES.purple }
        ];

        const ROWS = 8, COLS = 10;
        const PLAY_ROWS = 6, PLAY_COLS = 8;

        const DEFAULT_LOGO = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

        let state = {
            view: 'menu', level: 1, grid: [], selected: null, errorTiles: null,
            score: 0, timeLeft: 300, shufflesLeft: 3, timerId: null,
            isAnimating: false, logoSrc: DEFAULT_LOGO,
            leaderboard: [
                { name: "Thầy Hùng Pro", score: 15000, level: 2 },
                { name: "Học sinh giỏi", score: 12000, level: 1 },
                { name: "Người chơi hệ Toán", score: 8000, level: 2 }
            ]
        };

        function findPikachuPath(grid, r1, c1, r2, c2) {
            const checkLine = (rA, cA, rB, cB) => {
                if (rA !== rB && cA !== cB) return false;
                if (rA === rB) {
                    const min = Math.min(cA, cB), max = Math.max(cA, cB);
                    for (let i = min + 1; i < max; i++) if (grid[rA][i] !== null) return false;
                    return true;
                } else {
                    const min = Math.min(rA, rB), max = Math.max(rA, rB);
                    for (let i = min + 1; i < max; i++) if (grid[i][cA] !== null) return false;
                    return true;
                }
            };

            if (checkLine(r1, c1, r2, c2)) return [{ r: r1, c: c1 }, { r: r2, c: c2 }];

            const C1 = { r: r1, c: c2 };
            if (grid[C1.r][C1.c] === null && checkLine(r1, c1, C1.r, C1.c) && checkLine(C1.r, C1.c, r2, c2)) return [{ r: r1, c: c1 }, C1, { r: r2, c: c2 }];
            
            const C2 = { r: r2, c: c1 };
            if (grid[C2.r][C2.c] === null && checkLine(r1, c1, C2.r, C2.c) && checkLine(C2.r, C2.c, r2, c2)) return [{ r: r1, c: c1 }, C2, { r: r2, c: c2 }];

            const getCross = (r, c) => {
                let pts = [];
                for (let i = c - 1; i >= 0; i--) { if (grid[r][i] === null) pts.push({ r, c: i }); else break; }
                for (let i = c + 1; i < COLS; i++) { if (grid[r][i] === null) pts.push({ r, c: i }); else break; }
                for (let i = r - 1; i >= 0; i--) { if (grid[i][c] === null) pts.push({ r: i, c }); else break; }
                for (let i = r + 1; i < ROWS; i++) { if (grid[i][c] === null) pts.push({ r: i, c }); else break; }
                return pts;
            };

            const cross1 = getCross(r1, c1);
            const cross2 = getCross(r2, c2);

            for (let p1 of cross1) {
                for (let p2 of cross2) {
                    if (p1.r === p2.r || p1.c === p2.c) {
                        if (checkLine(p1.r, p1.c, p2.r, p2.c)) return [{ r: r1, c: c1 }, p1, p2, { r: r2, c: c2 }];
                    }
                }
            }
            return null;
        }

        function checkPlayable(currentGrid) {
            let remaining = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (currentGrid[r][c]) remaining.push({ r, c, item: currentGrid[r][c] });
                }
            }
            if (remaining.length === 0) return true;

            for (let i = 0; i < remaining.length; i++) {
                for (let j = i + 1; j < remaining.length; j++) {
                    if (remaining[i].item.matchValue === remaining[j].item.matchValue && remaining[i].item.side !== remaining[j].item.side) {
                        if (findPikachuPath(currentGrid, remaining[i].r, remaining[i].c, remaining[j].r, remaining[j].c)) return true;
                    }
                }
            }
            return false;
        }

        function shuffleBoard(currentGrid) {
            let remaining = [], positions = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (currentGrid[r][c]) {
                        remaining.push(currentGrid[r][c]);
                        positions.push({ r, c });
                    }
                }
            }
            remaining.sort(() => Math.random() - 0.5);
            
            let nextGrid = currentGrid.map(row => [...row]);
            positions.forEach((pos, idx) => {
                nextGrid[pos.r][pos.c] = { ...remaining[idx], r: pos.r, c: pos.c };
            });
            return nextGrid;
        }

        function startGame(level) {
            state.level = level;
            let pairsInfo = level === 1 ? LEVEL1_PAIRS : LEVEL2_PAIRS;
            let items = [], idCounter = 0;

            pairsInfo.forEach(pair => {
                items.push({ uniqueId: idCounter++, pairId: pair.id, side: 'left', display: pair.left, matchValue: pair.right, icon: pair.icon, themeColor: pair.themeColor });
                items.push({ uniqueId: idCounter++, pairId: pair.id, side: 'right', display: pair.right, matchValue: pair.right, icon: pair.icon, themeColor: pair.themeColor });
            });
            items.sort(() => Math.random() - 0.5);

            let newGrid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
            let itemIdx = 0;
            for (let r = 1; r <= PLAY_ROWS; r++) {
                for (let c = 1; c <= PLAY_COLS; c++) {
                    newGrid[r][c] = { ...items[itemIdx++], r, c };
                }
            }

            while (!checkPlayable(newGrid)) newGrid = shuffleBoard(newGrid);

            state.grid = newGrid;
            state.selected = null;
            state.score = 0;
            state.timeLeft = 300;
            state.shufflesLeft = 3;
            state.view = 'playing';
            
            clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                if (state.timeLeft > 0) {
                    state.timeLeft--;
                    renderGameHeader();
                } else {
                    clearInterval(state.timerId);
                    showGameOverModal(false);
                }
            }, 1000);

            renderApp();
        }

        function handleTileClick(r, c) {
            if (state.isAnimating || !state.grid[r][c]) return;

            if (state.selected && state.selected.r === r && state.selected.c === c) {
                state.selected = null;
                renderBoard();
                return;
            }

            if (!state.selected) {
                state.selected = { r, c };
                renderBoard();
                return;
            }

            const r1 = state.selected.r, c1 = state.selected.c;
            const item1 = state.grid[r1][c1];
            const item2 = state.grid[r][c];

            if (item1.matchValue === item2.matchValue && item1.side !== item2.side) {
                const path = findPikachuPath(state.grid, r1, c1, r, c);
                if (path) {
                    state.isAnimating = true;
                    state.selected = { r, c };
                    renderBoard();
                    drawPath(path);

                    setTimeout(() => {
                        state.grid[r1][c1] = null;
                        state.grid[r][c] = null;
                        state.selected = null;
                        state.score += 100;
                        document.getElementById('path-svg').innerHTML = '';
                        
                        let isWin = true;
                        for (let row = 0; row < ROWS; row++) {
                            for (let col = 0; col < COLS; col++) {
                                if (state.grid[row][col] !== null) isWin = false;
                            }
                        }

                        if (isWin) {
                            clearInterval(state.timerId);
                            showGameOverModal(true);
                        } else if (!checkPlayable(state.grid)) {
                            if (state.shufflesLeft > 0) {
                                state.grid = shuffleBoard(state.grid);
                                state.shufflesLeft--;
                                showToast("Hết đường! Đã tự động xáo trộn.");
                            } else {
                                clearInterval(state.timerId);
                                showGameOverModal(false);
                            }
                        }
                        
                        state.isAnimating = false;
                        renderApp();
                    }, 400);
                } else {
                    showToast("Đúng cặp nhưng bị chặn đường mất rồi!");
                    state.selected = null;
                    renderBoard();
                }
            } else {
                if (item1.matchValue === item2.matchValue && item1.side === item2.side) {
                    showToast("Cùng một vế rồi! Chọn 1 Hàm số và 1 Đạo hàm nhé.");
                } else if (item1.icon === item2.icon) {
                    showToast("Sai toán rồi! Đừng để màu sắc đánh lừa nhé 😉");
                }
                
                // Gắn cờ lỗi để render CSS rung lắc đỏ
                state.errorTiles = [{r: r1, c: c1}, {r, c}];
                state.isAnimating = true;
                renderBoard();
                
                // Sau 400ms (thời gian rung xong) thì trả lại trạng thái cũ
                setTimeout(() => {
                    state.errorTiles = null;
                    state.selected = null;
                    state.isAnimating = false;
                    renderBoard();
                }, 400);
            }
        }

        function manualShuffle() {
            if (state.shufflesLeft > 0 && !state.isAnimating) {
                state.grid = shuffleBoard(state.grid);
                state.shufflesLeft--;
                state.selected = null;
                renderApp();
            }
        }

        function handleLogoUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    state.logoSrc = event.target.result;
                    renderApp(); 
                };
                reader.readAsDataURL(file);
            }
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (state.view === 'menu') {
                app.innerHTML = `
                    <div class="mt-8 bg-slate-900/40 backdrop-blur-2xl border border-white/10 rounded-[2rem] shadow-[0_0_50px_rgba(0,0,0,0.8)] p-8 max-w-md w-full text-center relative overflow-hidden">
                        
                        <div class="flex items-center gap-4 mb-8 justify-center">
                            <label class="cursor-pointer relative group flex-shrink-0">
                                <input type="file" class="hidden" accept="image/*" onchange="handleLogoUpload(event)">
                                <div class="w-[72px] h-[72px] rounded-full border-[3px] border-cyan-400 p-1 shadow-[0_0_20px_rgba(34,211,238,0.5)] overflow-hidden flex items-center justify-center relative">
                                    <img src="${state.logoSrc}" class="w-full h-full object-cover rounded-full">
                                    <div class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded-full">
                                        <i class="fas fa-camera text-white text-sm"></i>
                                    </div>
                                </div>
                            </label>
                            <div class="text-left">
                                <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-400 drop-shadow-md">TOÁN PRO - THẦY HÙNG</h2>
                                <p class="text-[10px] text-cyan-200/80 font-bold uppercase tracking-widest bg-cyan-900/40 inline-block px-3 py-1 rounded-full mt-1 border border-cyan-500/30">Pikachu Đạo Hàm</p>
                            </div>
                        </div>
                        
                        <div class="space-y-4 relative z-10">
                            <button onclick="startGame(1)" class="group w-full py-4 px-6 bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-bold rounded-2xl flex items-center justify-between transition-all duration-300 hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(225,29,72,0.4)] border border-pink-500/50">
                                <div class="flex flex-col text-left">
                                    <span class="text-xl tracking-tight">Level 1 - Bảng 48 Ô</span>
                                    <span class="text-xs font-medium text-pink-200">Các quy tắc tính đạo hàm cơ bản</span>
                                </div>
                                <i class="fas fa-play text-2xl text-white/40 group-hover:text-white/80 transition-colors drop-shadow-md"></i>
                            </button>

                            <button onclick="startGame(2)" class="group w-full py-4 px-6 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-bold rounded-2xl flex items-center justify-between transition-all duration-300 hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(8,145,178,0.4)] border border-cyan-500/50">
                                <div class="flex flex-col text-left">
                                    <span class="text-xl tracking-tight">Level 2 - Bảng 48 Ô</span>
                                    <span class="text-xs font-medium text-blue-200">Đạo hàm hàm hợp phức tạp</span>
                                </div>
                                <i class="fas fa-play text-2xl text-white/40 group-hover:text-white/80 transition-colors drop-shadow-md"></i>
                            </button>

                            <button onclick="showLeaderboardModal()" class="w-full mt-2 py-3 px-6 bg-white/5 hover:bg-white/10 text-white font-bold rounded-2xl border border-white/10 flex items-center justify-center gap-2 transition-all duration-300 hover:scale-105 active:scale-95 shadow-lg">
                                <i class="fas fa-trophy text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.6)]"></i> Bảng Xếp Hạng
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'playing') {
                // Tỷ lệ chuẩn xác cho lưới 10 Cột x 8 Dòng = 10/8. Giới hạn max-width bao gồm cả % màn hình để chống tràn dọc/ngang
                app.innerHTML = `
                    <div id="game-header" class="w-full max-w-[1200px] flex-shrink-0 flex items-center justify-between mb-2 sm:mb-4 bg-slate-900/50 backdrop-blur-xl p-3 px-4 rounded-2xl shadow-xl border border-white/10 relative z-10"></div>

                    <div style="aspect-ratio: 10/8; max-height: calc(100vh - 140px); max-width: min(100vw - 16px, 1200px, calc((100vh - 140px) * 1.25)); width: 100%;" 
                         class="relative bg-slate-950/60 backdrop-blur-2xl rounded-[2rem] shadow-[0_0_80px_rgba(0,0,0,0.8)] border-[4px] border-white/5 p-1 sm:p-2 z-10 flex flex-col mx-auto">
                        
                        <div class="w-full h-full relative" id="game-area">
                            <div id="board-container" class="absolute inset-0"></div>
                            
                            <svg id="path-svg" style="position:absolute; top:-16.666%; left:-12.5%; width:125%; height:133.333%; overflow: visible;" viewBox="0 0 100 80" class="pointer-events-none z-40"></svg>
                        </div>
                        
                        <div id="toast-container" class="absolute inset-0 pointer-events-none flex items-center justify-center z-50 hidden">
                            <div id="toast-msg" class="bg-indigo-900/90 backdrop-blur-md border border-indigo-500/50 text-white px-8 py-4 rounded-2xl font-bold shadow-[0_0_30px_rgba(99,102,241,0.5)] animate-bounce text-lg"></div>
                        </div>
                    </div>
                `;
                renderGameHeader();
                renderBoard();
            }
        }

        function renderGameHeader() {
            const header = document.getElementById('game-header');
            if (!header) return;
            const mins = Math.floor(state.timeLeft / 60);
            const secs = (state.timeLeft % 60).toString().padStart(2, '0');
            const timeColor = state.timeLeft < 60 ? 'text-rose-500 drop-shadow-[0_0_10px_rgba(244,63,94,0.8)] animate-pulse' : 'text-amber-400 drop-shadow-[0_0_8px_rgba(251,191,36,0.6)]';

            header.innerHTML = `
                <div class="flex gap-4 items-center">
                    <button onclick="goToMenu()" class="p-2 sm:p-3 bg-white/5 rounded-xl text-white border border-white/10 hover:bg-white/20 hover:scale-105 transition-all shadow-md">
                        <i class="fas fa-home text-lg"></i>
                    </button>
                    
                    <div class="hidden sm:flex items-center gap-3 border-l border-white/10 pl-4">
                        <img src="${state.logoSrc}" class="w-10 h-10 rounded-full border border-cyan-500/50 shadow-[0_0_10px_rgba(6,182,212,0.4)] object-cover">
                        <div>
                            <div class="text-[10px] text-cyan-200/70 font-bold uppercase tracking-widest leading-none mb-1">TOÁN PRO - THẦY HÙNG</div>
                            <div class="text-xs text-fuchsia-300 font-bold uppercase tracking-widest leading-none">Level ${state.level}</div>
                        </div>
                    </div>

                    <div class="sm:border-l sm:border-white/10 sm:pl-4 pl-2">
                        <div class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-1">Điểm</div>
                        <div class="text-xl sm:text-2xl text-cyan-400 font-black leading-none drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]">${state.score}</div>
                    </div>
                </div>

                <div class="flex items-center gap-4 sm:gap-6">
                    <div class="text-right">
                        <div class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-1">Thời Gian</div>
                        <div class="text-xl sm:text-2xl font-black leading-none ${timeColor}">
                            ${mins}:${secs}
                        </div>
                    </div>
                    <button onclick="manualShuffle()" ${state.shufflesLeft === 0 ? 'disabled' : ''} class="flex items-center justify-center gap-2 w-12 h-12 sm:w-auto sm:px-5 bg-indigo-600 disabled:bg-slate-800 disabled:opacity-50 text-white rounded-xl border border-indigo-400/30 hover:bg-indigo-500 hover:scale-105 active:scale-95 transition-all shadow-[0_0_15px_rgba(79,70,229,0.4)]">
                        <i class="fas fa-sync-alt ${state.shufflesLeft > 0 ? 'animate-[spin_4s_linear_infinite]' : ''}"></i>
                        <span class="font-black text-lg hidden sm:inline">${state.shufflesLeft}</span>
                        <span class="font-black text-sm sm:hidden absolute bottom-1 right-2">${state.shufflesLeft}</span>
                    </button>
                </div>
            `;
        }

        function renderBoard() {
            const board = document.getElementById('board-container');
            if (!board) return;
            board.innerHTML = '';

            for (let r = 1; r <= PLAY_ROWS; r++) {
                for (let c = 1; c <= PLAY_COLS; c++) {
                    const item = state.grid[r][c];
                    if (item) {
                        const isSelected = state.selected && state.selected.r === r && state.selected.c === c;
                        const isError = state.errorTiles && state.errorTiles.some(t => t.r === r && t.c === c);
                        
                        // Lấp đầy trọn vẹn 100% diện tích hộp đen
                        const leftPos = (c - 1) * 12.5; 
                        const topPos = (r - 1) * 16.666;

                        // AI Lập trình tính độ dài chữ tự động scale không bao giờ tràn
                        const rawText = item.display.replace(/<[^>]*>?/gm, '').trim();
                        // Giới hạn an toàn từ 3 đến vô cực để tỷ lệ chia luôn đẹp
                        const textLen = Math.max(3, rawText.length);
                        // Công thức scale Font-size thần thánh (Vừa khít chiều ngang)
                        const fontSize = `clamp(12px, min(30cqw, ${110 / textLen}cqw), 40px)`;

                        let tileClasses = "w-full h-full cursor-pointer relative flex flex-col items-center justify-center overflow-hidden game-tile";
                        if (isSelected) tileClasses += " selected";
                        if (isError) tileClasses += " shake-error";

                        const tileHtml = `
                            <div class="absolute p-[1.5px] sm:p-[2px] transition-all duration-300 z-10" style="left: ${leftPos}%; top: ${topPos}%; width: 12.5%; height: 16.666%;">
                                <div onclick="handleTileClick(${r}, ${c})" 
                                     style="--theme-color: ${item.themeColor};"
                                     class="${tileClasses}">
                                    
                                    <i class="fas ${item.icon} absolute animal-glass pointer-events-none flex items-center justify-center"></i>
                                    
                                    <div class="relative z-10 w-full flex items-center justify-center pointer-events-none px-[2cqw]">
                                        <span class="math-content text-center" style="font-size: ${fontSize};">${item.display}</span>
                                    </div>

                                </div>
                            </div>
                        `;
                        board.insertAdjacentHTML('beforeend', tileHtml);
                    }
                }
            }
        }

        function drawPath(path) {
            const svg = document.getElementById('path-svg');
            if (!svg || !path) return;
            
            const points = path.map(p => `${p.c * 10 + 5},${p.r * 10 + 5}`).join(' ');
            let circlesHtml = path.map(p => `<circle cx="${p.c * 10 + 5}" cy="${p.r * 10 + 5}" r="1.5" fill="#ffffff" class="neon-glow"></circle>`).join('');

            svg.innerHTML = `
                <polyline points="${points}" fill="none" stroke="#00ffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="neon-glow" vector-effect="non-scaling-stroke"></polyline>
                ${circlesHtml}
            `;
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.getElementById('toast-msg');
            if(container && toast) {
                toast.innerText = msg;
                container.classList.remove('hidden');
                setTimeout(() => container.classList.add('hidden'), 2500);
            }
        }

        function goToMenu() {
            clearInterval(state.timerId);
            state.view = 'menu';
            renderApp();
        }

        function showLeaderboardModal() {
            const modalContainer = document.getElementById('modal-container');
            state.leaderboard.sort((a, b) => b.score - a.score);

            let listHtml = state.leaderboard.map((entry, idx) => {
                let badgeClass = "bg-slate-800 text-slate-400 border-slate-700";
                if(idx === 0) badgeClass = "bg-yellow-500/20 text-yellow-400 border-yellow-500/50 shadow-[0_0_10px_rgba(250,204,21,0.3)]";
                else if (idx === 1) badgeClass = "bg-slate-300/20 text-slate-300 border-slate-400/50";
                else if (idx === 2) badgeClass = "bg-orange-500/20 text-orange-400 border-orange-500/50";

                return `
                    <div class="flex items-center justify-between p-3 bg-white/5 border border-white/5 rounded-xl mb-2 hover:bg-white/10 transition-colors">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full border flex items-center justify-center font-bold ${badgeClass}">
                                #${idx + 1}
                            </div>
                            <div>
                                <div class="font-bold text-white text-sm">${entry.name}</div>
                                <div class="text-[10px] text-cyan-400 uppercase tracking-wide">Level ${entry.level}</div>
                            </div>
                        </div>
                        <div class="font-black text-fuchsia-400 drop-shadow-md">${entry.score}</div>
                    </div>
                `;
            }).join('');

            if(state.leaderboard.length === 0) {
                listHtml = `<div class="text-center text-slate-400 py-4 italic">Chưa có ai ghi danh!</div>`;
            }

            modalContainer.innerHTML = `
                <div class="bg-slate-900/90 backdrop-blur-xl border border-white/10 rounded-[2rem] p-6 sm:p-8 max-w-sm w-full shadow-[0_0_50px_rgba(0,0,0,0.8)] relative animate-[scaleIn_0.3s_ease-out]">
                    <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 bg-white/5 rounded-full flex items-center justify-center text-white/50 hover:text-white hover:bg-red-500/80 transition-all">
                        <i class="fas fa-times"></i>
                    </button>
                    
                    <div class="text-center mb-6">
                        <div class="inline-block p-4 bg-yellow-500/10 rounded-full mb-2 border border-yellow-500/30">
                            <i class="fas fa-trophy text-3xl text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.6)]"></i>
                        </div>
                        <h2 class="text-2xl font-black text-white">Bảng Xếp Hạng</h2>
                        <p class="text-xs text-slate-400">TOÁN PRO - THẦY HÙNG - Cao thủ Đạo Hàm</p>
                    </div>

                    <div class="max-h-60 overflow-y-auto pr-2">
                        ${listHtml}
                    </div>
                </div>
            `;
            modalContainer.classList.remove('hidden');
        }

        function showGameOverModal(isWin) {
            const modalContainer = document.getElementById('modal-container');
            const title = isWin ? 'Tuyệt Vời!' : 'Hết Giờ!';
            const subtitle = isWin ? `Bạn đã phá đảo Level ${state.level}.` : 'Không còn đường đi hoặc đã hết thời gian.';
            const icon = isWin ? '<i class="fas fa-trophy text-6xl text-yellow-400 relative z-10 drop-shadow-[0_0_20px_rgba(250,204,21,0.6)]"></i>' : '<i class="fas fa-skull text-6xl text-rose-500 relative z-10 drop-shadow-[0_0_20px_rgba(244,63,94,0.6)]"></i>';

            modalContainer.innerHTML = `
                <div class="bg-slate-900/90 backdrop-blur-xl border border-white/10 rounded-[2rem] p-8 max-w-sm w-full text-center shadow-[0_0_50px_rgba(0,0,0,0.9)] animate-[scaleIn_0.3s_ease-out]">
                    <div class="relative inline-block mb-6">
                        <div class="absolute inset-0 bg-white/10 blur-xl opacity-50 rounded-full"></div>
                        ${icon}
                    </div>
                    
                    <h2 class="text-3xl font-black text-white mb-2">${title}</h2>
                    <p class="text-sm text-slate-400 mb-6 font-medium">${subtitle}</p>
                    
                    <div class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-400 mb-6 drop-shadow-[0_0_15px_rgba(34,211,238,0.4)]">
                        ${state.score} <span class="text-sm text-slate-500 font-bold tracking-widest uppercase">PTS</span>
                    </div>

                    <div class="mb-6 text-left">
                        <label class="block text-xs text-cyan-400 font-bold uppercase mb-2">Lưu tên vào Bảng Xếp Hạng:</label>
                        <input type="text" id="playerName" placeholder="Nhập tên của bạn..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all shadow-inner">
                    </div>
                    
                    <div class="flex gap-3">
                        <button onclick="handleSaveAndMenu()" class="flex-1 py-3 bg-white/5 border border-white/10 text-white font-bold rounded-xl hover:bg-white/10 transition-colors">
                            Menu
                        </button>
                        <button onclick="handleSaveAndReplay()" class="flex-1 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 border border-cyan-400/50 text-white font-bold rounded-xl hover:scale-105 active:scale-95 transition-all shadow-[0_0_20px_rgba(8,145,178,0.5)]">
                            Chơi Lại
                        </button>
                    </div>
                </div>
            `;
            modalContainer.classList.remove('hidden');
            
            setTimeout(() => {
                const input = document.getElementById('playerName');
                if(input) input.focus();
            }, 100);
        }

        function saveScoreData() {
            const nameInput = document.getElementById('playerName');
            const name = nameInput && nameInput.value.trim() ? nameInput.value.trim() : "Học sinh ẩn danh";
            if (state.score > 0) {
                state.leaderboard.push({ name, score: state.score, level: state.level });
            }
        }

        function handleSaveAndMenu() { saveScoreData(); closeModal(); goToMenu(); }
        function handleSaveAndReplay() { saveScoreData(); closeModal(); startGame(state.level); }
        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }`;
        document.head.appendChild(style);

        renderApp();
    </script>
</body>
</html>
